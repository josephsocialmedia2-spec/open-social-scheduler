name: F1 Project Deploy Validation

on:
  push:
    paths:
      - '.project-deploy-trigger'
      - 'publisher/**'
      - '.github/workflows/project-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r publisher/requirements.txt

      - name: Compile publisher and graphic engines
        run: |
          python -m py_compile publisher/final_asset_publisher.py
          python -m py_compile publisher/buffer_twice_daily.py
          python -m py_compile publisher/graphic_engines/*.py
          python -m py_compile publisher/rendering/content_engine.py

      - name: Validate production queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('publisher/final_content_queue.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['pipeline'] == 'f1-final-assets'
          assert data['asset_policy'] == 'immutable-final-layout'
          assert data['brand'] == 'F1 Immobiliare'
          assert set(data['platforms']) == {'facebook','instagram','linkedin'}
          print('Queue schema OK')
          PY

      - name: Graphic engine healthcheck
        env:
          COMFYUI_URL: ${{ secrets.COMFYUI_URL }}
          COMFYUI_WORKFLOW: ${{ vars.COMFYUI_WORKFLOW }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          F1_HTTP_GRAPHIC_URL: ${{ secrets.F1_HTTP_GRAPHIC_URL }}
          F1_GRAPHIC_ENGINE_ORDER: ${{ vars.F1_GRAPHIC_ENGINE_ORDER }}
        run: python -m publisher.graphic_engines.healthcheck

      - name: Deployment summary
        run: |
          echo 'F1 project deployment validation completed successfully.'
          echo 'Repository: josephsocialmedia2-spec/open-social-scheduler'
          echo 'Branch: main'
