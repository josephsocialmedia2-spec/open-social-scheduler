name: Provision Postiz on Hetzner

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Public Postiz hostname'
        required: true
        default: 'social.realmediapro.it'
        type: string
      server_type:
        description: 'Hetzner server type'
        required: true
        default: 'cx33'
        type: string
      location:
        description: 'Hetzner location'
        required: true
        default: 'nbg1'
        type: string

permissions:
  contents: read

concurrency:
  group: provision-postiz-hetzner
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HCLOUD_TOKEN: ${{ secrets.HETZNER_TOKEN }}
      POSTIZ_DOMAIN: ${{ inputs.domain }}
      POSTIZ_SERVER_TYPE: ${{ inputs.server_type }}
      POSTIZ_SERVER_LOCATION: ${{ inputs.location }}
      POSTIZ_SERVER_NAME: open-social-postiz
      POSTIZ_SERVER_IMAGE: ubuntu-24.04
      POSTIZ_SSH_PUBLIC_KEY: ${{ secrets.POSTIZ_SSH_PUBLIC_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Hetzner token
        shell: bash
        run: |
          if [ -z "${HCLOUD_TOKEN:-}" ]; then
            echo 'Missing repository secret HETZNER_TOKEN.' >&2
            echo 'Create a Hetzner Cloud project API token with Read & Write permission and store it as HETZNER_TOKEN.' >&2
            exit 2
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install official Hetzner client
        run: pip install 'hcloud==2.23.0' 'requests==2.32.5'

      - name: Validate provisioning script
        run: python -m py_compile infra/hetzner/provision.py

      - name: Provision or reuse server
        run: python infra/hetzner/provision.py

      - name: Publish connection summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/postiz-provision.json').read_text())
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
              f.write('## Open Social Scheduler / Postiz\n\n')
              f.write(f"- Server: `{d['server_name']}` / `{d['server_type']}` / `{d['location']}`\n")
              f.write(f"- IPv4: `{d['ipv4']}`\n")
              f.write(f"- URL: {d['postiz_url']}\n")
              f.write('- Cloud-init installs Docker, Postiz, Caddy HTTPS and the automatic update timer.\n')
          PY

      - name: Wait for bootstrap endpoint
        continue-on-error: true
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSIL --max-time 15 "https://$POSTIZ_DOMAIN" >/dev/null; then
              echo "Postiz is reachable: https://$POSTIZ_DOMAIN"
              exit 0
            fi
            sleep 10
          done
          echo 'Server was provisioned, but HTTPS is not ready yet. This is expected if Cloudflare DNS credentials were not supplied or DNS propagation is pending.'
