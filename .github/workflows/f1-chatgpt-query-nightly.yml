name: F1 ChatGPT Query Nightly

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.f1-chatgpt-query-test-trigger'

permissions:
  contents: write

concurrency:
  group: f1-chatgpt-query-nightly
  cancel-in-progress: false

jobs:
  submit-queries:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Selenium
        shell: powershell
        run: pip install -r publisher/chatgpt_query_runner/requirements.txt

      - name: Submit next query batch to ChatGPT
        shell: powershell
        env:
          F1_QUERY_BATCH_SIZE: '4'
          F1_CHROME_PROFILE: ${{ vars.F1_CHROME_PROFILE }}
        run: |
          if ('${{ github.event_name }}' -eq 'schedule') {
            python publisher/chatgpt_query_runner/worker.py --scheduled
          } elseif ('${{ github.event_name }}' -eq 'push') {
            python publisher/chatgpt_query_runner/worker.py --batch-size 1
          } else {
            python publisher/chatgpt_query_runner/worker.py
          }

      - name: Persist query state
        if: always()
        shell: powershell
        run: |
          if (-not (Test-Path 'publisher/chatgpt_query_runner/state.json')) { exit 0 }
          git config user.name 'F1 ChatGPT Query Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add publisher/chatgpt_query_runner/state.json
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'Update ChatGPT query runner state'
          git pull --rebase origin main
          git push origin main
