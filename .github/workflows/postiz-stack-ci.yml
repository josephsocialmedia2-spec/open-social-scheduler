name: Validate Postiz Stack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/postiz-stack-ci.yml'
      - 'postiz-stack/**'

permissions:
  contents: read

jobs:
  clone-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Open Social Scheduler
        uses: actions/checkout@v4

      - name: Clone pinned Postiz upstream
        env:
          POSTIZ_VERSION: v2.22.1
        run: bash postiz-stack/bootstrap_postiz.sh

      - name: Verify upstream license and release
        run: |
          grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' postiz-stack/vendor/postiz-app/LICENSE
          test "$(git -C postiz-stack/vendor/postiz-app describe --tags --exact-match)" = 'v2.22.1'

      - name: Validate shell scripts
        run: |
          bash -n postiz-stack/bootstrap_postiz.sh
          bash -n postiz-stack/start_postiz.sh
          bash -n postiz-stack/install_production_ubuntu.sh
          bash -n postiz-stack/check_ready.sh

      - name: Validate production Docker configuration
        shell: bash
        run: |
          cp postiz-stack/postiz.env.example postiz-stack/postiz.env
          sed -i 's#social.realmediapro.it#social.test.example#g' postiz-stack/postiz.env
          sed -i 's#CHANGE_ME_WITH_A_LONG_RANDOM_SECRET#ci-only-long-random-secret-not-for-production#g' postiz-stack/postiz.env
          export POSTIZ_STACK_DIR="$PWD/postiz-stack"
          docker compose \
            --env-file postiz-stack/postiz.env \
            -f postiz-stack/vendor/postiz-docker-compose/docker-compose.yaml \
            -f postiz-stack/docker-compose.override.yml \
            -f postiz-stack/docker-compose.production.yml \
            config >/dev/null
          echo 'Postiz clone, production overlay and Caddy HTTPS configuration validated.'
