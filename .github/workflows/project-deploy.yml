name: F1 Project Deploy Validation

on:
  push:
    paths:
      - '.project-deploy-trigger'
      - 'publisher/**'
      - '.github/workflows/project-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r publisher/requirements.txt

      - name: Compile production pipeline
        run: |
          python -m py_compile publisher/final_asset_publisher.py
          python -m py_compile publisher/buffer_twice_daily.py
          python -m py_compile publisher/chatgpt_query_runner/worker.py
          python -m py_compile publisher/manual_asset_inbox/server.py

      - name: Validate production queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('publisher/final_content_queue.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['pipeline'] == 'f1-final-assets'
          assert data['asset_policy'] == 'immutable-final-layout'
          assert data['brand'] == 'F1 Immobiliare'
          assert set(data['platforms']) == {'facebook','instagram','linkedin'}
          print('Queue schema OK')
          PY

      - name: Validate query source and manual inbox
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q = Path('publisher/github_graphics/queries.json')
          assert q.exists(), 'publisher/github_graphics/queries.json missing'
          data = json.loads(q.read_text(encoding='utf-8'))
          assert isinstance(data.get('queries'), list) and data['queries'], 'queries list is empty'
          assert Path('publisher/manual_asset_inbox/index.html').exists(), 'manual inbox HTML missing'
          assert Path('publisher/manual_asset_inbox/morning_notice.html').exists(), 'morning notice missing'
          print(f"ChatGPT query source OK: {len(data['queries'])} queries")
          PY

      - name: Deployment summary
        run: |
          echo 'F1 deployment validation completed successfully.'
          echo 'Graphics flow: queries -> ChatGPT browser -> manual download -> local inbox -> GitHub -> Buffer.'
          echo 'No graphic rendering engine is used in production.'
          echo 'Repository: josephsocialmedia2-spec/open-social-scheduler'
          echo 'Branch: main'
