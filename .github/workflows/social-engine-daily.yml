name: Open Social Engine Daily - Prepare Only

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional local date YYYY-MM-DD for controlled test/backfill'
        required: false
        type: string
  schedule:
    - cron: '10 4 * * *'
  push:
    paths:
      - '.github/workflows/social-engine-daily.yml'
      - 'publisher/build_daily_queue.py'
      - 'publisher/render_reels.py'
      - 'publisher/add_reel_subtitles.py'
      - 'publisher/requirements.txt'
      - 'publisher/clients/**'
      - 'publisher/content_bank/**'
      - 'publisher/approvals/**'
      - 'publisher/tests/**'

permissions:
  contents: write
  issues: write

concurrency:
  group: open-social-engine-daily
  cancel-in-progress: true

jobs:
  build-render-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOCIAL_DATE: ${{ inputs.date }}
      SOCIAL_START_OFFSET_DAYS: ${{ github.event_name == 'schedule' && '0' || '1' }}
      PIPER_DATA_DIR: ${{ github.workspace }}/.cache/piper
      SOCIAL_PHOTO_CACHE: ${{ github.workspace }}/.cache/f1-photos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-color-emoji zip
          pip install -r publisher/requirements.txt

      - name: Cache Italian voice and media
        uses: actions/cache@v4
        with:
          path: |
            .cache/piper
            .cache/f1-photos
          key: social-assets-v4-green-captions

      - name: Prepare Italian voice
        run: |
          mkdir -p "$PIPER_DATA_DIR" "$SOCIAL_PHOTO_CACHE"
          if [ ! -f "$PIPER_DATA_DIR/it_IT-paola-medium.onnx" ]; then
            python -m piper.download_voices it_IT-paola-medium --data-dir "$PIPER_DATA_DIR"
          fi

      - name: Validate Python and tenant isolation
        run: |
          python -m py_compile publisher/*.py
          python -m unittest discover -s publisher/tests -v

      - name: Build seven-day queue
        shell: bash
        run: |
          if [ -n "${SOCIAL_DATE:-}" ]; then
            python publisher/build_daily_queue.py --date "$SOCIAL_DATE"
          else
            python publisher/build_daily_queue.py
          fi

      - name: Render weekly Reels and carousels
        run: python publisher/render_reels.py

      - name: Add green emoji captions to Reels
        run: python publisher/add_reel_subtitles.py

      - name: Reconcile approval and media state
        shell: bash
        run: |
          if [ -n "${SOCIAL_DATE:-}" ]; then
            python publisher/build_daily_queue.py --date "$SOCIAL_DATE"
          else
            python publisher/build_daily_queue.py
          fi

      - name: Upload preview package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-preview-${{ github.run_id }}
          path: publisher/media/generated
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist prepared queue
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- publisher/queue.json; then
            echo 'Queue unchanged.'
          else
            git config user.name 'open-social-engine'
            git config user.email 'open-social-engine@users.noreply.github.com'
            git add publisher/queue.json
            git commit -m 'Prepare approval-gated social queue'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Publish latest downloadable media
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d publisher/media/generated ] || [ -z "$(find publisher/media/generated -type f -print -quit 2>/dev/null)" ]; then
            echo 'No generated media available for downloadable preview.'
            exit 0
          fi
          rm -rf /tmp/social-release
          mkdir -p /tmp/social-release
          while IFS= read -r -d '' file; do
            rel="${file#publisher/media/generated/}"
            safe="${rel//\//__}"
            cp "$file" "/tmp/social-release/$safe"
          done < <(find publisher/media/generated -type f -print0)
          for client in f1-immobiliare real-media-pro; do
            if [ -d "publisher/media/generated/$client" ]; then
              (cd "publisher/media/generated/$client" && zip -qr "/tmp/social-release/${client}__SETTIMANA_COMPLETA.zip" .)
            fi
          done
          cp publisher/queue.json /tmp/social-release/queue.json
          gh release delete social-preview-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create social-preview-latest /tmp/social-release/* \
            --title "Contenuti social pronti - F1 Immobiliare + Real Media Pro" \
            --notes "Pacchetto settimanale: Reel MP4 con logo, sottotitoli verdi/emoji e CTA WhatsApp; caroselli JPG e ZIP completi per entrambi i brand. Generato dal workflow ${GITHUB_RUN_ID}."

      - name: Resolve Rome week
        id: week
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Europe/Rome'))
          iso = now.date().isocalendar()
          print(f"key={iso.year}-W{iso.week:02d}")
          print(f"monday={'true' if now.weekday() == 0 else 'false'}")
          print(f"date={now.date().isoformat()}")
          PY

      - name: Request one weekly confirmation
        if: steps.week.outputs.monday == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const key = '${{ steps.week.outputs.key }}';
            const title = `[SOCIAL-WEEK] ${key} - conferma richiesta`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100});
            if (existing.some(i => i.title === title)) return;
            const body = [
              `GitHub ha preparato il pacchetto social F1 + Real Media Pro per **${key}**.`,
              '',
              '**Nessun contenuto viene pubblicato prima della tua conferma.**',
              '',
              `Controlla e scarica i contenuti: https://josephsocialmedia2-spec.github.io/open-social-scheduler/monday-control.html`,
              `Se va bene, rispondi a questa issue scrivendo esattamente: **CONFERMO**`,
              '',
              'Per bloccare i contenuti non ancora pubblicati della settimana puoi scrivere **REVOCA**.'
            ].join('\n');
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});