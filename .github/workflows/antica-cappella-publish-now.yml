name: Antica Cappella Publish Now

on:
  push:
    branches: [main]
    paths:
      - '.antica-cappella-publish-now-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-antica-cappella:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTICACAPPELLA_BUFFER_API_KEY: ${{ secrets.ANTICACAPPELLA_BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r publisher/requirements.txt
      - name: Publish only to Antica Cappella Instagram
        run: PYTHONPATH=publisher python publisher/antica_cappella_publish_now.py
