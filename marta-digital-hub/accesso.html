<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Entra nel Marta Digital Hub</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17223a;background:#f6f4f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#14243d,#304c74 55%,#efdbe3)}main{width:min(450px,100%);background:#fff;border-radius:26px;padding:30px;box-shadow:0 25px 70px #0004}.mark{width:56px;height:56px;border-radius:18px;background:#efd9e1;display:grid;place-items:center;font:700 23px Georgia;color:#432c36}h1{margin:14px 0 7px}p{line-height:1.5;color:#687386}.okbox{background:#eaf6f0;border:1px solid #cbe9db;color:#23634f;border-radius:12px;padding:12px;margin:16px 0}label{display:grid;gap:7px;font-weight:700;margin-top:10px}input{font:inherit;width:100%;padding:13px;border:1px solid #dce2ec;border-radius:11px}button{font:inherit;width:100%;border:0;border-radius:12px;padding:14px;margin-top:14px;background:#27456f;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.msg{min-height:24px;font-size:14px;color:#8b3040;margin-top:12px}.ok{color:#237158}.small{font-size:12px;color:#7b8494}</style></head><body><main><div class="mark">MR</div><h1>Entra nel Digital Hub</h1><div class="okbox"><b>Accesso riservato</b><br>Usa l’email e la password del tuo account autorizzato.</div><form id="f"><label>Email<input id="email" type="email" autocomplete="username" required maxlength="254" placeholder="La tua email"></label><label>Password<input id="pw" type="password" minlength="8" maxlength="256" autocomplete="current-password" required placeholder="La tua password"></label><button id="go" type="submit">ENTRA NEL DIGITAL HUB</button></form><p id="msg" class="msg" aria-live="polite"></p><p class="small">La registrazione pubblica è disattivata: il Digital Hub accetta solo account già autorizzati.</p></main><script>const U='https://nqnmlsmeiynxbdojeyjt.supabase.co',K='sb_publishable_Clz5qPTkTtvwV0rqWTcfMQ_sCDSRgnu',TIMEOUT_MS=15000,m=document.getElementById('msg'),p=document.getElementById('pw'),e=document.getElementById('email'),f=document.getElementById('f'),b=document.getElementById('go');function storedSession(){try{return JSON.parse(localStorage.getItem('mr_session')||sessionStorage.getItem('mr_session')||'null')}catch{return null}}function validStored(){let s=storedSession();return !!(s?.access_token&&s?.refresh_token&&s?.user?.id)}if(validStored())location.replace('./app.html?v=12');function friendlyError(err){if(err?.name==='AbortError')return 'La richiesta sta impiegando troppo tempo. Controlla la connessione e riprova.';let raw=String(err?.message||err||'Operazione non riuscita');if(/failed to fetch|networkerror|load failed|network request failed/i.test(raw))return 'Connessione non disponibile. Email e password restano nella pagina: controlla la rete e riprova.';if(/invalid login credentials/i.test(raw))return 'Email o password non corrette.';if(/email not confirmed/i.test(raw))return 'Email non ancora confermata.';if(/rate limit|too many/i.test(raw))return 'Troppi tentativi. Riprova più tardi.';return raw}async function req(path,body){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),TIMEOUT_MS);let r;try{r=await fetch(U+'/auth/v1/'+path,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal})}catch(err){throw Error(friendlyError(err))}finally{clearTimeout(timer)}let t=await r.text(),d;try{d=JSON.parse(t)}catch{d={message:t}}if(!r.ok)throw Error(friendlyError(d.msg||d.error_description||d.message||d.error||('Supabase Auth '+r.status)));return d}async function enter(s){if(!s?.access_token||!s?.refresh_token||!s?.user?.id)throw Error('Sessione di accesso non valida.');let raw=JSON.stringify(s);localStorage.setItem('mr_session',raw);sessionStorage.setItem('mr_session',raw);m.className='msg ok';m.textContent='✓ Accesso riuscito. Apro il Digital Hub…';location.replace('./app.html?v=12')}f.onsubmit=async x=>{x.preventDefault();if(b.disabled)return;m.className='msg';if(!e.checkValidity()){m.textContent='Inserisci un indirizzo email valido.';e.focus();return}if(p.value.length<8){m.textContent='La password deve avere almeno 8 caratteri.';p.focus();return}b.disabled=true;m.textContent='Accesso in corso…';try{await enter(await req('token?grant_type=password',{email:e.value.trim().toLowerCase(),password:p.value}))}catch(err){m.textContent=friendlyError(err);b.disabled=false}};</script></body></html>
