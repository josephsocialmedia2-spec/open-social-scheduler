name: Backfill last 3 days photo releases

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/backfill-photo-history.yml'
      - 'publisher/backfill_recent_releases.py'

permissions:
  contents: write

concurrency:
  group: backfill-photo-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image support
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Rebuild the last three days
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publisher/backfill_recent_releases.py
      - name: Create missing immutable releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in /tmp/social-backfill/social-preview-archive-*; do
            tag=$(basename "$dir")
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already exists"
              continue
            fi
            cycle=${tag#social-preview-archive-}
            files=("$dir"/*)
            gh release create "$tag" "${files[@]}" \
              --title "ARCHIVIO CONTENUTI - ciclo $cycle" \
              --notes "Release ricostruita per lo storico mobile degli ultimi 3 giorni. Caption originali e fotografie recuperate dalle fonti registrate o dalle cartelle manuali configurate."
          done
