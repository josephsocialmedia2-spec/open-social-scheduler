name: F1 GitHub Graphics Batch

on:
  push:
    paths:
      - 'publisher/github_graphics/**'
      - '.github/workflows/f1-github-graphics-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f1-github-graphics-batch
  cancel-in-progress: false

jobs:
  generate-graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow==11.3.0

      - name: Generate four F1 graphics on GitHub runner
        run: python publisher/github_graphics/generate_batch.py

      - name: Verify generated assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path('publisher/final_assets/github_generated').glob('*.png'))
          assert len(files) == 4, f'Expected 4 PNGs, found {len(files)}'
          for p in files:
              with Image.open(p) as im:
                  assert im.size == (1080, 1350), (p, im.size)
              assert p.stat().st_size > 10000, (p, p.stat().st_size)
              print(p, p.stat().st_size)
          PY

      - name: Commit graphics to repository
        run: |
          git config user.name 'F1 GitHub Graphics Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add publisher/final_assets/github_generated
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Generate first four Susa graphics on GitHub'
          git pull --rebase origin main
          git push origin main

      - name: Summary
        run: |
          echo '### F1 GitHub Graphics' >> "$GITHUB_STEP_SUMMARY"
          echo '- Generated by GitHub Actions runner' >> "$GITHUB_STEP_SUMMARY"
          echo '- 4 assets' >> "$GITHUB_STEP_SUMMARY"
          echo '- 1080x1350 PNG' >> "$GITHUB_STEP_SUMMARY"
          echo '- Destination: publisher/final_assets/github_generated/' >> "$GITHUB_STEP_SUMMARY"
