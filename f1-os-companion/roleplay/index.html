<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Role Play Immobiliare</title><style>body{margin:0;font-family:system-ui;background:#0b1020;color:#edf2ff}.app{max-width:760px;margin:auto;padding:14px 14px 90px}.panel{background:#151d33;border-radius:18px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.small{font-size:.82rem;color:#aab4cb}.client,.reply{font-size:1.12rem;line-height:1.5;padding:14px;border-radius:14px;margin-top:8px}.client{background:#202a46}.reply{background:#17281f}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions>*{flex:1}.btn,button,select,input{border:0;border-radius:11px;padding:11px;font:inherit}.primary{background:#3b82f6;color:white;font-weight:800}.secondary{background:#25304e;color:#e8eefc}.ok{background:#1f7a4c;color:#fff}.warn{background:#8a5a13;color:#fff}.hidden{filter:blur(8px);user-select:none}.mode.active{outline:2px solid #60a5fa}.progress{height:9px;background:#27324f;border-radius:999px;overflow:hidden;margin-top:12px}.bar{height:100%;background:#60a5fa}.stats{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:#aab4cb;margin-top:8px}</style></head><body><main class="app"><div class="panel"><h1>Role Play Immobiliare</h1><div class="small">Cliente a voce · tua battuta sul telefono</div></div><section class="panel"><div class="grid"><label>Scenario<select id="category"></select></label><label>Voce cliente<select id="voice"><option value="__best__">⭐ Migliore voce italiana</option><option value="__rotate__">🎭 Alterna voci</option></select></label><label>Velocità <span id="rateVal">0.92×</span><input id="rate" type="range" min="0.75" max="1.20" step="0.01" value="0.92"></label><label>Tono <span id="pitchVal">0.98</span><input id="pitch" type="range" min="0.85" max="1.15" step="0.01" value="0.98"></label></div><div class="actions"><button class="secondary" id="testVoice">🔊 Prova voce</button><button class="mode active secondary" data-mode="guided">Guidata</button><button class="mode secondary" data-mode="memory">Memoria</button><button class="mode secondary" data-mode="exam">Esame</button></div><div class="actions"><button class="primary" id="start">▶ Inizia / nuovo esercizio</button></div></section><section class="panel"><div class="small" id="meta">Scegli uno scenario e premi Inizia.</div><div class="client" id="clientText">Il cliente parlerà qui.</div><div class="actions"><button class="secondary" id="repeat">🔊 Ripeti cliente</button><button class="secondary" id="reveal">👁 Mostra battuta</button></div><div class="small" style="margin-top:12px">LA TUA BATTUTA</div><div class="reply" id="replyText">La tua risposta comparirà qui.</div><div class="actions"><button class="warn" id="again">Da ripetere</button><button class="ok" id="good">Detta bene</button><button class="secondary" id="next">Avanti →</button></div><div class="progress"><div class="bar" id="bar"></div></div><div class="stats"><span id="statDone">0 svolti</span><span id="statGood">0 corretti</span><span id="statAgain">0 da ripetere</span></div></section></main><script src="drills1.js"></script><script src="drills2.js"></script><script src="drills3.js"></script><script src="drills4.js"></script><script src="drills5.js"></script><script src="drills6.js"></script><script src="drills7.js"></script><script src="drills8.js"></script><script src="drills9.js"></script><script>const DRILLS=[].concat(...Array.from({length:9},(_,i)=>window['DRILLS_PART_'+(i+1)]||[]));const $=id=>document.getElementById(id);let current=null,pool=[],idx=0,mode='guided',voices=[],rankedVoices=[];const stats=JSON.parse(localStorage.getItem('roleplayStats')||'{"done":0,"good":0,"again":0}');function saveStats(){localStorage.setItem('roleplayStats',JSON.stringify(stats));renderStats()}function renderStats(){$('statDone').textContent=stats.done+' svolti';$('statGood').textContent=stats.good+' corretti';$('statAgain').textContent=stats.again+' da ripetere'}function categories(){return[...new Set(DRILLS.map(d=>d.category))]}function setupCategories(){$('category').innerHTML='<option value="__all__">Tutti gli scenari — casuale</option>'+categories().map(c=>`<option>${c}</option>`).join('')}function voiceScore(v){const n=(v.name||'').toLowerCase(),l=(v.lang||'').toLowerCase();let s=0;if(l==='it-it')s+=35;else if(l.startsWith('it'))s+=25;if(/natural|neural|online|premium|enhanced/.test(n))s+=70;if(v.default)s+=8;return s}function loadVoices(){if(!('speechSynthesis'in window))return;voices=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('it'));rankedVoices=[...voices].sort((a,b)=>voiceScore(b)-voiceScore(a));$('voice').innerHTML='<option value="__best__">⭐ Migliore voce italiana</option><option value="__rotate__">🎭 Alterna voci</option>'+rankedVoices.map((v,i)=>`<option value="v${i}">${v.name} — ${v.lang}</option>`).join('')}speechSynthesis.onvoiceschanged=loadVoices;function chooseVoice(){const x=$('voice').value;if(x==='__rotate__'&&rankedVoices.length)return rankedVoices[Math.floor(Math.random()*Math.min(4,rankedVoices.length))];if(x.startsWith('v'))return rankedVoices[+x.slice(1)];return rankedVoices[0]||null}function cleanSpeech(t){return String(t).replace(/\[[^\]]+\]/g,'').replace(/\*+/g,'').trim()}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cleanSpeech(text));u.lang='it-IT';u.rate=parseFloat($('rate').value)||.92;u.pitch=parseFloat($('pitch').value)||.98;const v=chooseVoice();if(v)u.voice=v;speechSynthesis.speak(u)}function makePool(){const c=$('category').value;pool=DRILLS.filter(d=>c==='__all__'||d.category===c).sort(()=>Math.random()-.5);idx=0}function show(d){current=d;$('meta').textContent=`${d.category} · esercizio ${d.id}/${DRILLS.length}`;$('clientText').textContent=d.client;$('replyText').textContent=d.reply;const hide=(mode==='memory'||mode==='exam');$('replyText').classList.toggle('hidden',hide);$('bar').style.width=Math.min(100,((idx+1)/Math.max(1,pool.length))*100)+'%';setTimeout(()=>speak(d.client),100)}function next(){if(!pool.length||idx>=pool.length)makePool();if(!pool.length)return;show(pool[idx++])}$('start').onclick=()=>{makePool();next()};$('next').onclick=next;$('repeat').onclick=()=>current&&speak(current.client);$('reveal').onclick=()=>current&&$('replyText').classList.toggle('hidden');$('good').onclick=()=>{if(!current)return;stats.done++;stats.good++;saveStats();next()};$('again').onclick=()=>{if(!current)return;stats.done++;stats.again++;saveStats();if(pool.length)pool.splice(Math.min(idx+2,pool.length),0,current);next()};$('rate').oninput=()=>$('rateVal').textContent=(+$('rate').value).toFixed(2)+'×';$('pitch').oninput=()=>$('pitchVal').textContent=(+$('pitch').value).toFixed(2);$('testVoice').onclick=()=>speak('Buongiorno, sono il cliente del role play. Mi dica pure, la ascolto.');document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;if(current)show(current)});setupCategories();renderStats();loadVoices();</script></body></html>
