name: Open Social Publisher - Manual Approval

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: open-social-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
      POSTIZ_API_URL: ${{ vars.POSTIZ_API_URL || 'https://api.postiz.com/public/v1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check publisher configuration
        id: config
        shell: bash
        run: |
          if [ -z "$POSTIZ_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "POSTIZ_API_KEY is not configured yet. Publisher remains safely disabled."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: pip install -r publisher/requirements.txt

      - name: Submit ready jobs to Postiz
        if: steps.config.outputs.configured == 'true'
        run: python publisher/postiz_publish.py

      - name: Persist queue state
        if: steps.config.outputs.configured == 'true' && always()
        shell: bash
        run: |
          if git diff --quiet -- publisher/queue.json; then
            echo 'Queue unchanged.'
            exit 0
          fi
          git config user.name 'open-social-engine'
          git config user.email 'open-social-engine@users.noreply.github.com'
          git add publisher/queue.json
          git commit -m 'Update social publishing queue state'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
