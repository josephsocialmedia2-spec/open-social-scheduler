name: Direct Social Publisher - Automatic

on:
  push:
    branches: [main]
    paths:
      - '.social-publisher-trigger'
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Optional exact queue job ID; blank = all approved jobs due now'
        required: false
        type: string
      platforms:
        description: 'all or comma-separated platform names'
        required: true
        default: 'all'
        type: string
      dry_run:
        description: 'Check media and OAuth secrets only; do not publish'
        required: true
        default: false
        type: boolean
  schedule:
    # Automatic publication check every 15 minutes. Queue scheduled_at remains
    # the source of truth, so nothing is published before its planned time.
    - cron: '*/15 * * * *'
  workflow_run:
    # Also run immediately after a successful 4-hour content-production cycle.
    workflows: ['Open Social Engine - 10 STATIC PUBLICATIONS - 5 F1 + 5 RMP']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: open-social-state
  cancel-in-progress: false

jobs:
  publish-due:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v23.0' }}
      LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202604' }}
      TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'SELF_ONLY' }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
      YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID || '22' }}
      F1_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.F1_FACEBOOK_PAGE_ACCESS_TOKEN }}
      F1_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.F1_INSTAGRAM_ACCESS_TOKEN }}
      F1_INSTAGRAM_USER_ID: ${{ secrets.F1_INSTAGRAM_USER_ID }}
      F1_TIKTOK_ACCESS_TOKEN: ${{ secrets.F1_TIKTOK_ACCESS_TOKEN }}
      F1_LINKEDIN_ACCESS_TOKEN: ${{ secrets.F1_LINKEDIN_ACCESS_TOKEN }}
      F1_LINKEDIN_AUTHOR_URN: ${{ secrets.F1_LINKEDIN_AUTHOR_URN }}
      F1_YOUTUBE_CLIENT_ID: ${{ secrets.F1_YOUTUBE_CLIENT_ID }}
      F1_YOUTUBE_CLIENT_SECRET: ${{ secrets.F1_YOUTUBE_CLIENT_SECRET }}
      F1_YOUTUBE_REFRESH_TOKEN: ${{ secrets.F1_YOUTUBE_REFRESH_TOKEN }}
      F1_PINTEREST_ACCESS_TOKEN: ${{ secrets.F1_PINTEREST_ACCESS_TOKEN }}
      F1_PINTEREST_BOARD_ID: ${{ secrets.F1_PINTEREST_BOARD_ID }}
      F1_PINTEREST_LINK: ${{ vars.F1_PINTEREST_LINK || 'https://f1immobiliare.com/' }}
      RMP_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.RMP_FACEBOOK_PAGE_ACCESS_TOKEN }}
      RMP_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.RMP_INSTAGRAM_ACCESS_TOKEN }}
      RMP_INSTAGRAM_USER_ID: ${{ secrets.RMP_INSTAGRAM_USER_ID }}
      RMP_TIKTOK_ACCESS_TOKEN: ${{ secrets.RMP_TIKTOK_ACCESS_TOKEN }}
      RMP_LINKEDIN_ACCESS_TOKEN: ${{ secrets.RMP_LINKEDIN_ACCESS_TOKEN }}
      RMP_LINKEDIN_AUTHOR_URN: ${{ secrets.RMP_LINKEDIN_AUTHOR_URN }}
      RMP_YOUTUBE_CLIENT_ID: ${{ secrets.RMP_YOUTUBE_CLIENT_ID }}
      RMP_YOUTUBE_CLIENT_SECRET: ${{ secrets.RMP_YOUTUBE_CLIENT_SECRET }}
      RMP_YOUTUBE_REFRESH_TOKEN: ${{ secrets.RMP_YOUTUBE_REFRESH_TOKEN }}
      RMP_PINTEREST_ACCESS_TOKEN: ${{ secrets.RMP_PINTEREST_ACCESS_TOKEN }}
      RMP_PINTEREST_BOARD_ID: ${{ secrets.RMP_PINTEREST_BOARD_ID }}
      RMP_PINTEREST_LINK: ${{ vars.RMP_PINTEREST_LINK }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://nqnmlsmeiynxbdojeyjt.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LASACRA_BUFFER_API_KEY: ${{ secrets.LASACRA_BUFFER_API_KEY }}
      RMP_BUFFER_API_KEY: ${{ secrets.RMP_BUFFER_API_KEY }}
      ANTICACAPPELLA_BUFFER_API_KEY: ${{ secrets.ANTICACAPPELLA_BUFFER_API_KEY }}
      MARTA_BUFFER_API_KEY: ${{ secrets.MARTA_BUFFER_API_KEY }}
      CARTOLIBRERIA10ELODE_BUFFER_API_KEY: ${{ secrets.CARTOLIBRERIA10ELODE_BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      LASACRA_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.LASACRA_FACEBOOK_PAGE_ACCESS_TOKEN }}
      LASACRA_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.LASACRA_INSTAGRAM_ACCESS_TOKEN }}
      LASACRA_INSTAGRAM_USER_ID: ${{ secrets.LASACRA_INSTAGRAM_USER_ID }}
      ANTICACAPPELLA_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.ANTICACAPPELLA_FACEBOOK_PAGE_ACCESS_TOKEN }}
      ANTICACAPPELLA_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.ANTICACAPPELLA_INSTAGRAM_ACCESS_TOKEN }}
      ANTICACAPPELLA_INSTAGRAM_USER_ID: ${{ secrets.ANTICACAPPELLA_INSTAGRAM_USER_ID }}
      MARTA_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.MARTA_FACEBOOK_PAGE_ACCESS_TOKEN }}
      MARTA_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.MARTA_INSTAGRAM_ACCESS_TOKEN }}
      MARTA_INSTAGRAM_USER_ID: ${{ secrets.MARTA_INSTAGRAM_USER_ID }}
      CARTOLIBRERIA10ELODE_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.CARTOLIBRERIA10ELODE_FACEBOOK_PAGE_ACCESS_TOKEN }}
      CARTOLIBRERIA10ELODE_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.CARTOLIBRERIA10ELODE_INSTAGRAM_ACCESS_TOKEN }}
      CARTOLIBRERIA10ELODE_INSTAGRAM_USER_ID: ${{ secrets.CARTOLIBRERIA10ELODE_INSTAGRAM_USER_ID }}

    steps:
      - name: Checkout main state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install publisher dependencies
        run: pip install -r publisher/requirements.txt

      - name: Reconcile F1 Content Hub into publisher queue
        run: python publisher/supabase_queue_bridge.py

      - name: Refresh client website sources when due
        run: python publisher/supabase_website_sync.py

      - name: Download recent rendered media
        id: media
        shell: bash
        run: |
          set -u
          mkdir -p publisher/media/generated
          AVAILABLE=false

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_IDS="${{ github.event.workflow_run.id }}"
          else
            RUN_IDS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/social-engine-daily.yml/runs?branch=main&status=success&per_page=4" --jq '.workflow_runs[].id' 2>/dev/null || true)
          fi

          if [ -z "${RUN_IDS:-}" ]; then
            echo "No successful social-engine-daily run is available yet."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for RUN_ID in $RUN_IDS; do
            DOWNLOADED=false
            for NAME in "social-deluxe-cycle-$RUN_ID" "social-deluxe-$RUN_ID" "social-preview-$RUN_ID"; do
              if gh run download "$RUN_ID" -n "$NAME" -D publisher/media/generated >/dev/null 2>&1; then
                echo "Downloaded $NAME from run $RUN_ID"
                AVAILABLE=true
                DOWNLOADED=true
                break
              fi
            done
            if [ "$DOWNLOADED" = "false" ]; then
              echo "No compatible media artifact found for run $RUN_ID"
            fi
          done

          if find publisher/media/supabase -type f -print -quit 2>/dev/null | grep -q .; then
            echo "Supabase Content Hub media is available."
            AVAILABLE=true
          fi

          echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"

      - name: Schedule or reconcile Buffer-backed Content Hub jobs
        if: steps.media.outputs.available == 'true'
        shell: bash
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.job_id }}" ]; then ARGS+=(--job-id "${{ inputs.job_id }}"); fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run --strict); fi
          fi
          python publisher/buffer_queue_publish.py "${ARGS[@]}"

      - name: Publish approved jobs automatically when due
        if: steps.media.outputs.available == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLATFORMS="${{ inputs.platforms }}"
            JOB_ID="${{ inputs.job_id }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            PLATFORMS="all"
            JOB_ID=""
            DRY_RUN="false"
          fi

          ARGS=(--platforms "$PLATFORMS")
          if [ -n "$JOB_ID" ]; then ARGS+=(--job-id "$JOB_ID"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run --strict); fi

          python publisher/direct_api_entry.py "${ARGS[@]}"

      - name: Sync publisher result back to Content Hub
        if: always()
        run: python publisher/supabase_queue_bridge.py --sync-back-only

      - name: Persist publication state
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- publisher/queue.json; then exit 0; fi
          git config user.name 'open-social-engine'
          git config user.email 'open-social-engine@users.noreply.github.com'
          git add publisher/queue.json
          git commit -m 'Update automatic direct social publication state'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
