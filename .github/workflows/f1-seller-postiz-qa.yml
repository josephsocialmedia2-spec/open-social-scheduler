name: F1 Seller Postiz QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'publisher/f1_seller_postiz_bridge.py'
      - 'publisher/postiz_publish.py'
      - 'publisher/discover_integrations.py'
      - 'publisher/clients/f1-immobiliare.json'
      - 'tests/test_f1_seller_postiz_bridge.py'
      - '.github/workflows/f1-seller-postiz*.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install -r publisher/requirements.txt
          python -m py_compile publisher/f1_seller_postiz_bridge.py publisher/postiz_publish.py publisher/discover_integrations.py
          python -m unittest tests/test_f1_seller_postiz_bridge.py -v
