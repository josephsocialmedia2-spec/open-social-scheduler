<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real Media Pro · Vetrina Cliente</title>
<style>
html,body{margin:0;min-height:100%;background:#020402;color:#f6f8f4;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:720px}.title{font-size:32px;font-weight:900;margin-bottom:12px}.muted{color:#aab4aa}.err{color:#ffc1c1;margin-top:14px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="loading"><div class="box"><div class="title">REAL MEDIA PRO</div><div class="muted">Caricamento vetrina contenuti cliente…</div><div id="err" class="err"></div></div></div>
<script>
(async()=>{
  const RAW='https://raw.githubusercontent.com/josephsocialmedia2-spec/open-social-scheduler/client-content-showcase/client-content-showcase.html';
  try{
    const r=await fetch(RAW+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('err').textContent='Impossibile caricare la vetrina: '+e.message;
  }
})();
</script>
</body>
</html>
