name: Check Automatic Social Connections

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-social-connections.yml'
      - '.github/workflows/social-publisher.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      F1_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.F1_FACEBOOK_PAGE_ACCESS_TOKEN }}
      F1_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.F1_INSTAGRAM_ACCESS_TOKEN }}
      F1_INSTAGRAM_USER_ID: ${{ secrets.F1_INSTAGRAM_USER_ID }}
      F1_LINKEDIN_ACCESS_TOKEN: ${{ secrets.F1_LINKEDIN_ACCESS_TOKEN }}
      F1_LINKEDIN_AUTHOR_URN: ${{ secrets.F1_LINKEDIN_AUTHOR_URN }}
      F1_PINTEREST_ACCESS_TOKEN: ${{ secrets.F1_PINTEREST_ACCESS_TOKEN }}
      F1_PINTEREST_BOARD_ID: ${{ secrets.F1_PINTEREST_BOARD_ID }}
      RMP_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.RMP_FACEBOOK_PAGE_ACCESS_TOKEN }}
      RMP_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.RMP_INSTAGRAM_ACCESS_TOKEN }}
      RMP_INSTAGRAM_USER_ID: ${{ secrets.RMP_INSTAGRAM_USER_ID }}
      RMP_LINKEDIN_ACCESS_TOKEN: ${{ secrets.RMP_LINKEDIN_ACCESS_TOKEN }}
      RMP_LINKEDIN_AUTHOR_URN: ${{ secrets.RMP_LINKEDIN_AUTHOR_URN }}
      RMP_PINTEREST_ACCESS_TOKEN: ${{ secrets.RMP_PINTEREST_ACCESS_TOKEN }}
      RMP_PINTEREST_BOARD_ID: ${{ secrets.RMP_PINTEREST_BOARD_ID }}
    steps:
      - name: Report readiness without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local label="$1"; shift
            local ok=true
            local missing=()
            for name in "$@"; do
              if [ -z "${!name:-}" ]; then
                ok=false
                missing+=("$name")
              fi
            done
            if [ "$ok" = true ]; then
              echo "✅ $label: PRONTO" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ $label: MANCANO ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          echo '# Pubblicazione automatica foto' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## F1 Immobiliare' >> "$GITHUB_STEP_SUMMARY"
          check 'Facebook' F1_FACEBOOK_PAGE_ACCESS_TOKEN
          check 'Instagram' F1_INSTAGRAM_ACCESS_TOKEN F1_INSTAGRAM_USER_ID
          check 'LinkedIn' F1_LINKEDIN_ACCESS_TOKEN F1_LINKEDIN_AUTHOR_URN
          check 'Pinterest' F1_PINTEREST_ACCESS_TOKEN F1_PINTEREST_BOARD_ID
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## Real Media Pro' >> "$GITHUB_STEP_SUMMARY"
          check 'Facebook' RMP_FACEBOOK_PAGE_ACCESS_TOKEN
          check 'Instagram' RMP_INSTAGRAM_ACCESS_TOKEN RMP_INSTAGRAM_USER_ID
          check 'LinkedIn' RMP_LINKEDIN_ACCESS_TOKEN RMP_LINKEDIN_AUTHOR_URN
          check 'Pinterest' RMP_PINTEREST_ACCESS_TOKEN RMP_PINTEREST_BOARD_ID
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'TikTok e YouTube sono esclusi dal ciclo foto attuale.' >> "$GITHUB_STEP_SUMMARY"
          echo 'I valori dei secret non vengono mai stampati.' >> "$GITHUB_STEP_SUMMARY"
