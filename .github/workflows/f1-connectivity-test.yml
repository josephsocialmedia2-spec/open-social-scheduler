name: Direct Social API Static Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r publisher/requirements.txt
      - name: Compile direct publisher
        run: python -m py_compile publisher/direct_api_publish.py publisher/direct_api_launcher.py publisher/build_daily_queue.py publisher/render_reels.py
