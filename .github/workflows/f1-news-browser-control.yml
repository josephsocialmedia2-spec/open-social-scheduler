name: F1 News Browser Control

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Prepare next, midday, evening or immediate browser job"
        required: true
        default: "next"
        type: choice
        options:
          - next
          - midday
          - evening
          - immediate
          - auto
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'publisher/news/F1_NEWS_BROWSER_START'

permissions:
  contents: write

concurrency:
  group: f1-news-browser-control
  cancel-in-progress: false

jobs:
  prepare-browser-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install controller dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Validate GitHub to browser contract
        run: |
          python -m py_compile             publisher/news/f1_news_browser_control.py             publisher/news/f1_news_browser_consumer.py             publisher/news/persist_f1_news_browser_queue.py             publisher/news/f1_valle_susa_news.py
          python -m json.tool publisher/news/f1_news_browser_queue.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          control=Path('publisher/news/f1_news_browser_control.py').read_text(encoding='utf-8')
          consumer=Path('publisher/news/f1_news_browser_consumer.py').read_text(encoding='utf-8')
          runner=Path('publisher/f1_graphics_automation/RUN_F1_NEWS_SLOT.ps1').read_text(encoding='utf-8')
          required_control=['QUEUED_FOR_PC','build_caption','build_visual_prompt','slot_key']
          required_consumer=['JOB_READY_FOR_BROWSER','f1_news_current.local.json']
          required_runner=['origin/main:publisher/news/f1_news_browser_queue.json','chatgpt_browser','f1_news_current.local.json']
          missing=[x for x in required_control if x not in control]
          missing += [x for x in required_consumer if x not in consumer]
          missing += [x for x in required_runner if x not in runner]
          if missing:
              raise SystemExit('Missing hybrid contract markers: '+', '.join(missing))
          if 'generate_visual(' in control:
              raise SystemExit('GitHub controller must not generate images')
          print('GITHUB_CONTROL_PC_BROWSER_EXECUTOR_OK')
          PY

      - name: Resolve controller slot
        id: slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Snapshot browser queue
        run: cp publisher/news/f1_news_browser_queue.json /tmp/f1-news-browser-queue-before.json

      - name: Reconcile and prepare F1 News browser job
        id: prepare
        run: |
          python -m publisher.news.f1_news_browser_control             --slot "${{ steps.slot.outputs.value }}"             --github-output "$GITHUB_OUTPUT"

      - name: Persist controller queue atomically
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python publisher/news/persist_f1_news_browser_queue.py             --before /tmp/f1-news-browser-queue-before.json             --after publisher/news/f1_news_browser_queue.json

      - name: Summary
        if: always()
        run: |
          echo "STATUS=${{ steps.prepare.outputs.status }}"
          echo "JOB_ID=${{ steps.prepare.outputs.job_id }}"
          echo "SLOT_KEY=${{ steps.prepare.outputs.slot_key }}"
          echo "Architecture: GitHub prepares -> Windows scheduled runner -> ChatGPT Plus browser -> final publisher"
