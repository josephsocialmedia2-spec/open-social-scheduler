name: Content Hub Multi-Client Bridge CI

on:
  pull_request:
    paths:
      - 'publisher/supabase_queue_bridge.py'
      - 'publisher/supabase_website_sync.py'
      - 'publisher/direct_api_entry.py'
      - 'publisher/direct_api_publish.py'
      - 'publisher/oauth_broker.py'
      - 'publisher/test_oauth_broker.py'
      - 'publisher/test_social_oauth_ui.py'
      - 'publisher/f1_social_safety.py'
      - 'publisher/test_f1_social_safety.py'
      - 'publisher/sync_analytics.py'
      - 'publisher/clients/**'
      - 'publisher/queue.json'
      - 'f1-content-hub/**'
      - 'supabase/functions/f1-social-oauth/**'
      - 'supabase/migrations/20260925_f1_social_oauth_broker.sql'
      - 'supabase/migrations/20260926_f1_tiktok_review_flow.sql'
      - 'supabase/migrations/20260926_social_links_meta_oauth.sql'
      - 'supabase/migrations/20260926_f1_social_analytics_snapshots.sql'
      - '.github/workflows/social-analytics-sync.yml'
      - 'scripts/install_tiktok_verification.py'
      - 'docs/TIKTOK_APP_REVIEW_DEMO.md'
      - '.github/workflows/social-publisher.yml'
      - '.github/workflows/content-hub-bridge-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependency
        run: pip install requests==2.32.5
      - name: Compile bridge scripts
        run: python -m py_compile publisher/supabase_queue_bridge.py publisher/supabase_website_sync.py publisher/direct_api_entry.py publisher/direct_api_publish.py publisher/oauth_broker.py publisher/sync_analytics.py
      - name: Test OAuth broker client and TikTok policy
        run: PYTHONPATH=.:publisher python -m unittest publisher/test_oauth_broker.py publisher/test_tiktok_policy.py publisher/test_social_oauth_ui.py publisher/test_f1_social_safety.py
      - name: Validate F1 Content Hub HTML and inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path('f1-content-hub/index.html').read_text(encoding='utf-8')
          required_ids = {
              'tab-dashboard', 'tab-clients', 'tab-calendar', 'tab-archive',
              'tab-publications', 'tab-analytics', 'tab-connections',
              'tab-automation', 'tab-problems', 'globalClientSelect'
          }
          ids = re.findall(r'\bid="([^"]+)"', html)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          missing = sorted(required_ids - set(ids))
          assert not duplicates, f'Duplicate DOM ids: {duplicates}'
          assert not missing, f'Missing required DOM ids: {missing}'

          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, re.I)
          assert scripts, 'No inline application script found'
          Path('/tmp/f1-content-hub-inline.js').write_text(max(scripts, key=len), encoding='utf-8')
          print('CONTENT_HUB_HTML_OK')
          PY
          node --check /tmp/f1-content-hub-inline.js
      - name: Validate queue and client configs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          queue=json.loads(Path('publisher/queue.json').read_text(encoding='utf-8'))
          assert isinstance(queue.get('jobs'), list)

          required={
              'f1-immobiliare',
              'real-media-pro',
              'immobiliare-la-sacra',
              'antica-cappella',
              'marta-ruffino',
              'cartolibreria-10-e-lode',
          }
          found=set()
          for path in Path('publisher/clients').glob('*.json'):
              if path.name.startswith('_'):
                  continue
              data=json.loads(path.read_text(encoding='utf-8'))
              if data.get('id') in required:
                  found.add(data['id'])
                  publishing=data.get('publishing') or {}
                  assert publishing.get('secret_prefix'), path
                  assert data.get('timezone') == 'Europe/Rome', path
          assert found == required, (found, required-found)
          print('BRIDGE_STATIC_VALIDATION_OK')
          PY
      - name: Verify no privileged key was committed
        run: |
          python - <<'PY'
          from pathlib import Path
          roots=[Path('publisher'),Path('f1-content-hub'),Path('supabase/functions/f1-social-oauth')]
          forbidden=('sb_secret_',)
          offenders=[]
          for root in roots:
              for path in root.rglob('*'):
                  if 'vendor' in path.parts:
                      continue
                  if not path.is_file() or path.suffix.lower() not in {'.py','.html','.js','.json','.yml','.yaml','.md'}:
                      continue
                  text=path.read_text(encoding='utf-8',errors='ignore')
                  if any(token in text for token in forbidden):
                      offenders.append(str(path))
          assert not offenders, f'Potential privileged keys in source: {offenders}'
          print('NO_PRIVILEGED_KEYS_COMMITTED')
          PY
