name: Content Hub Bridge Runtime Smoke

on:
  push:
    branches: [main]
    paths:
      - '.content-hub-bridge-smoke-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://nqnmlsmeiynxbdojeyjt.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LASACRA_BUFFER_API_KEY: ${{ secrets.LASACRA_BUFFER_API_KEY }}
      ANTICACAPPELLA_BUFFER_API_KEY: ${{ secrets.ANTICACAPPELLA_BUFFER_API_KEY }}
      ANTICACAPPELLA_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.ANTICACAPPELLA_FACEBOOK_PAGE_ACCESS_TOKEN }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v23.0' }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r publisher/requirements.txt
      - name: Run bridge without publishing
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(python publisher/supabase_queue_bridge.py --ingest-only)"
          echo "$OUT"
          if echo "$OUT" | grep -q 'BRIDGE_DISABLED'; then
            echo 'SUPABASE_SERVICE_ROLE_KEY is missing.'
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('publisher/queue.json').read_text(encoding='utf-8'))
          hub=[j for j in q.get('jobs',[]) if j.get('source')=='SUPABASE_CONTENT_HUB']
          assert hub, 'No Content Hub jobs were produced from Supabase calendar'
          assert len({j['id'] for j in hub}) == len(hub), 'Duplicate Content Hub queue IDs'
          print(f'RUNTIME_BRIDGE_OK hub_jobs={len(hub)} blocked={sum(j.get("status")=="blocked" for j in hub)}')
          PY
      - name: Verify La Sacra Buffer queue routing without publishing
        shell: bash
        run: |
          set -euo pipefail
          python publisher/buffer_queue_publish.py --verify-client immobiliare-la-sacra
          python - <<'PY'
          import base64, json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          media = Path('publisher/media/smoke/lasacra-buffer-smoke.png')
          media.parent.mkdir(parents=True, exist_ok=True)
          media.write_bytes(base64.b64decode(
              'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='
          ))
          qpath = Path('publisher/queue.json')
          q = json.loads(qpath.read_text(encoding='utf-8'))
          q.setdefault('jobs', [])
          q['jobs'] = [j for j in q['jobs'] if j.get('id') != 'lasacra-buffer-smoke']
          q['jobs'].append({
              'id': 'lasacra-buffer-smoke',
              'enabled': True,
              'status': 'ready',
              'client_id': 'immobiliare-la-sacra',
              'client_name': 'Immobiliare La Sacra',
              'caption': 'Buffer routing smoke test - dry run only',
              'format': 'post',
              'media': ['publisher/media/smoke/lasacra-buffer-smoke.png'],
              'scheduled_at': (datetime.now(timezone.utc) + timedelta(hours=1)).isoformat(),
              'platforms': ['facebook'],
              'published_platforms': [],
              'source': 'SMOKE_TEST',
              'provider': 'buffer',
              'provider_channel_id': '6ab2b713ea19ca0bdeb8103d',
          })
          qpath.write_text(json.dumps(q, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python publisher/buffer_queue_publish.py --job-id lasacra-buffer-smoke --dry-run --strict

      - name: Discover all Antica Cappella Buffer channels
        shell: bash
        run: |
          set -euo pipefail
          python publisher/buffer_queue_publish.py --discover-client antica-cappella

      - name: Verify Antica Cappella dedicated Facebook token identity
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import os, requests, sys
          token=os.environ.get('ANTICACAPPELLA_FACEBOOK_PAGE_ACCESS_TOKEN','').strip()
          expected='61550077453442'
          version=os.environ.get('META_GRAPH_VERSION','v23.0').strip()
          if not token:
              print('FACEBOOK_DIRECT_TOKEN_PRESENT=false')
              sys.exit(2)
          print('FACEBOOK_DIRECT_TOKEN_PRESENT=true')
          r=requests.get(
              f'https://graph.facebook.com/{version}/me',
              params={'fields':'id,name,link','access_token':token},
              timeout=30,
          )
          if not r.ok:
              print('FACEBOOK_DIRECT_TOKEN_VALID=false')
              print('FACEBOOK_GRAPH_HTTP_STATUS='+str(r.status_code))
              sys.exit(3)
          data=r.json()
          page_id=str(data.get('id') or '')
          print('FACEBOOK_DIRECT_TOKEN_VALID=true')
          print('FACEBOOK_DIRECT_PAGE_ID='+page_id)
          print('FACEBOOK_DIRECT_PAGE_NAME='+str(data.get('name') or ''))
          if page_id != expected:
              print('FACEBOOK_DIRECT_PAGE_MATCH=false')
              sys.exit(4)
          print('FACEBOOK_DIRECT_PAGE_MATCH=true')
          PY

      - name: Verify Antica Cappella Buffer routing without publishing
        shell: bash
        run: |
          set -euo pipefail
          python publisher/buffer_queue_publish.py --verify-client antica-cappella
          python - <<'PY'
          import base64, json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          media = Path('publisher/media/smoke/antica-buffer-smoke.png')
          media.parent.mkdir(parents=True, exist_ok=True)
          media.write_bytes(base64.b64decode(
              'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='
          ))
          qpath = Path('publisher/queue.json')
          q = json.loads(qpath.read_text(encoding='utf-8'))
          q.setdefault('jobs', [])
          q['jobs'] = [j for j in q['jobs'] if j.get('id') != 'antica-buffer-smoke']
          q['jobs'].append({
              'id': 'antica-buffer-smoke',
              'enabled': True,
              'status': 'ready',
              'client_id': 'antica-cappella',
              'client_name': 'Antica Cappella',
              'caption': 'Antica Cappella Buffer routing smoke test - dry run only',
              'format': 'post',
              'media': ['publisher/media/smoke/antica-buffer-smoke.png'],
              'scheduled_at': (datetime.now(timezone.utc) + timedelta(hours=1)).isoformat(),
              'platforms': ['instagram'],
              'published_platforms': [],
              'source': 'SMOKE_TEST',
              'provider': 'buffer',
              'provider_channel_id': '6ab5cfc6ea19ca0bdedecef3',
          })
          qpath.write_text(json.dumps(q, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python publisher/buffer_queue_publish.py --job-id antica-buffer-smoke --dry-run --strict

      - name: Verify website source runtime
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(python publisher/supabase_website_sync.py)"
          echo "$OUT"
          if echo "$OUT" | grep -q 'WEBSITE_SYNC_DISABLED'; then
            exit 1
          fi
