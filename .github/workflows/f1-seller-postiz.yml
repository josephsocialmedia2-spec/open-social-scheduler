name: F1 Seller Lead Engine -> Postiz
on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'
  push:
    branches: [main]
    paths:
      - 'publisher/f1_seller_postiz_bridge.py'
      - 'publisher/postiz_publish.py'
      - 'publisher/discover_integrations.py'
      - 'publisher/clients/f1-immobiliare.json'
      - '.github/workflows/f1-seller-postiz.yml'
permissions:
  contents: write
concurrency:
  group: f1-seller-postiz
  cancel-in-progress: false
jobs:
  seller-postiz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
      POSTIZ_API_URL: ${{ vars.POSTIZ_API_URL || 'https://social.realmediapro.it/public/v1' }}
      SOCIAL_QUEUE: ${{ github.workspace }}/publisher/f1-seller-postiz-queue.json
      SELLER_OUTBOX: ${{ github.workspace }}/seller-source/data/postiz-outbox.json
      SELLER_TERRITORY_CONFIG: ${{ github.workspace }}/seller-source/config/territory.json
    steps:
      - name: Checkout social scheduler
        uses: actions/checkout@v4
        with:
          path: social
          fetch-depth: 0
      - name: Checkout F1 Seller source
        uses: actions/checkout@v4
        with:
          repository: josephsocialmedia2-spec/launcher-dashboard
          ref: main
          path: seller-source
      - name: Normalize workspace paths
        shell: bash
        run: |
          cp -a social/. .
          rm -rf social
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          pip install -r publisher/requirements.txt
      - name: Validate bridge
        run: |
          python -m py_compile publisher/f1_seller_postiz_bridge.py publisher/postiz_publish.py publisher/discover_integrations.py
          python -m unittest tests/test_f1_seller_postiz_bridge.py -v
      - name: Discover exact Postiz F1 integrations
        shell: bash
        run: |
          if [ -z "${POSTIZ_API_KEY:-}" ]; then
            echo "POSTIZ_API_KEY not configured: building queue safely without publication."
            exit 0
          fi
          python publisher/discover_integrations.py --write
      - name: Build Seller queue and visuals
        run: python publisher/f1_seller_postiz_bridge.py
      - name: Publish/schedule through Postiz only
        shell: bash
        run: |
          if [ -z "${POSTIZ_API_KEY:-}" ]; then
            echo "Postiz publication disabled because POSTIZ_API_KEY is absent."
            exit 0
          fi
          python publisher/postiz_publish.py
      - name: Persist Postiz bindings and Seller queue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'f1-seller-postiz'
          git config user.email 'actions@users.noreply.github.com'
          git add publisher/clients/f1-immobiliare.json publisher/f1-seller-postiz-queue.json
          if git diff --cached --quiet; then echo "No state change"; exit 0; fi
          git commit -m 'Update F1 Seller Postiz state'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt*2))
          done
          exit 1
