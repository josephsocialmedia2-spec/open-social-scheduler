name: F1 Content Hub UI CI

on:
  push:
    branches: [main]
    paths:
      - 'f1-content-hub/**'
      - 'publisher/supabase_queue_bridge.py'
      - 'publisher/direct_api_publish.py'
      - 'publisher/f1_intelligence_worker.py'
      - 'publisher/local_agent/**'
      - 'publisher/clients/**'
      - '.github/workflows/f1-social-intelligence.yml'
      - '.github/workflows/f1-agency-intelligence.yml'
      - 'publisher/agency_requirements.txt'
      - '.github/workflows/content-hub-ui-ci.yml'
  pull_request:
    paths:
      - 'f1-content-hub/**'
      - 'publisher/supabase_queue_bridge.py'
      - 'publisher/direct_api_publish.py'
      - 'publisher/f1_intelligence_worker.py'
      - 'publisher/local_agent/**'
      - 'publisher/clients/**'
      - '.github/workflows/f1-social-intelligence.yml'
      - '.github/workflows/f1-agency-intelligence.yml'
      - 'publisher/agency_requirements.txt'
      - '.github/workflows/content-hub-ui-ci.yml'

permissions:
  contents: read

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check workspace JavaScript syntax
        run: node --check f1-content-hub/client-workspace.js
      - name: Check Content Hub wiring
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('f1-content-hub/index.html','utf8');
          const sw=fs.readFileSync('f1-content-hub/sw.js','utf8');
          for(const required of [
            'id="clientPublisherWorkspace"',
            'id="contentRail"',
            'id="contentRailList"',
            'id="contentRailSearch"',
            'client-workspace.css',
            'client-workspace.js',
            'f1RenderContentRail',
            'f1RenderClientPublisherWorkspace'
          ]){
            if(!html.includes(required)) throw new Error('Missing Content Hub wiring: '+required);
          }
          if(!sw.includes('client-workspace.js')||!sw.includes('client-workspace.css')){
            throw new Error('Service worker is not caching workspace assets');
          }
          console.log('CONTENT_HUB_WORKSPACE_WIRING_OK');
          NODE
      - name: Check inline Content Hub JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('f1-content-hub/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(x=>x.trim());
          scripts.forEach((code,i)=>{ new Function(code); console.log('INLINE_SCRIPT_OK',i+1); });
          NODE
      - name: Check Content Rail logic markers
        run: |
          node <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('f1-content-hub/client-workspace.js','utf8');
          for(const required of [
            'selectedRailContentId',
            'railScopedItems',
            'f1SelectRailContent',
            'f1QuickProgramFromRail',
            'f1WorkspaceScheduleItem',
            'data-distribution-item',
            'uploadBatchState',
            'storageUploadWithProgress',
            'calculateUploadProgress',
            'calculateUploadSpeed',
            'estimatedSecondsRemaining',
            'CONTENUTI IN CLOUD',
            'contentRailCount',
            'f1DeleteContent',
            'f1ConfirmDeleteContent',
            'MEDIA_MISSING',
            'isHeicFile',
            'convertHeicToPng',
            'processMediaBeforeUpload',
            'verifyPngBlob',
            'cleanupOriginalHeic',
            'convertExistingHeicMedia',
            'CONVERTING_HEIC',
            'image/png',
            'intelligenceTimelineHtml',
            'F1 Social Intelligence',
            'APPROVAZIONE_RICHIESTA',
            'intelligenceTimePanel',
            'intel-folder-mini',
            'caption_manual=true',
            'graphic_caption'
          ]){
            if(!js.includes(required)) throw new Error('Missing Content Rail logic: '+required);
          }
          console.log('CONTENT_RAIL_LOGIC_OK');
          NODE
      - name: Check global F1 Social Intelligence design system
        run: |
          node <<'NODE'
          const fs=require('fs');
          const css=fs.readFileSync('f1-content-hub/f1-design-system.css','utf8');
          const main=fs.readFileSync('f1-content-hub/index.html','utf8');
          const lasacra=fs.readFileSync('f1-content-hub/immobiliare-la-sacra.html','utf8');
          const requiredTokens=[
            '--f1-bg:#01162c',
            '--f1-cyan:#20c7ff',
            '--f1-green:#3ee0b5',
            '--f1-danger:#e64b68',
            '--f1-radius:18px',
            '@keyframes intelligencePulse',
            '@media(max-width:760px)',
            '@media(prefers-reduced-motion:reduce)',
            '.f1-shell',
            '.f1-timeline'
          ];
          for(const token of requiredTokens){
            if(!css.includes(token)) throw new Error('Missing global design token/component: '+token);
          }
          for(const [name,html] of [['index',main],['immobiliare-la-sacra',lasacra]]){
            if(!html.includes('f1-design-system.css')) throw new Error(name+' does not load global design system');
            const ids=[...html.matchAll(/\sid="([^"]+)"/g)].map(m=>m[1]);
            const dup=ids.filter((id,i)=>ids.indexOf(id)!==i);
            if(dup.length) throw new Error(name+' duplicate ids: '+[...new Set(dup)].join(','));
          }
          console.log('F1_GLOBAL_DESIGN_SYSTEM_OK');
          NODE
      - name: Check cache version v16
        run: |
          grep -q 'f1-content-hub-v16' f1-content-hub/sw.js
          grep -q 'f1-design-system.css' f1-content-hub/sw.js
          grep -q 'heic2any-0.0.4.min.js' f1-content-hub/sw.js
          grep -q 'heic2any-0.0.4.min.js' f1-content-hub/index.html
          test -s f1-content-hub/f1-design-system.css
          test -s f1-content-hub/vendor/heic2any-0.0.4.min.js
          test -s f1-content-hub/vendor/heic2any-LICENSE.md
      - name: Real HEIC to PNG browser conversion test
        run: |
          set -euo pipefail
          npm install --no-save puppeteer-core@24.24.1
          curl -fsSL https://raw.githubusercontent.com/alexcorvi/heic2any/master/demo/1.heic -o f1-content-hub/__ci_fixture.heic
          cat > f1-content-hub/__ci_heic_test.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <div id="result" data-result="WAIT">WAIT</div>
          <script>
          window.clients=[];window.items=[];window.calendar=[];window.socialChannels=[];
          window.selectedClientId="";window.user={id:"ci-owner"};
          window.effectiveSocialState=()=>"CANALE_DA_COLLEGARE";
          window.socialCollisionMap=()=>new Map();
          window.loadAll=async()=>{};window.renderAll=async()=>{};
          </script>
          <script src="./vendor/heic2any-0.0.4.min.js"></script>
          <script src="./client-workspace.js"></script>
          <script>
          (async()=>{
            const el=document.getElementById("result");
            try{
              const diag=window.f1HeicDiagnostics;
              if(!diag)throw new Error("diagnostics missing");
              const src=await fetch("./__ci_fixture.heic").then(r=>r.blob());
              const file=new File([src],"foto.HEIC",{type:"image/heic"});
              if(!diag.isHeicFile(file))throw new Error("HEIC detection failed");
              const prepared=await diag.processMediaBeforeUpload(file);
              if(!prepared.converted)throw new Error("conversion flag false");
              if(prepared.file.name!=="foto.png")throw new Error("wrong PNG name: "+prepared.file.name);
              if(prepared.file.type!=="image/png"||prepared.file.size<=0)throw new Error("invalid PNG");
              const verified=await diag.verifyPngBlob(prepared.file);
              if(!(verified.width>0&&verified.height>0))throw new Error("invalid dimensions");
              let corruptRejected=false;
              try{
                await diag.convertHeicToPng(new File([new Uint8Array([1,2,3,4,5])],"corrotto.heic",{type:"image/heic"}));
              }catch(_){corruptRejected=true}
              if(!corruptRejected)throw new Error("corrupt HEIC was not rejected");
              el.dataset.result="OK";
              el.textContent="OK "+prepared.file.type+" "+prepared.file.size+" "+verified.width+"x"+verified.height+" name="+prepared.file.name+" corrupt=rejected";
            }catch(e){
              el.dataset.result="ERROR";
              el.textContent="ERROR "+(e&&e.stack||e&&e.message||e);
            }
          })();
          </script>
          HTML
          (cd f1-content-hub && python3 -m http.server 8765 >/tmp/f1-heic-http.log 2>&1 & echo $! >/tmp/f1-heic-http.pid)
          sleep 1
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({
              executablePath:process.env.CHROME,
              headless:true,
              args:['--no-sandbox','--disable-setuid-sandbox','--disable-gpu']
            });
            try{
              const page=await browser.newPage();
              page.on('console',m=>console.log('BROWSER',m.text()));
              page.on('pageerror',e=>console.error('PAGEERROR',e.message));
              await page.goto('http://127.0.0.1:8765/__ci_heic_test.html',{waitUntil:'networkidle0',timeout:30000});
              await page.waitForFunction(
                () => document.getElementById('result')?.dataset.result !== 'WAIT',
                {timeout:45000}
              );
              const result=await page.$eval('#result',el=>({state:el.dataset.result,text:el.textContent}));
              console.log('HEIC_TEST_RESULT',JSON.stringify(result));
              if(result.state!=='OK')throw new Error(result.text||'HEIC conversion failed');
            }finally{
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$(cat /tmp/f1-heic-http.pid)" || true
          rm -f f1-content-hub/__ci_fixture.heic f1-content-hub/__ci_heic_test.html

      - name: Check HEIC is blocked from publisher
        run: |
          grep -q 'CONVERSIONE_HEIC' publisher/supabase_queue_bridge.py
          grep -q 'CONVERSIONE_HEIC_REQUIRED' publisher/direct_api_publish.py
      - name: Check Intelligence worker and publisher syntax
        run: |
          python -m py_compile             publisher/f1_intelligence_worker.py             publisher/local_agent/f1_pc_agent.py             publisher/supabase_queue_bridge.py             publisher/direct_api_publish.py
      - name: Check autonomous Intelligence workflow
        run: |
          grep -Fq "cron: '*/5 * * * *'" .github/workflows/f1-social-intelligence.yml
          grep -q 'f1_intelligence_worker.py' .github/workflows/f1-social-intelligence.yml
          grep -q 'faster-whisper==1.2.0' publisher/intelligence_requirements.txt
          grep -q 'pillow-heif==1.8.0' publisher/intelligence_requirements.txt
          grep -q 'pytesseract==0.3.13' publisher/intelligence_requirements.txt
          grep -Fq 'av>=11,<19' publisher/intelligence_requirements.txt
          grep -q 'tesseract-ocr-ita' .github/workflows/f1-social-intelligence.yml
          grep -q 'F1_INTELLIGENCE_V2_GRAPHIC_CAPTION' publisher/f1_intelligence_worker.py
          grep -Fq "cron: '*/10 * * * *'" .github/workflows/f1-agency-intelligence.yml
          grep -q -- '--skip-content' .github/workflows/f1-agency-intelligence.yml
          grep -q 'ddgs' publisher/agency_requirements.txt
          grep -q 'manual_final_confirmation' publisher/clients/immobiliare-la-sacra.json
          grep -q '"autonomous_publish": true' publisher/clients/real-media-pro.json
          grep -q '"autonomous_publish": true' publisher/clients/f1-social.json
