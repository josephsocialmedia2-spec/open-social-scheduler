name: Bind Postiz Client Integrations

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: postiz-bind-integrations
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
      POSTIZ_API_URL: ${{ vars.POSTIZ_API_URL || 'https://social.realmediapro.it/public/v1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Postiz API key
        shell: bash
        run: |
          if [ -z "$POSTIZ_API_KEY" ]; then
            echo 'Missing repository secret POSTIZ_API_KEY.' >&2
            exit 2
          fi

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install dependencies
        run: pip install -r publisher/requirements.txt

      - name: Discover and bind exact integration IDs
        run: python publisher/discover_integrations.py --write

      - name: Reconcile social queue
        run: python publisher/build_daily_queue.py

      - name: Persist tenant bindings
        shell: bash
        run: |
          if git diff --quiet -- publisher/clients publisher/queue.json; then
            echo 'No unambiguous new integrations found.'
            exit 0
          fi
          git config user.name 'open-social-engine'
          git config user.email 'open-social-engine@users.noreply.github.com'
          git add publisher/clients publisher/queue.json
          git commit -m 'Bind Postiz social integrations to client tenants'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
