<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Social Scheduler · Solo foto + caption</title>
<style>
:root{--bg:#030503;--panel:#0a110b;--line:#2d3b2e;--text:#f6f8f4;--muted:#aab4aa;--f1:#9fe000;--rmp:#67e8c4}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#020402,#071008);color:var(--text);font:15px/1.45 Arial,sans-serif}.wrap{width:min(1400px,calc(100% - 24px));margin:auto;padding:22px 0 60px}h1{margin:0 0 4px;font-size:clamp(28px,4vw,46px)}.sub{color:var(--muted);margin-bottom:18px}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin-bottom:16px}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer;background:var(--f1);color:#061005}.btn.alt{background:transparent;color:#fff;border:1px solid #465448}.btn.rmp{background:var(--rmp);color:#05120e}.status{padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#09100a;color:#cbd3cb;margin-bottom:18px}.status.error{border-color:#6d3333;color:#ffc1c1}.packs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}.pack{padding:14px;border:1px solid var(--line);border-radius:14px;background:#09100a}.pack h3{margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.card.f1{border-color:#3c551d}.card.rmp{border-color:#22594e}.media{background:#000}.media img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover}.body{padding:12px}.brand{font-size:10px;font-weight:900;letter-spacing:.08em;color:var(--f1)}.rmp .brand{color:var(--rmp)}.title{font-size:17px;font-weight:900;margin:5px 0 8px}.meta{font-size:11px;color:var(--muted)}.caption-label{font-size:10px;font-weight:900;color:var(--muted);margin:12px 0 6px}.caption{white-space:pre-wrap;background:#050805;border:1px solid #334235;border-radius:10px;padding:10px;max-height:240px;overflow:auto;font-size:12px}.actions{margin-top:10px}.actions .btn{font-size:11px;padding:8px 9px}.empty{padding:28px;border:1px dashed #3f4d40;border-radius:12px;color:#98a299;text-align:center}.footer{text-align:center;color:#778179;font-size:11px;margin-top:28px}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.grid,.packs{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap">
<h1>SOLO FOTO + CAPTION</h1>
<div class="sub">F1 Immobiliare + Real Media Pro · nessun Reel, nessun MP4. Scarica la foto e copia la caption pronta.</div>
<div class="toolbar"><button class="btn" onclick="location.reload()">AGGIORNA ORA</button><a class="btn alt" href="https://github.com/josephsocialmedia2-spec/open-social-scheduler/releases/tag/social-preview-latest" target="_blank">APRI RELEASE</a><a class="btn alt" href="https://github.com/josephsocialmedia2-spec/open-social-scheduler/actions/workflows/social-engine-daily.yml" target="_blank">STATO PRODUZIONE</a></div>
<div id="status" class="status">Caricamento foto finite…</div>
<div class="packs"><section class="pack"><h3>F1 IMMOBILIARE</h3><div id="f1Zip">Caricamento…</div></section><section class="pack"><h3>REAL MEDIA PRO</h3><div id="rmpZip">Caricamento…</div></section></div>
<div id="jobs" class="grid"></div>
<div class="footer">Open Social Scheduler · output statico JPG/PNG soltanto</div>
</main>
<script>
const OWNER='josephsocialmedia2-spec',REPO='open-social-scheduler',TAG='social-preview-latest';
const REL=`https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${TAG}`;
const QUEUE=`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/publisher/queue.json?ts=${Date.now()}`;
let assets=[],jobs=[],currentCycle='';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function key(path){return String(path||'').replace(/^publisher\/media\/generated\//,'').replaceAll('/','__')}
function assetFor(path){const k=key(path);return assets.find(a=>a.name===k)}
function brandClass(cid){return cid==='real-media-pro'?'rmp':'f1'}
function brandName(cid){return cid==='real-media-pro'?'REAL MEDIA PRO':'F1 IMMOBILIARE'}
function time(v){try{return new Date(v).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(_){return ''}}
function copyCaption(id){const j=jobs.find(x=>String(x.id)===String(id));if(!j?.caption)return;navigator.clipboard.writeText(j.caption).then(()=>{const b=document.getElementById('copy-'+id);if(b){b.textContent='COPIATA ✓';setTimeout(()=>b.textContent='COPIA CAPTION',1400)}})}
function renderJobs(){const usable=jobs.filter(j=>j.cycle_key===currentCycle&&j.format==='photo'&&['f1-immobiliare','real-media-pro'].includes(j.client_id)).filter(j=>assetFor(j.media));document.getElementById('jobs').innerHTML=usable.length?usable.map(j=>{const a=assetFor(j.media);return `<article class="card ${brandClass(j.client_id)}"><div class="media"><a href="${esc(a.browser_download_url)}" target="_blank"><img src="${esc(a.browser_download_url)}" alt="${esc(j.title)}"></a></div><div class="body"><div class="brand">${brandName(j.client_id)} · FOTO</div><div class="title">${esc(j.title||'Contenuto')}</div><div class="meta">${esc(time(j.scheduled_at))}</div><div class="caption-label">CAPTION PRONTA</div><div class="caption">${esc(j.caption||'')}</div><div class="actions"><a class="btn ${j.client_id==='real-media-pro'?'rmp':''}" href="${esc(a.browser_download_url)}">SCARICA FOTO</a><button id="copy-${esc(j.id)}" class="btn alt" onclick="copyCaption('${esc(j.id)}')">COPIA CAPTION</button></div></div></article>`}).join(''):'<div class="empty">Le nuove foto non sono ancora nella release. Aggiorna quando il workflow è verde.</div>'}
function zipAsset(cid){return assets.find(a=>a.name===`${cid}__FOTO_CICLO_CORRENTE.zip`)}
function renderZips(){const f=zipAsset('f1-immobiliare'),r=zipAsset('real-media-pro');document.getElementById('f1Zip').innerHTML=f?`<a class="btn" href="${esc(f.browser_download_url)}">SCARICA FOTO F1</a>`:'Pacchetto in produzione';document.getElementById('rmpZip').innerHTML=r?`<a class="btn rmp" href="${esc(r.browser_download_url)}">SCARICA FOTO RMP</a>`:'Pacchetto in produzione'}
async function allAssets(url){let out=[];for(let p=1;p<=5;p++){const res=await fetch(`${url}?per_page=100&page=${p}`,{cache:'no-store'});if(!res.ok)throw new Error('Release non leggibile');const x=await res.json();out.push(...x);if(x.length<100)break}return out}
async function load(){const st=document.getElementById('status');try{const rr=await fetch(`${REL}?ts=${Date.now()}`,{cache:'no-store'});if(!rr.ok)throw new Error('Release non disponibile');const rel=await rr.json();assets=(await allAssets(rel.assets_url)).filter(a=>/\.(jpg|jpeg|png|zip)$/i.test(a.name||''));const qr=await fetch(QUEUE,{cache:'no-store'});if(qr.ok){const q=await qr.json();jobs=q.jobs||[];currentCycle=q.current_cycle||''}renderZips();renderJobs();st.className='status';st.textContent=`SOLO FOTO · ${rel.name||rel.tag_name} · aggiornata ${new Date(rel.published_at||rel.created_at).toLocaleString('it-IT')}.`}catch(e){st.className='status error';st.textContent='ERRORE: '+e.message;renderJobs()}}
load();
</script></body></html>
