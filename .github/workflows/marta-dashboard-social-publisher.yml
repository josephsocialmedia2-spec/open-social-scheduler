name: Marta Dashboard Social Publisher

on:
  push:
    branches: [main]
    paths:
      - '.marta-publisher-trigger'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify due jobs without publishing'
        required: true
        default: true
        type: boolean
      diagnose:
        description: 'Verify social channels only'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: marta-dashboard-social-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://nqnmlsmeiynxbdojeyjt.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MARTA_BUFFER_API_KEY: ${{ secrets.MARTA_BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publisher dependencies
        run: python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Run Marta social publisher
        shell: bash
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
            if [ "${{ inputs.diagnose }}" = "true" ]; then ARGS+=(--diagnose); fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            ARGS+=(--diagnose)
          fi
          python publisher/marta_dashboard_buffer.py "${ARGS[@]}"
