<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Social Scheduler</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#07111f;color:#fff;overflow:hidden}.shell{height:100%;display:grid;grid-template-rows:48px 1fr}.bar{display:flex;align-items:center;gap:12px;padding:0 16px;background:#0b1a2b;border-bottom:1px solid #28415e}.dot{width:10px;height:10px;border-radius:50%;background:#f4bf4f}.title{font-weight:800}.msg{color:#b9c9da;font-size:13px}.frame{width:100%;height:100%;border:0;background:#fff}
  </style>
</head>
<body>
  <div class="shell">
    <div class="bar"><span class="dot"></span><span class="title">Open Social Scheduler</span><span class="msg">Sincronizzazione automatica sospesa per ripristino. I dati locali restano disponibili.</span></div>
    <iframe class="frame" src="./index.html" title="Open Social Scheduler"></iframe>
  </div>
</body>
</html>
