name: Social Approval Command

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  approve:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.issue.title, '[SOCIAL-PUBLISH]') &&
      github.actor == github.repository_owner &&
      (startsWith(github.event.comment.body, '/publish ') || startsWith(github.event.comment.body, '/check '))
    runs-on: ubuntu-latest
    steps:
      - name: Parse and dispatch approved job
        uses: actions/github-script@v7
        with:
          script: |
            const raw = context.payload.comment.body.trim();
            const [command, jobId, platforms = 'all'] = raw.split(/\s+/);
            if (!jobId) core.setFailed('Missing job ID');
            const dryRun = command === '/check';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'social-publisher.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                job_id: jobId,
                platforms,
                confirm: 'true',
                dry_run: dryRun ? 'true' : 'false'
              }
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: dryRun
                ? `Controllo credenziali avviato per \`${jobId}\`.`
                : `✅ Conferma ricevuta. Pubblicazione avviata per \`${jobId}\`.`
            });
