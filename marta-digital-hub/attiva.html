<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Attiva Marta Digital Hub</title><style>body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(145deg,#14243d,#304c74 55%,#efdbe3);min-height:100vh;display:grid;place-items:center;padding:20px;color:#172033}.card{width:min(440px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 25px 70px #0004;box-sizing:border-box}.mark{width:56px;height:56px;border-radius:18px;background:#efd9e1;display:grid;place-items:center;font:700 22px Georgia;color:#432c36}h1{margin:14px 0 6px}p{line-height:1.5;color:#69748a}label{display:grid;gap:6px;margin:12px 0;font-weight:650}input{width:100%;box-sizing:border-box;padding:.8rem;border:1px solid #dfe4ec;border-radius:10px;font:inherit}button{width:100%;margin-top:10px;border:0;border-radius:11px;background:#27456f;color:white;padding:.8rem;font:inherit;font-weight:750;cursor:pointer}.ghost{background:#fff;color:#27456f;border:1px solid #dfe4ec}.msg{min-height:24px;margin-top:14px;font-size:14px;color:#5f6c82}.bad{color:#a13848}.ok{color:#237158}.sep{border-top:1px solid #e5e9f0;margin:22px 0}.small{font-size:12px}</style></head><body><main class="card"><div class="mark">MR</div><h1>Marta Ruffino Digital Hub</h1><p>Attivazione sicura del tuo accesso personale.</p><section id="auth"><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password (almeno 8 caratteri)<input id="password" type="password" minlength="8" autocomplete="current-password"></label><button id="create">Crea accesso Marta</button><button id="login" class="ghost">Ho già creato l'accesso · Accedi</button><div id="authmsg" class="msg">Pagina pronta. Inserisci email e password.</div></section><section id="claim" hidden><div class="sep"></div><h2>Attiva il Digital Hub</h2><p>Inserisci il codice proprietario monouso ricevuto in questa chat.</p><label>Codice<input id="code" autocomplete="one-time-code"></label><button id="activate">Attiva ora</button><div id="claimmsg" class="msg"></div></section><p class="small">Modalità FREE-ONLY €0 · nessuna password viene salvata in questa pagina.</p></main><script>
const U='https://nqnmlsmeiynxbdojeyjt.supabase.co',K='sb_publishable_Clz5qPTkTtvwV0rqWTcfMQ_sCDSRgnu';let S=null;
const g=id=>document.getElementById(id),msg=(id,t,b=false)=>{g(id).textContent=t;g(id).className='msg '+(b?'bad':'')};
async function post(path,body,token=''){let r=await fetch(U+path,{method:'POST',headers:{apikey:K,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)}),tx=await r.text(),d;try{d=tx?JSON.parse(tx):{}}catch{d={message:tx}}if(!r.ok)throw Error(d.msg||d.message||d.error_description||d.error||('Errore '+r.status));return d}
async function save(d){if(!d.access_token)throw Error('Accesso creato. Se Supabase ti ha inviato una mail, confermala e poi premi “Accedi”.');S=d;sessionStorage.setItem('mr_session',JSON.stringify(S));let r=await fetch(U+'/rest/v1/marta_profiles?id=eq.'+encodeURIComponent(S.user.id)+'&select=id',{headers:{apikey:K,Authorization:'Bearer '+S.access_token}});let a=await r.json().catch(()=>[]);if(Array.isArray(a)&&a.length){location.href='./';return}g('claim').hidden=false;msg('authmsg','Accesso riconosciuto. Ora inserisci il codice di attivazione.')}
g('create').onclick=async()=>{let e=g('email').value.trim(),p=g('password').value;if(!e||p.length<8){msg('authmsg','Inserisci una email valida e una password di almeno 8 caratteri.',true);return}msg('authmsg','Sto creando il tuo accesso…');try{let d=await post('/auth/v1/signup?redirect_to='+encodeURIComponent(location.origin+location.pathname),{email:e,password:p,data:{display_name:'Marta Ruffino'}});await save(d)}catch(x){msg('authmsg',x.message,x.message.startsWith('Accesso creato.')?false:true)}};
g('login').onclick=async()=>{let e=g('email').value.trim(),p=g('password').value;if(!e||!p){msg('authmsg','Inserisci email e password.',true);return}msg('authmsg','Accesso in corso…');try{let d=await post('/auth/v1/token?grant_type=password',{email:e,password:p});await save(d)}catch(x){msg('authmsg',x.message,true)}};
g('activate').onclick=async()=>{if(!S){msg('claimmsg','Prima accedi con email e password.',true);return}let c=g('code').value.trim();if(!c){msg('claimmsg','Inserisci il codice.',true);return}msg('claimmsg','Attivazione in corso…');try{await post('/rest/v1/rpc/marta_claim_owner',{p_code:c},S.access_token);msg('claimmsg','Attivazione completata. Apro il Digital Hub…');setTimeout(()=>location.href='./',500)}catch(x){msg('claimmsg',x.message,true)}};
window.addEventListener('error',()=>msg('authmsg','Errore tecnico della pagina. Ricarica una volta; se resta, comunicamelo.',true),true);
</script></body></html>
