name: F1 Meta Auto Publisher - 2 Daily

on:
  schedule:
    # Four UTC companion runs cover Europe/Rome DST safely.
    # The Python gate publishes only the due local slot and retries once.
    - cron: '30 8,9,16,17 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/meta-twice-daily.yml'
      - 'publisher/meta_twice_daily.py'
      - 'publisher/content_bank/f1-immobiliare.json'
  workflow_dispatch:
    inputs:
      slot:
        description: 'auto, morning or evening'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening
      date:
        description: 'Optional Europe/Rome date YYYY-MM-DD'
        required: false
        type: string
      dry_run:
        description: 'Render and validate credentials without publishing'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: open-social-state
  cancel-in-progress: false

jobs:
  publish-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ github.token }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v23.0' }}
      F1_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.F1_FACEBOOK_PAGE_ACCESS_TOKEN }}
      F1_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.F1_INSTAGRAM_ACCESS_TOKEN }}
      F1_INSTAGRAM_USER_ID: ${{ secrets.F1_INSTAGRAM_USER_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install media dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Validate autonomous Meta publisher
        run: |
          python -m py_compile \
            publisher/meta_twice_daily.py \
            publisher/direct_api_publish.py \
            publisher/render_reels.py

      - name: Publish due Facebook + Instagram slot
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
            DATE="${{ inputs.date }}"
            DRY="${{ inputs.dry_run }}"
          else
            SLOT="auto"
            DATE=""
            DRY="false"
          fi

          ARGS=(--slot "$SLOT")
          if [ -n "$DATE" ]; then ARGS+=(--date "$DATE"); fi
          if [ "$DRY" = "true" ]; then ARGS+=(--dry-run); fi

          python publisher/meta_twice_daily.py "${ARGS[@]}"

      - name: Persist idempotency and publication state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- publisher/queue.json; then
            echo 'No queue state change.'
            exit 0
          fi
          git config user.name 'f1-meta-auto-publisher'
          git config user.email 'f1-meta-auto-publisher@users.noreply.github.com'
          git add publisher/queue.json
          git commit -m 'Persist F1 automatic Meta publication state'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
