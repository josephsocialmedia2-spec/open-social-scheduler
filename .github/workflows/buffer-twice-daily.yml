name: F1 Buffer Publisher - LIVE INSTITUTIONAL

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'auto, morning or evening'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening
      date:
        description: 'Optional Europe/Rome date YYYY-MM-DD'
        required: false
        type: string
      dry_run:
        description: 'Validate without creating Buffer posts'
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '0 8,16 * * *'

permissions:
  contents: write

concurrency:
  group: f1-buffer-live-institutional
  cancel-in-progress: false

jobs:
  publish-approved-f1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Validate production policy and institutional manifest
        shell: bash
        run: |
          set -euxo pipefail
          python -m json.tool publisher/f1_content_policy.json >/dev/null
          python -m json.tool publisher/social-preview-latest.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('publisher/f1_content_policy.json',encoding='utf-8'))
          m=json.load(open('publisher/social-preview-latest.json',encoding='utf-8'))
          assert p.get('brand') == 'F1 Immobiliare'
          assert p.get('status') == 'binding'
          assert p.get('visual_identity',{}).get('template_family') == 'light_f1_institutional'
          assert p.get('publication_guard',{}).get('block_if_visual_template_is_not_light_f1') is True
          assert m.get('pipeline') == 'social-preview-latest'
          assert m.get('legacy_hidden') is True
          assert m.get('required_visual_compliance') == 'F1_LIGHT_INSTITUTIONAL_V2'
          assert all(e.get('visual_compliance') == 'F1_LIGHT_INSTITUTIONAL_V2' for e in m.get('entries',[]))
          print('F1 LIVE PRODUCTION POLICY VALIDATED')
          PY

      - name: Validate publisher code
        run: |
          python -m py_compile \
            publisher/buffer_twice_daily.py \
            publisher/buffer_preview_production.py

      - name: Publish or schedule approved institutional content
        shell: bash
        run: |
          set -euo pipefail
          SLOT='${{ inputs.slot }}'
          DATE='${{ inputs.date }}'
          DRY='${{ inputs.dry_run }}'
          SLOT="${SLOT:-auto}"
          ARGS=(--slot "$SLOT")
          if [ -n "$DATE" ]; then
            ARGS+=(--date "$DATE")
          fi
          if [ "$DRY" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python publisher/buffer_preview_production.py "${ARGS[@]}"

      - name: Persist Buffer production state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'f1-buffer-production'
          git config user.email 'f1-buffer-production@users.noreply.github.com'
          git add publisher/queue.json
          if git diff --cached --quiet; then
            echo 'No Buffer state changes to persist.'
            exit 0
          fi
          git commit -m 'Persist F1 Buffer production state'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Production status
        if: always()
        run: |
          echo 'F1 production source: publisher/social-preview-latest.json'
          echo 'Required visual compliance: F1_LIGHT_INSTITUTIONAL_V2'
          echo 'Scheduled slots: 10:30 and 18:30 Europe/Rome'
          echo 'Targets: Facebook + Instagram + LinkedIn through Buffer'
