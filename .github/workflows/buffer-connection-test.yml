name: F1 Buffer Connection Test

on:
  push:
    branches:
      - main
    paths:
      - '.buffer-connection-test-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Validate Buffer and Cloudinary connections without publishing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          import requests

          sys.path.insert(0, 'publisher')
          import buffer_twice_daily as b

          buffer_key = os.getenv('BUFFER_API_KEY', '').strip()
          cloudinary_raw = os.getenv('CLOUDINARY_URL', '').strip()
          missing = [name for name, value in (
              ('BUFFER_API_KEY', buffer_key),
              ('CLOUDINARY_URL', cloudinary_raw),
          ) if not value]
          if missing:
              raise SystemExit('MISSING_SECRETS: ' + ', '.join(missing))

          cloudinary_url = cloudinary_raw
          if cloudinary_url.startswith('CLOUDINARY_URL='):
              cloudinary_url = cloudinary_url.split('=', 1)[1].strip()
          cloudinary_url = cloudinary_url.strip('"\'')

          organization_id, channels = b.discover_buffer_channels(buffer_key)
          if set(channels) != {'facebook', 'instagram', 'linkedin'}:
              raise SystemExit('BUFFER_CHANNELS_INVALID: ' + json.dumps(channels, ensure_ascii=False))

          parsed = urlparse(cloudinary_url)
          component_state = {
              'scheme_cloudinary': parsed.scheme == 'cloudinary',
              'api_key_present': bool(parsed.username),
              'api_secret_present': bool(parsed.password),
              'cloud_name_present': bool(parsed.hostname),
          }
          if not all(component_state.values()):
              raise SystemExit('CLOUDINARY_URL_COMPONENTS_INVALID: ' + json.dumps(component_state))

          cloud_name = parsed.hostname
          api_key = unquote(parsed.username)
          api_secret = unquote(parsed.password)

          diagnostic = {
              'api_key_matches_cloudinary_screen': api_key == '259571764125926',
              'cloud_name_matches_cloudinary_screen': cloud_name == 'xqrptpae',
              'api_secret_looks_masked': bool(api_secret) and set(api_secret) == {'*'},
              'api_secret_looks_placeholder': api_secret.lower() in {'<your_api_secret>', 'your_api_secret', 'api_secret'},
          }
          print('CLOUDINARY_SAFE_DIAGNOSTIC: ' + json.dumps(diagnostic))
          if diagnostic['api_secret_looks_masked']:
              raise SystemExit('CLOUDINARY_SECRET_IS_MASKED: GitHub contains asterisks instead of the real API secret')
          if diagnostic['api_secret_looks_placeholder']:
              raise SystemExit('CLOUDINARY_SECRET_IS_PLACEHOLDER')

          png = base64.b64decode(
              'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='
          )
          path = Path('/tmp/f1-buffer-connection-test.png')
          path.write_bytes(png)
          endpoint = f'https://api.cloudinary.com/v1_1/{cloud_name}/image/upload'
          with path.open('rb') as fh:
              response = requests.post(
                  endpoint,
                  auth=(api_key, api_secret),
                  data={
                      'public_id': 'f1-buffer/connection-test/pixel-basic-auth',
                      'overwrite': 'true',
                  },
                  files={'file': (path.name, fh, 'image/png')},
                  timeout=120,
              )
          if not response.ok:
              raise SystemExit(f'CLOUDINARY_BASIC_AUTH_FAILED: HTTP {response.status_code}: {response.text[:500]}')
          payload = response.json()
          secure_url = str(payload.get('secure_url') or '')
          if not secure_url.startswith('https://') or not b.media_is_live(secure_url):
              raise SystemExit('CLOUDINARY_ASSET_NOT_PUBLIC')

          safe_channels = {
              service: {'name': row.get('name'), 'service': row.get('service')}
              for service, row in channels.items()
          }
          print(json.dumps({
              'status': 'CONNECTION_TEST_OK',
              'buffer_organization_id_present': bool(organization_id),
              'channels': safe_channels,
              'cloudinary_basic_auth_ok': True,
              'cloudinary_public_media_ok': True,
          }, ensure_ascii=False, indent=2))
          PY
