name: F1 News Cloud Autonomous

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "auto, midday, evening or immediate"
        required: true
        default: "immediate"
        type: choice
        options:
          - auto
          - midday
          - evening
          - immediate
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'publisher/news/F1_NEWS_CLOUD_START'

permissions:
  contents: write
  actions: read

concurrency:
  group: f1-news-cloud-autonomous
  cancel-in-progress: false

jobs:
  f1-news-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      GITHUB_TOKEN: ${{ github.token }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v23.0' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: gpt-image-1
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      F1_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.F1_FACEBOOK_PAGE_ACCESS_TOKEN }}
      F1_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.F1_INSTAGRAM_ACCESS_TOKEN }}
      F1_INSTAGRAM_USER_ID: ${{ secrets.F1_INSTAGRAM_USER_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Snapshot queue before F1 News
        run: cp publisher/final_content_queue.json /tmp/f1-news-cloud-queue-before.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Secret availability audit
        shell: bash
        run: |
          set +x
          for name in OPENAI_API_KEY BUFFER_API_KEY CLOUDINARY_URL F1_FACEBOOK_PAGE_ACCESS_TOKEN F1_INSTAGRAM_ACCESS_TOKEN F1_INSTAGRAM_USER_ID; do
            if [ -n "${!name:-}" ]; then
              echo "$name=PRESENT"
            else
              echo "$name=MISSING"
            fi
          done

      - name: Validate cloud-only production contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             publisher/news/f1_news_cloud_autonomous.py             publisher/news/f1_news_cloud_publish.py             publisher/rendering/openai_visual_engine.py             publisher/chatgpt_query_runner/f1_brand_layer.py             publisher/direct_api_publish.py
          python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/f1-news-cloud-autonomous.yml').read_text(encoding='utf-8').casefold()
          forbidden=['pyautogui','pygetwindow','uiautomation','chatgpt.com','task scheduler','run_f1_news_slot.ps1','installa_automazione_23.ps1','.bat']
          bad=[x for x in forbidden if x in wf]
          if bad:
              raise SystemExit('Forbidden local dependency in production workflow: '+', '.join(bad))
          print('CLOUD_ONLY_CONTRACT_OK')
          PY

      - name: Resolve execution slot
        id: slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "value=immediate" >> "$GITHUB_OUTPUT"
          else
            echo "value=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Research, verify source, create caption and generate cloud image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python -m publisher.news.f1_news_cloud_autonomous             --slot "${{ steps.slot.outputs.value }}"             --github-output "$GITHUB_OUTPUT"

      - name: Publish and remotely verify exact F1 News job
        if: steps.build.outputs.status == 'READY_TO_PUBLISH' && steps.build.outputs.job_id != ''
        shell: bash
        run: |
          set -u
          JOB="${{ steps.build.outputs.job_id }}"
          for pass in 1 2 3; do
            echo "DIRECT_META_PASS=$pass JOB=$JOB"
            python -m publisher.news.f1_news_cloud_publish --job-id "$JOB" || true
            STATUS=$(python - "$JOB" <<'PY'
          import json,sys
          q=json.load(open('publisher/final_content_queue.json',encoding='utf-8'))
          j=next((x for x in q.get('jobs',[]) if str(x.get('id'))==sys.argv[1]),{})
          print(j.get('status','MISSING'))
          PY
            )
            echo "JOB_STATUS=$STATUS"
            if [ "$STATUS" = "PUBLISHED_VERIFIED" ] || [ "$STATUS" = "FAILED_FINAL" ]; then
              break
            fi
            sleep 20
          done

      - name: Persist final queue atomically
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python publisher/persist_final_queue_github.py             --before /tmp/f1-news-cloud-queue-before.json             --after publisher/final_content_queue.json

      - name: Persist F1 News cloud state and generated assets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore publisher/final_content_queue.json || true
          git config user.name "F1 News Cloud Autonomous"
          git config user.email "f1-news-cloud@users.noreply.github.com"
          git add publisher/news/f1_news_cloud_state.json publisher/final_assets/f1_news 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No F1 News state/assets changes to persist"
            exit 0
          fi
          git commit -m "Persist F1 News cloud state and assets"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final cloud status
        if: always()
        shell: bash
        run: |
          BUILD_STATUS="${{ steps.build.outputs.status }}"
          JOB="${{ steps.build.outputs.job_id }}"
          echo "BUILD_STATUS=$BUILD_STATUS"
          echo "JOB_ID=$JOB"
          if [ -n "$JOB" ]; then
            python - "$JOB" <<'PY'
          import json,sys
          from pathlib import Path
          jid=sys.argv[1]
          q=json.load(open('publisher/final_content_queue.json',encoding='utf-8'))
          j=next((x for x in q.get('jobs',[]) if str(x.get('id'))==jid),{})
          s=json.load(open('publisher/news/f1_news_cloud_state.json',encoding='utf-8'))
          r=(s.get('jobs') or {}).get(jid,{})
          print(json.dumps({
            'job_id':jid,
            'state_status':r.get('status'),
            'queue_status':j.get('status'),
            'source_url':r.get('source_url'),
            'generation_provider':r.get('generation_provider'),
            'generation_model':r.get('generation_model'),
            'generated_asset':r.get('generated_asset_path'),
            'branded_asset':r.get('branded_asset_path'),
            'remote_post_ids':j.get('remote_post_ids') or [],
            'remote_post_urls':j.get('remote_post_urls') or [],
            'platform_states':j.get('platform_states') or {},
            'provider_audit':s.get('provider_audit') or {},
          },ensure_ascii=False,indent=2))
          PY
          fi

          if [ "$BUILD_STATUS" = "BLOCKED_CLOUD_IMAGE_PROVIDER" ]; then
            echo "::error::BLOCKED_CLOUD_IMAGE_PROVIDER"
            exit 3
          fi

          if [ -n "$JOB" ]; then
            STATUS=$(python - "$JOB" <<'PY'
          import json,sys
          q=json.load(open('publisher/final_content_queue.json',encoding='utf-8'))
          j=next((x for x in q.get('jobs',[]) if str(x.get('id'))==sys.argv[1]),{})
          print(j.get('status','MISSING'))
          PY
            )
            if [ "$BUILD_STATUS" = "READY_TO_PUBLISH" ] && [ "$STATUS" != "PUBLISHED_VERIFIED" ]; then
              echo "::error::F1 News did not reach PUBLISHED_VERIFIED: $STATUS"
              exit 4
            fi
          fi
