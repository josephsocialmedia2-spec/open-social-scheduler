name: F1 Social Cloud Browser Publisher

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Prepare browser publication but do not click Publish'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: f1-social-cloud-browser-publisher
  cancel-in-progress: false

jobs:
  sync-cloud-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://nqnmlsmeiynxbdojeyjt.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Reconcile Content Hub calendar into durable cloud queue
        run: python -m publisher.cloud_publisher.main --sync-only

  browser-fallback:
    needs: sync-cloud-queue
    if: ${{ vars.F1_BROWSER_FALLBACK_ENABLED == 'true' }}
    runs-on: [self-hosted, Windows, X64, f1-social-local-pc]
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://nqnmlsmeiynxbdojeyjt.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      F1_BROWSER_ROOT: 'C:\F1Social\BrowserProfiles'
      F1_BROWSER_CHANNEL: chrome
      F1_BROWSER_HEADLESS: 'true'
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify always-on Windows browser environment
        shell: powershell
        run: |
          if (-not (Test-Path 'C:\F1Social\venv\Scripts\python.exe')) {
            throw 'F1 Social Python environment missing'
          }
          if (-not (Test-Path 'C:\F1Social\BrowserProfiles')) {
            New-Item -ItemType Directory -Force -Path 'C:\F1Social\BrowserProfiles' | Out-Null
          }
          & 'C:\F1Social\venv\Scripts\python.exe' -c "import playwright; print('Playwright OK')"
      - name: Sync after API publisher and run local Chrome fallback
        shell: powershell
        run: |
          & 'C:\F1Social\venv\Scripts\python.exe' -m publisher.cloud_publisher.main --browser-only
