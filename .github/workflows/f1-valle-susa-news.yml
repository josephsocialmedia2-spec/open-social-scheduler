name: F1 Valle di Susa News

on:
  workflow_dispatch:
    inputs:
      immediate:
        description: "Publish one F1 Valle di Susa news item now"
        required: true
        default: true
        type: boolean
  schedule:
    # 10:30 UTC = 12:30 CEST / 11:30 CET
    # 18:30 UTC = 20:30 CEST / 19:30 CET
    # Both remain inside the requested Europe/Rome windows all year.
    - cron: '30 10 * * *'
    - cron: '30 18 * * *'
  push:
    branches: [main]
    paths:
      - 'publisher/news/START_NOW'

permissions:
  contents: write

concurrency:
  group: f1-valle-susa-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      F1_PUBLISH_MAX_ATTEMPTS: '3'

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Validate news automation
        run: |
          python -m py_compile publisher/news/f1_valle_susa_news.py
          python -m py_compile publisher/final_asset_publisher.py
          python -m json.tool publisher/news/f1_valle_susa_sources.json >/dev/null
          python -m json.tool publisher/news/f1_valle_susa_news_state.json >/dev/null

      - name: Snapshot queue
        run: cp publisher/final_content_queue.json /tmp/f1-news-queue-before.json

      - name: Build caption and F1 news graphic
        id: build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python publisher/news/f1_valle_susa_news.py --slot auto --github-output "$GITHUB_OUTPUT"
          else
            python publisher/news/f1_valle_susa_news.py --slot immediate --github-output "$GITHUB_OUTPUT"
          fi

      - name: Publish exact news item
        if: steps.build.outputs.job_id != ''
        shell: bash
        run: |
          set -euo pipefail
          JOB='${{ steps.build.outputs.job_id }}'
          python publisher/final_asset_publisher.py             --communications-only             --verify             --job-id "$JOB"             --max-jobs 1

      - name: Wait for PUBLISHED_VERIFIED
        if: steps.build.outputs.job_id != ''
        shell: bash
        run: |
          set -euo pipefail
          JOB='${{ steps.build.outputs.job_id }}'
          for i in $(seq 1 20); do
            STATUS=$(python - "$JOB" <<'PY'
          import json,sys
          q=json.load(open('publisher/final_content_queue.json',encoding='utf-8'))
          jid=sys.argv[1]
          j=next((x for x in q.get('jobs',[]) if str(x.get('id'))==jid),{})
          print(j.get('status','MISSING'))
          PY
          )
            echo "verify $i/20: $JOB -> $STATUS"
            if [ "$STATUS" = "PUBLISHED_VERIFIED" ]; then
              exit 0
            fi
            if [ "$STATUS" = "ERROR" ]; then
              python - "$JOB" <<'PY'
          import json,sys
          q=json.load(open('publisher/final_content_queue.json',encoding='utf-8'))
          j=next((x for x in q.get('jobs',[]) if str(x.get('id'))==sys.argv[1]),{})
          print(json.dumps(j,ensure_ascii=False,indent=2))
          PY
              exit 2
            fi
            sleep 20
            python publisher/final_asset_publisher.py               --communications-only               --verify               --job-id "$JOB"               --max-jobs 1 || true
          done
          echo "PUBLISHED_VERIFIED not reached within verification window"
          exit 3

      - name: Persist publication queue atomically
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python publisher/persist_final_queue_github.py             --before /tmp/f1-news-queue-before.json             --after publisher/final_content_queue.json

      - name: Persist news asset and dedup state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ steps.build.outputs.job_id }}" ]; then
            echo "No news job to persist"
            exit 0
          fi
          git restore publisher/final_content_queue.json || true
          git config user.name "F1 Valle Susa News"
          git config user.email "actions@users.noreply.github.com"
          git add publisher/news/f1_valle_susa_news_state.json publisher/final_assets/news_valle_susa
          if git diff --cached --quiet; then
            echo "No news files to persist"
            exit 0
          fi
          git commit -m "Persist F1 Valle di Susa news asset"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final status
        if: always()
        shell: bash
        run: |
          JOB='${{ steps.build.outputs.job_id }}'
          python - "$JOB" <<'PY'
          import json,sys
          jid=sys.argv[1]
          q=json.load(open('publisher/final_content_queue.json',encoding='utf-8'))
          j=next((x for x in q.get('jobs',[]) if str(x.get('id'))==jid),{})
          print(json.dumps({
            "job_id":jid,
            "status":j.get("status"),
            "source":j.get("source_url"),
            "published_at":j.get("published_at"),
            "published_urls":j.get("published_urls") or [],
            "buffer_posts":j.get("buffer_posts") or [],
          },ensure_ascii=False,indent=2))
          PY
