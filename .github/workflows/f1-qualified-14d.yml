name: F1 Qualified Seller - 14 Day Reels + Carousels

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: 'Optional end date YYYY-MM-DD. Defaults to today in Europe/Rome.'
        required: false
        type: string
  push:
    paths:
      - '.github/workflows/f1-qualified-14d.yml'
      - 'publisher/build_f1_qualified_14d.py'
      - 'publisher/gate_f1_qualified.py'
      - 'publisher/apply_canva_visual_manifest.py'
      - 'publisher/render_f1_unique_visuals.py'
      - 'publisher/render_f1_qualified_14d.py'
      - 'publisher/build_canva_unique_html.py'
      - 'publisher/content_bank/f1-qualified-14d.json'
      - 'publisher/content_overrides/f1-qualified-14d-overrides.json'
      - 'publisher/canva_visual_manifest.json'
      - 'publisher/instagram_distribution_policy.json'
      - 'publisher/instagram_creators_best_practices.json'
      - 'publisher/requirements.txt'

permissions:
  contents: write
  issues: write

concurrency:
  group: f1-qualified-seller-14d
  cancel-in-progress: true

jobs:
  build-gate-render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install media dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core zip
          python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Validate policies, copy and visual manifest
        run: |
          python -m py_compile publisher/build_f1_qualified_14d.py publisher/gate_f1_qualified.py publisher/apply_canva_visual_manifest.py publisher/render_f1_qualified_14d.py publisher/render_f1_unique_visuals.py publisher/build_canva_unique_html.py
          python - <<'PY'
          import json
          p=json.load(open('publisher/instagram_distribution_policy.json',encoding='utf-8'))
          c=json.load(open('publisher/instagram_creators_best_practices.json',encoding='utf-8'))
          m=json.load(open('publisher/canva_visual_manifest.json',encoding='utf-8'))
          o=json.load(open('publisher/content_overrides/f1-qualified-14d-overrides.json',encoding='utf-8'))
          assert p.get('version') == 2
          assert (c.get('reels_best_practices') or {}).get('hook_first_seconds') == 3
          assert (c.get('reels_best_practices') or {}).get('muted_view_optimization') is True
          sources=m.get('visual_sources') or []
          assert len(sources)==28
          assert len({x['source_item_id'] for x in sources})==28
          assert len({x['image_url'] for x in sources})==28
          assert all(str(x['image_url']).startswith('https://images.pexels.com/photos/') for x in sources)
          assert m['rules']['no_primary_visual_reuse_within_14d'] is True
          assert m['rules']['binary_hash_uniqueness_required'] is True
          assert m['rules']['minimum_unique_binary_hashes_per_14d'] == 28
          r01=(o.get('items') or {}).get('R01') or {}
          assert r01.get('title')=='Siamo alla ricerca di immobili in Valle di Susa'
          public=(r01.get('caption','')+' '+r01.get('voiceover','')).lower()
          for bad in ('abbiamo clienti','clienti interessati','acquirenti pronti','richieste attive'):
              assert bad not in public
          print('POLICIES + TRUTHFUL COPY + 28 DIRECT VISUAL URLS OK')
          PY

      - name: Build the last 14 days
        shell: bash
        env:
          END_DATE: ${{ inputs.end_date }}
        run: |
          if [ -n "${END_DATE:-}" ]; then
            python publisher/build_f1_qualified_14d.py --end-date "$END_DATE"
          else
            python publisher/build_f1_qualified_14d.py
          fi

      - name: Producer-side Instagram and claim gate
        run: python publisher/gate_f1_qualified.py --fail-on-blocked

      - name: Download, hash and assign 28 unique themed visuals
        run: python publisher/apply_canva_visual_manifest.py

      - name: Render without visual reuse
        run: python publisher/render_f1_unique_visuals.py

      - name: Build Canva import packs
        run: python publisher/build_canva_unique_html.py

      - name: Verify final asset package
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.load(open('publisher/qualified_14d_queue.json',encoding='utf-8'))
          jobs=q['jobs']
          assert len(jobs)==28
          reels=[j for j in jobs if j['format']=='reel']
          cars=[j for j in jobs if j['format']=='carousel']
          assert len(reels)==14 and len(cars)==14
          assert all(j.get('gate_status')=='PASSED' for j in jobs)
          assert all(j.get('lead_goal')=='qualified_seller' for j in jobs)
          assert all(j.get('unique_primary_visual') is True for j in jobs)
          assert all(j.get('legacy_visuals_allowed') is False for j in jobs)
          assert len({j['visual_asset_urls'][0] for j in jobs})==28
          assert len({j['resolved_visual_url'] for j in jobs})==28
          assert len({j['visual_content_sha256'] for j in jobs})==28
          u=q.get('unique_visual_summary') or {}
          assert u.get('contents')==28
          assert u.get('unique_primary_visuals')==28
          assert u.get('unique_content_hashes')==28
          assert u.get('reuse')==0
          r01=next(j for j in jobs if j['source_item_id']=='R01')
          assert r01['title']=='Siamo alla ricerca di immobili in Valle di Susa'
          assert 'siamo alla ricerca di immobili' in (r01['caption']+' '+r01['voiceover']).lower()
          assert r01.get('demand_evidence_verified') is False
          required={'comune','tipologia','mq','tempistica_vendita'}
          assert all(required <= set(j.get('lead_qualification_required_fields') or []) for j in jobs)
          for j in reels:
            p=Path(j['media']); assert p.exists() and p.stat().st_size>100000
            spec=j.get('render_spec') or {}
            assert spec.get('width')==1080 and spec.get('height')==1920
            assert spec.get('muted_view') is True
            assert spec.get('unique_primary_visual_per_content') is True
          for j in cars:
            paths=[Path(x) for x in j['media']]
            assert 7<=len(paths)<=10 and all(p.exists() and p.stat().st_size>15000 for p in paths)
          assert Path('publisher/canva_generated/reels-latest.html').exists()
          assert Path('publisher/canva_generated/carousels-latest.html').exists()
          print('VERIFIED: 28 CONTENTS / 28 URLS / 28 DISTINCT PIXEL HASHES / 0 REUSE / TRUTHFUL COPY')
          PY

      - name: Build downloadable package
        run: |
          set -euxo pipefail
          rm -rf /tmp/f1-qualified-14d
          mkdir -p /tmp/f1-qualified-14d
          cp publisher/qualified_14d_queue.json /tmp/f1-qualified-14d/
          cp publisher/gate_feedback.json /tmp/f1-qualified-14d/
          cp publisher/content_bank/f1-qualified-14d.json /tmp/f1-qualified-14d/content-plan.json
          cp publisher/content_overrides/f1-qualified-14d-overrides.json /tmp/f1-qualified-14d/content-overrides.json
          cp publisher/canva_visual_manifest.json /tmp/f1-qualified-14d/
          cp publisher/instagram_distribution_policy.json /tmp/f1-qualified-14d/
          cp publisher/instagram_creators_best_practices.json /tmp/f1-qualified-14d/
          cp -r publisher/canva_generated /tmp/f1-qualified-14d/
          cp -r publisher/media/generated/f1-qualified-14d /tmp/f1-qualified-14d/media
          (cd /tmp && zip -qr F1_QUALIFIED_SELLER_14_GIORNI.zip f1-qualified-14d)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: F1-QUALIFIED-SELLER-14-DAYS
          path: /tmp/F1_QUALIFIED_SELLER_14_GIORNI.zip
          if-no-files-found: error
          retention-days: 14

      - name: Persist queue, gate and Canva packs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for FILE in publisher/qualified_14d_queue.json publisher/gate_feedback.json publisher/canva_generated/reels-latest.html publisher/canva_generated/carousels-latest.html; do
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=main" --jq '.sha' 2>/dev/null || true)
            python - "$FILE" "$SHA" <<'PY'
          import base64,json,sys
          file,sha=sys.argv[1],sys.argv[2]
          payload={'message':f'Persist unique-visual F1 batch: {file}','content':base64.b64encode(open(file,'rb').read()).decode(),'branch':'main'}
          if sha: payload['sha']=sha
          json.dump(payload,open('/tmp/payload.json','w'))
          PY
            gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}" --method PUT --input /tmp/payload.json >/dev/null
          done

      - name: Replace qualified-seller release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release delete f1-qualified-14d-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create f1-qualified-14d-latest /tmp/F1_QUALIFIED_SELLER_14_GIORNI.zip \
            --title "F1 · 14 GIORNI · 28 VISUALI REALMENTE UNICI · VENDITORI QUALIFICATI" \
            --notes "28 contenuti: 14 Reel + 14 caroselli. Verifica forte: 28 URL immagine diversi + 28 hash pixel diversi = zero riuso reale nel ciclo. Primo messaggio: SIAMO ALLA RICERCA DI IMMOBILI IN VALLE DI SUSA. Nessuna dichiarazione su clienti/acquirenti senza evidenza verificata. CTA: VALUTAZIONE con COMUNE, TIPOLOGIA, MQ e TEMPISTICA. Run ${GITHUB_RUN_ID}."

      - name: Notify completion
        uses: actions/github-script@v8
        with:
          script: |
            const title='[F1 QUALIFIED] 14 giorni · 28 visuali realmente unici';
            const body=[
              '@josephsocialmedia2-spec batch rigenerato e verificato.',
              '',
              '**28 contenuti = 28 URL + 28 hash immagine distinti. Riutilizzo: 0.**',
              '**Primo messaggio:** SIAMO ALLA RICERCA DI IMMOBILI IN VALLE DI SUSA.',
              '**Claim policy:** niente clienti/acquirenti inventati; serve evidenza verificata.',
              '**Lead goal:** valutazione professionale → proprietario qualificato → appuntamento → incarico.',
              '',
              'Release: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/releases/tag/f1-qualified-14d-latest',
              'Run: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            ].join('\n');
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'all',per_page:100});
            const issue=issues.find(i=>i.title===title);
            if(!issue) await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body,assignees:['josephsocialmedia2-spec']});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,body});
