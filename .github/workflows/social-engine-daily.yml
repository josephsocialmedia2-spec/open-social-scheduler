name: Open Social Engine - 10 STATIC PUBLICATIONS - 5 F1 + 5 RMP

# Legacy workflow name is intentionally preserved because social-publisher.yml
# listens to it via workflow_run. F1 itself is manual-publish-only.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional local date YYYY-MM-DD for controlled test/backfill'
        required: false
        type: string
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/social-engine-daily.yml'
      - 'publisher/build_cycle_queue.py'
      - 'publisher/apply_photo_only.py'
      - 'publisher/render_photos_only.py'
      - 'publisher/run_publication_renderer.py'
      - 'publisher/clients/**'

permissions:
  contents: write

concurrency:
  group: open-social-engine-static-publications
  cancel-in-progress: true

jobs:
  rome-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      cycle_hour: ${{ steps.check.outputs.cycle_hour }}
    steps:
      - id: check
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Europe/Rome'))
          event=os.environ.get('GITHUB_EVENT_NAME','')
          hours=(0,4,8,12,16,20)
          run=event!='schedule' or now.hour in hours
          hour=now.hour if now.hour in hours else max(h for h in hours if h<=now.hour)
          print(f"run={'true' if run else 'false'}")
          print(f"cycle_hour={hour}")
          PY

  build-publications:
    needs: rome-gate
    if: needs.rome-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOCIAL_DATE: ${{ inputs.date }}
      SOCIAL_CYCLE_HOUR: ${{ needs.rome-gate.outputs.cycle_hour }}
      SOCIAL_RESET_LEGACY: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Validate F1 manual-only boundary
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile \
            publisher/build_cycle_queue.py \
            publisher/apply_photo_only.py \
            publisher/render_photos_only.py \
            publisher/run_publication_renderer.py
          python - <<'PY'
          import json
          cfg=json.load(open('publisher/clients/f1-immobiliare.json',encoding='utf-8'))
          assert cfg.get('graphics_source')=='manual_only'
          assert cfg.get('publish_only') is True
          assert cfg.get('automatic_rendering') is False
          assert cfg.get('ai_image_generation') is False
          print('F1_AUTOMATIC_GRAPHICS_DISABLED')
          PY

      - name: Clear generated automatic media
        run: |
          rm -rf publisher/media/generated
          mkdir -p publisher/media/generated

      - name: Build automatic cycle without F1
        run: python publisher/build_cycle_queue.py

      - name: Apply policy to automatic clients
        run: python publisher/apply_photo_only.py

      - name: Render automatic clients only
        run: python publisher/run_publication_renderer.py

      - name: Reconcile queue
        run: python publisher/build_cycle_queue.py --reconcile-only

      - name: Verify F1 zero-generation and RMP continuity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.load(open('publisher/queue.json',encoding='utf-8'))
          key=q.get('current_cycle')
          jobs=[j for j in q.get('jobs',[]) if j.get('cycle_key')==key]
          f1=[j for j in jobs if j.get('client_id')=='f1-immobiliare']
          rmp=[j for j in jobs if j.get('client_id')=='real-media-pro']
          assert len(f1)==0, f'F1 automatic jobs found: {len(f1)}'
          assert len(rmp)==5, f'RMP jobs expected 5, got {len(rmp)}'
          assert all(j.get('format')=='photo' for j in rmp)
          for j in rmp:
              p=Path(str(j.get('media') or ''))
              assert p.exists() and p.stat().st_size>20000, str(p)
          assert not list(Path('publisher/media/generated').glob('f1-immobiliare/**'))
          print('VERIFIED: F1 automatic graphics=0; RMP automatic graphics=5')
          PY

      - name: Upload automatic publication package
        uses: actions/upload-artifact@v4
        with:
          name: social-preview-${{ github.run_id }}
          path: publisher/media/generated
          if-no-files-found: error
          retention-days: 7

      - name: Persist queue and image history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'open-social-engine'
          git config user.email 'open-social-engine@users.noreply.github.com'
          git add publisher/queue.json publisher/image_history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update automatic publication state without F1 graphics'
          git pull --rebase origin main
          git push origin HEAD:main
