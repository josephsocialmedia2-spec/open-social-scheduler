name: Facebook Group Radar

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Numero massimo nuovi gruppi nel batch'
        required: false
        default: '20'
  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: facebook-group-radar
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: growth/requirements.txt
      - run: pip install -r growth/requirements.txt
      - name: Discover public Facebook group candidates
        env:
          LIMIT: ${{ inputs.limit || '20' }}
        run: python growth/discover_groups.py --limit "$LIMIT"
      - name: Read batch metadata
        id: batch
        shell: bash
        run: |
          echo "count=$(python -c 'import json; print(len(json.load(open("growth/new_batch.json", encoding="utf-8"))["groups"]))')" >> "$GITHUB_OUTPUT"
          echo "batch_id=$(python -c 'import json; print(json.load(open("growth/new_batch.json", encoding="utf-8"))["batch_id"])')" >> "$GITHUB_OUTPUT"
      - name: Persist radar data
        if: steps.batch.outputs.count != '0'
        run: |
          git config user.name 'visibility-engine'
          git config user.email 'visibility-engine@users.noreply.github.com'
          git add growth/groups.json growth/new_batch.json
          git commit -m "Radar Facebook groups ${{ steps.batch.outputs.batch_id }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Create approval issue
        if: steps.batch.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const batch = JSON.parse(fs.readFileSync('growth/new_batch.json','utf8'));
            const lines = batch.groups.map(g => `- ${g.id} — [${g.name}](${g.url}) — ${g.brand} — ${g.territory}`);
            const body = [
              `Batch: ${batch.batch_id}`,
              '',
              `Nuovi candidati: ${batch.groups.length}`,
              '',
              ...lines,
              '',
              '### Conferma',
              'Scrivi un commento:',
              '- `/approve all` per approvare tutto il batch;',
              '- `/approve FBG-XXXXXXXXXX FBG-YYYYYYYYYY` per approvare solo alcuni;',
              '- `/reject FBG-XXXXXXXXXX` per scartare;',
              '- dopo aver cliccato **Iscriviti** su Facebook: `/joined FBG-XXXXXXXXXX`;',
              '- quando la richiesta è accettata: `/member FBG-XXXXXXXXXX`.'
            ].join('\n');
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title: `[FB-GROUPS] Batch ${batch.batch_id}`, body});
