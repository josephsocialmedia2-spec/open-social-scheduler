name: Facebook Group Radar

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Numero massimo nuovi gruppi nel batch'
        required: false
        default: '40'
  schedule:
    - cron: '15 5 * * *'
  push:
    paths:
      - '.github/workflows/facebook-group-radar.yml'
      - 'growth/config.json'
      - 'growth/discover_groups.py'
      - 'growth/filter_signals.py'
      - 'growth/requirements.txt'

permissions:
  contents: write
  issues: write

concurrency:
  group: facebook-group-radar
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: growth/requirements.txt
      - run: pip install -r growth/requirements.txt
      - name: Discover public Facebook groups and post signals
        env:
          LIMIT: ${{ inputs.limit || '40' }}
        run: python growth/discover_groups.py --limit "$LIMIT"
      - name: Filter stale and off-territory signals
        run: python growth/filter_signals.py
      - name: Read batch metadata
        id: batch
        shell: bash
        run: |
          echo "group_count=$(python -c 'import json; d=json.load(open("growth/new_batch.json", encoding="utf-8")); print(len(d.get("groups", [])))')" >> "$GITHUB_OUTPUT"
          echo "signal_count=$(python -c 'import json; d=json.load(open("growth/new_batch.json", encoding="utf-8")); print(len(d.get("signals", [])))')" >> "$GITHUB_OUTPUT"
          echo "removed_count=$(python -c 'import json; d=json.load(open("growth/new_batch.json", encoding="utf-8")); print(int(d.get("removed_bad_signals", 0)))')" >> "$GITHUB_OUTPUT"
          echo "batch_id=$(python -c 'import json; print(json.load(open("growth/new_batch.json", encoding="utf-8"))["batch_id"])')" >> "$GITHUB_OUTPUT"
      - name: Persist radar data
        shell: bash
        run: |
          if git diff --quiet -- growth/groups.json growth/signals.json growth/new_batch.json; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi
          git config user.name 'visibility-engine'
          git config user.email 'visibility-engine@users.noreply.github.com'
          git add growth/groups.json growth/signals.json growth/new_batch.json
          git commit -m "Radar Facebook groups/signals ${{ steps.batch.outputs.batch_id }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Create group approval issue
        if: steps.batch.outputs.group_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const batch = JSON.parse(fs.readFileSync('growth/new_batch.json','utf8'));
            const lines = batch.groups.map(g => `- ${g.id} — [${g.name}](${g.url}) — ${g.brand} — ${g.territory}`);
            const body = [
              `Batch: ${batch.batch_id}`,
              '',
              `Nuovi gruppi candidati: ${batch.groups.length}`,
              '',
              ...lines,
              '',
              '### Conferma',
              'Scrivi un commento:',
              '- `/approve all` per approvare tutto il batch;',
              '- `/approve FBG-XXXXXXXXXX FBG-YYYYYYYYYY` per approvare solo alcuni;',
              '- `/reject FBG-XXXXXXXXXX` per scartare;',
              '- dopo aver cliccato **Iscriviti** su Facebook: `/joined FBG-XXXXXXXXXX`;',
              '- quando la richiesta è accettata: `/member FBG-XXXXXXXXXX`.'
            ].join('\n');
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title: `[FB-GROUPS] Batch ${batch.batch_id}`, body});
