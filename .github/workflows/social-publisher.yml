name: Direct Social Publisher - Automatic

on:
  push:
    branches: [main]
    paths:
      - '.social-publisher-trigger'
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Optional exact queue job ID; blank = all approved jobs due now'
        required: false
        type: string
      platforms:
        description: 'all or comma-separated platform names'
        required: true
        default: 'all'
        type: string
      dry_run:
        description: 'Check media and OAuth secrets only; do not publish'
        required: true
        default: false
        type: boolean
  schedule:
    # Automatic publication check every 5 minutes. Queue scheduled_at remains
    # the source of truth, so nothing is published before its planned time.
    - cron: '*/5 * * * *'
  workflow_run:
    # Also run immediately after a successful 4-hour content-production cycle.
    workflows: ['Open Social Engine - 10 STATIC PUBLICATIONS - 5 F1 + 5 RMP']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: open-social-state
  cancel-in-progress: false

jobs:
  publish-due:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v23.0' }}
      LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202604' }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
      YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID || '22' }}
      F1_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.F1_FACEBOOK_PAGE_ACCESS_TOKEN }}
      F1_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.F1_INSTAGRAM_ACCESS_TOKEN }}
      F1_INSTAGRAM_USER_ID: ${{ secrets.F1_INSTAGRAM_USER_ID }}
      F1_TIKTOK_ACCESS_TOKEN: ${{ secrets.F1_TIKTOK_ACCESS_TOKEN }}
      F1_LINKEDIN_ACCESS_TOKEN: ${{ secrets.F1_LINKEDIN_ACCESS_TOKEN }}
      F1_LINKEDIN_AUTHOR_URN: ${{ secrets.F1_LINKEDIN_AUTHOR_URN }}
      F1_YOUTUBE_CLIENT_ID: ${{ secrets.F1_YOUTUBE_CLIENT_ID }}
      F1_YOUTUBE_CLIENT_SECRET: ${{ secrets.F1_YOUTUBE_CLIENT_SECRET }}
      F1_YOUTUBE_REFRESH_TOKEN: ${{ secrets.F1_YOUTUBE_REFRESH_TOKEN }}
      F1_PINTEREST_ACCESS_TOKEN: ${{ secrets.F1_PINTEREST_ACCESS_TOKEN }}
      F1_PINTEREST_BOARD_ID: ${{ secrets.F1_PINTEREST_BOARD_ID }}
      F1_PINTEREST_LINK: ${{ vars.F1_PINTEREST_LINK || 'https://f1immobiliare.com/' }}
      RMP_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.RMP_FACEBOOK_PAGE_ACCESS_TOKEN }}
      RMP_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.RMP_INSTAGRAM_ACCESS_TOKEN }}
      RMP_INSTAGRAM_USER_ID: ${{ secrets.RMP_INSTAGRAM_USER_ID }}
      RMP_TIKTOK_ACCESS_TOKEN: ${{ secrets.RMP_TIKTOK_ACCESS_TOKEN }}
      RMP_LINKEDIN_ACCESS_TOKEN: ${{ secrets.RMP_LINKEDIN_ACCESS_TOKEN }}
      RMP_LINKEDIN_AUTHOR_URN: ${{ secrets.RMP_LINKEDIN_AUTHOR_URN }}
      RMP_YOUTUBE_CLIENT_ID: ${{ secrets.RMP_YOUTUBE_CLIENT_ID }}
      RMP_YOUTUBE_CLIENT_SECRET: ${{ secrets.RMP_YOUTUBE_CLIENT_SECRET }}
      RMP_YOUTUBE_REFRESH_TOKEN: ${{ secrets.RMP_YOUTUBE_REFRESH_TOKEN }}
      RMP_PINTEREST_ACCESS_TOKEN: ${{ secrets.RMP_PINTEREST_ACCESS_TOKEN }}
      RMP_PINTEREST_BOARD_ID: ${{ secrets.RMP_PINTEREST_BOARD_ID }}
      RMP_PINTEREST_LINK: ${{ vars.RMP_PINTEREST_LINK }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://nqnmlsmeiynxbdojeyjt.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      F1_OAUTH_BROKER_ENABLED: ${{ vars.F1_OAUTH_BROKER_ENABLED || 'false' }}
      F1_OAUTH_BROKER_URL: ${{ vars.F1_OAUTH_BROKER_URL || 'https://nqnmlsmeiynxbdojeyjt.supabase.co/functions/v1/f1-social-oauth' }}
      LASACRA_BUFFER_API_KEY: ${{ secrets.LASACRA_BUFFER_API_KEY }}
      RMP_BUFFER_API_KEY: ${{ secrets.RMP_BUFFER_API_KEY }}
      ANTICACAPPELLA_BUFFER_API_KEY: ${{ secrets.ANTICACAPPELLA_BUFFER_API_KEY }}
      MARTA_BUFFER_API_KEY: ${{ secrets.MARTA_BUFFER_API_KEY }}
      CARTOLIBRERIA10ELODE_BUFFER_API_KEY: ${{ secrets.CARTOLIBRERIA10ELODE_BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      LASACRA_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.LASACRA_FACEBOOK_PAGE_ACCESS_TOKEN }}
      LASACRA_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.LASACRA_INSTAGRAM_ACCESS_TOKEN }}
      LASACRA_INSTAGRAM_USER_ID: ${{ secrets.LASACRA_INSTAGRAM_USER_ID }}
      ANTICACAPPELLA_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.ANTICACAPPELLA_FACEBOOK_PAGE_ACCESS_TOKEN }}
      ANTICACAPPELLA_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.ANTICACAPPELLA_INSTAGRAM_ACCESS_TOKEN }}
      ANTICACAPPELLA_INSTAGRAM_USER_ID: ${{ secrets.ANTICACAPPELLA_INSTAGRAM_USER_ID }}
      MARTA_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.MARTA_FACEBOOK_PAGE_ACCESS_TOKEN }}
      MARTA_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.MARTA_INSTAGRAM_ACCESS_TOKEN }}
      MARTA_INSTAGRAM_USER_ID: ${{ secrets.MARTA_INSTAGRAM_USER_ID }}
      CARTOLIBRERIA10ELODE_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.CARTOLIBRERIA10ELODE_FACEBOOK_PAGE_ACCESS_TOKEN }}
      CARTOLIBRERIA10ELODE_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.CARTOLIBRERIA10ELODE_INSTAGRAM_ACCESS_TOKEN }}
      CARTOLIBRERIA10ELODE_INSTAGRAM_USER_ID: ${{ secrets.CARTOLIBRERIA10ELODE_INSTAGRAM_USER_ID }}

    steps:
      - name: Checkout main state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install publisher dependencies
        run: pip install -r publisher/requirements.txt

      - name: Ensure ffmpeg and Italian speech synthesis are available
        shell: bash
        run: |
          NEED_UPDATE=false
          if ! command -v ffprobe >/dev/null 2>&1; then NEED_UPDATE=true; fi
          if ! command -v espeak >/dev/null 2>&1; then NEED_UPDATE=true; fi
          if [ "$NEED_UPDATE" = "true" ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg espeak
          fi

      - name: Bootstrap Antica Cappella Facebook when the dedicated Page token is valid
        shell: bash
        run: |
          python - <<'PY'
          import os, json, sys
          from datetime import datetime, timezone
          import requests

          SB=(os.environ.get('SUPABASE_URL') or '').rstrip('/')
          KEY=(os.environ.get('SUPABASE_SERVICE_ROLE_KEY') or '').strip()
          TOKEN=(os.environ.get('ANTICACAPPELLA_FACEBOOK_PAGE_ACCESS_TOKEN') or '').strip()
          VERSION=(os.environ.get('META_GRAPH_VERSION') or 'v23.0').strip()
          EXPECTED='61550077453442'
          PROFILE='https://www.facebook.com/profile.php?id=61550077453442'

          if not TOKEN:
              print('ANTICA_FACEBOOK_BOOTSTRAP=AUTH_REQUIRED token_missing')
              raise SystemExit(0)
          if not SB or not KEY:
              print('ANTICA_FACEBOOK_BOOTSTRAP=SKIPPED supabase_missing')
              raise SystemExit(0)

          graph=requests.get(
              f'https://graph.facebook.com/{VERSION}/me',
              params={'fields':'id,name,link','access_token':TOKEN},
              timeout=30,
          )
          if not graph.ok:
              print('ANTICA_FACEBOOK_BOOTSTRAP=AUTH_REQUIRED token_invalid http='+str(graph.status_code))
              raise SystemExit(0)
          page=graph.json()
          detected=str(page.get('id') or '')
          if detected != EXPECTED:
              print('ANTICA_FACEBOOK_BOOTSTRAP=BLOCKED page_mismatch detected='+detected)
              raise SystemExit(0)

          # Read check: verifies that this Page token can actually access the expected Page.
          read=requests.get(
              f'https://graph.facebook.com/{VERSION}/{EXPECTED}/feed',
              params={'fields':'id,created_time','limit':'1','access_token':TOKEN},
              timeout=30,
          )
          if not read.ok:
              print('ANTICA_FACEBOOK_BOOTSTRAP=AUTH_REQUIRED page_read_failed http='+str(read.status_code))
              raise SystemExit(0)

          H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}
          def get(table,params):
              r=requests.get(f'{SB}/rest/v1/{table}',headers=H,params=params,timeout=30)
              r.raise_for_status()
              return r.json()
          def patch(table,params,payload):
              h={**H,'Prefer':'return=minimal'}
              r=requests.patch(f'{SB}/rest/v1/{table}',headers=h,params=params,json=payload,timeout=30)
              r.raise_for_status()
          def post(table,payload):
              h={**H,'Prefer':'return=minimal'}
              r=requests.post(f'{SB}/rest/v1/{table}',headers=h,json=payload,timeout=30)
              r.raise_for_status()

          clients=get('f1_content_clients',{'select':'id,owner_id,name,slug','slug':'eq.antica-cappella','limit':'1'})
          if not clients:
              raise RuntimeError('Antica Cappella client missing')
          client=clients[0]
          now=datetime.now(timezone.utc).isoformat(timespec='seconds')

          patch('f1_client_social_channels',{
              'owner_id':'eq.'+str(client['owner_id']),
              'client_id':'eq.'+str(client['id']),
              'platform':'eq.facebook',
          },{
              'provider':'direct',
              'enabled':True,
              'verified':True,
              'connection_status':'COLLEGATO',
              'external_channel_id':EXPECTED,
              'account_name':str(page.get('name') or 'Antica Cappella'),
              'profile_url':PROFILE,
              'last_verified_at':now,
              'reauthorization_required':False,
              'updated_at':now,
          })
          print('ANTICA_FACEBOOK_PREFLIGHT=OK page_id='+EXPECTED+' page_name='+str(page.get('name') or ''))

          events=get('f1_publication_events',{
              'select':'content_id,status,external_id',
              'client_id':'eq.'+str(client['id']),
              'platform':'eq.facebook',
              'limit':'1000',
          })
          published={
              str(x.get('content_id')) for x in events
              if x.get('content_id') and str(x.get('status') or '').upper() in {'PUBBLICATO','PUBLISHED','COMPLETED','SUCCESS'}
          }
          if published:
              print('ANTICA_FACEBOOK_TEST=ALREADY_COMPLETED count='+str(len(published)))
              raise SystemExit(0)

          items=get('f1_content_items',{
              'select':'id,title,description,source_text,status,content_type,created_at,f1_content_media(id,file_name,mime_type,storage_path,file_size)',
              'client_id':'eq.'+str(client['id']),
              'owner_id':'eq.'+str(client['owner_id']),
              'order':'created_at.desc',
              'limit':'100',
          })
          rank={'PRONTO':0,'APPROVATO':0,'PROGRAMMATO':1,'DA APPROVARE':2,'DA LAVORARE':3,'IN ARRIVO':4}
          candidates=[]
          for item in items:
              if str(item.get('id')) in published: continue
              if str(item.get('status') or '').upper() in {'ARCHIVIATO','PUBBLICATO'}: continue
              media=[
                  m for m in (item.get('f1_content_media') or [])
                  if str(m.get('mime_type') or '').lower() in {'image/jpeg','image/png','image/webp'}
                  and not str(m.get('file_name') or '').lower().endswith(('.heic','.heif'))
                  and m.get('storage_path')
              ]
              if media:
                  candidates.append((rank.get(str(item.get('status') or '').upper(),9),item,media[0]))
          if not candidates:
              print('ANTICA_FACEBOOK_TEST=WAITING_FOR_ELIGIBLE_MEDIA')
              raise SystemExit(0)
          candidates.sort(key=lambda x:(x[0],str(x[1].get('created_at') or '')))
          item=candidates[0][1]
          media=candidates[0][2]
          caption=str(item.get('description') or item.get('source_text') or '').strip()
          if not caption:
              caption='Antica Cappella · Avigliana — tradizione, accoglienza ed eventi nel cuore della Valle di Susa.'

          existing=get('f1_content_calendar',{
              'select':'id,status,platform_metadata',
              'owner_id':'eq.'+str(client['owner_id']),
              'client_id':'eq.'+str(client['id']),
              'content_id':'eq.'+str(item['id']),
              'platform':'eq.facebook',
              'limit':'1',
          })
          metadata={
              'caption':caption,
              'publish_now':True,
              'connection_test':True,
              'selected_time':'NOW',
              'verified_page_id':EXPECTED,
              'media_id':str(media.get('id') or ''),
              'pipeline_version':'F1_INTELLIGENCE_V1',
          }
          if existing:
              patch('f1_content_calendar',{'id':'eq.'+str(existing[0]['id'])},{
                  'status':'PROGRAMMATO','provider':'direct','publication_at':now,
                  'error':None,'updated_at':now,'platform_metadata':metadata,
              })
              calendar_id=str(existing[0]['id'])
          else:
              post('f1_content_calendar',{
                  'owner_id':client['owner_id'],'client_id':client['id'],'content_id':item['id'],
                  'platform':'facebook','provider':'direct','publication_at':now,'status':'PROGRAMMATO',
                  'error':None,'platform_metadata':metadata,
              })
              rows=get('f1_content_calendar',{
                  'select':'id','client_id':'eq.'+str(client['id']),
                  'content_id':'eq.'+str(item['id']),'platform':'eq.facebook','limit':'1'
              })
              calendar_id=str(rows[0]['id']) if rows else ''
          print('ANTICA_FACEBOOK_TEST=QUEUED content_id='+str(item['id'])+' title='+str(item.get('title') or '')+' calendar_id='+calendar_id)
          PY

      - name: Generate licensed multi-client spoken publication test
        if: github.event_name == 'push'
        run: python publisher/generate_multiclient_test_jobs.py

      - name: Reconcile F1 Content Hub into publisher queue
        run: python publisher/supabase_queue_bridge.py

      - name: Refresh client website sources when due
        run: python publisher/supabase_website_sync.py

      - name: Download recent rendered media
        id: media
        shell: bash
        run: |
          set -u
          mkdir -p publisher/media/generated
          AVAILABLE=false

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_IDS="${{ github.event.workflow_run.id }}"
          else
            RUN_IDS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/social-engine-daily.yml/runs?branch=main&status=success&per_page=4" --jq '.workflow_runs[].id' 2>/dev/null || true)
          fi

          if [ -z "${RUN_IDS:-}" ]; then
            echo "No successful social-engine-daily run is available yet."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for RUN_ID in $RUN_IDS; do
            DOWNLOADED=false
            for NAME in "social-deluxe-cycle-$RUN_ID" "social-deluxe-$RUN_ID" "social-preview-$RUN_ID"; do
              if gh run download "$RUN_ID" -n "$NAME" -D publisher/media/generated >/dev/null 2>&1; then
                echo "Downloaded $NAME from run $RUN_ID"
                AVAILABLE=true
                DOWNLOADED=true
                break
              fi
            done
            if [ "$DOWNLOADED" = "false" ]; then
              echo "No compatible media artifact found for run $RUN_ID"
            fi
          done

          if find publisher/media/supabase -type f -print -quit 2>/dev/null | grep -q .; then
            echo "Supabase Content Hub media is available."
            AVAILABLE=true
          fi
          if find publisher/media/generated/multiclient-test-20260926 -type f -name '*.mp4' -print -quit 2>/dev/null | grep -q .; then
            echo "Licensed multi-client test media is available."
            AVAILABLE=true
          fi

          echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"

      - name: Schedule or reconcile Buffer-backed Content Hub jobs
        if: steps.media.outputs.available == 'true'
        shell: bash
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.job_id }}" ]; then ARGS+=(--job-id "${{ inputs.job_id }}"); fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run --strict); fi
          fi
          python publisher/buffer_queue_publish.py "${ARGS[@]}"

      - name: Publish approved jobs automatically when due
        if: steps.media.outputs.available == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLATFORMS="${{ inputs.platforms }}"
            JOB_ID="${{ inputs.job_id }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            PLATFORMS="all"
            JOB_ID=""
            DRY_RUN="false"
          fi

          ARGS=(--platforms "$PLATFORMS")
          if [ -n "$JOB_ID" ]; then ARGS+=(--job-id "$JOB_ID"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run --strict); fi

          python publisher/direct_api_entry.py "${ARGS[@]}"

      - name: Sync publisher result back to Content Hub
        if: always()
        run: python publisher/supabase_queue_bridge.py --sync-back-only

      - name: Persist publication state
        if: always()
        shell: bash
        run: |
          TRACKED=(publisher/queue.json)
          if [ -f publisher/multiclient_test_report.json ]; then TRACKED+=(publisher/multiclient_test_report.json); fi
          if git diff --quiet -- "${TRACKED[@]}" && [ ! -f publisher/multiclient_test_report.json ]; then exit 0; fi
          git config user.name 'open-social-engine'
          git config user.email 'open-social-engine@users.noreply.github.com'
          git add "${TRACKED[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update automatic direct social publication state'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
