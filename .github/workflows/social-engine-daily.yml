name: Open Social Engine - 10 STATIC PUBLICATIONS - 5 F1 + 5 RMP

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional local date YYYY-MM-DD for controlled test/backfill'
        required: false
        type: string
  schedule:
    - cron: '0 * * * *'
  push:
    paths:
      - '.github/workflows/social-engine-daily.yml'
      - 'publisher/pre_content_analysis.py'
      - 'publisher/enforce_content_analysis.py'
      - 'publisher/instagram_distribution_policy.json'
      - 'publisher/insights/**'
      - 'publisher/build_cycle_queue.py'
      - 'publisher/apply_photo_only.py'
      - 'publisher/render_photos_only.py'
      - 'publisher/run_publication_renderer.py'
      - 'publisher/requirements.txt'
      - 'publisher/image_history.json'
      - 'publisher/clients/**'
      - 'publisher/assets/**'
      - 'publisher/manual_images/**'

permissions:
  contents: write
  issues: write

concurrency:
  group: open-social-engine-10-static-publications
  cancel-in-progress: true

jobs:
  rome-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      cycle_hour: ${{ steps.check.outputs.cycle_hour }}
    steps:
      - id: check
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Europe/Rome'))
          event = os.environ.get('GITHUB_EVENT_NAME', '')
          hours = (0, 4, 8, 12, 16, 20)
          run = event != 'schedule' or now.hour in hours
          hour = now.hour if now.hour in hours else max(h for h in hours if h <= now.hour)
          print(f"run={'true' if run else 'false'}")
          print(f"cycle_hour={hour}")
          PY

  build-publications:
    needs: rome-gate
    if: needs.rome-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOCIAL_DATE: ${{ inputs.date }}
      SOCIAL_CYCLE_HOUR: ${{ needs.rome-gate.outputs.cycle_hour }}
      SOCIAL_RESET_LEGACY: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core zip
          python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Validate publication scripts and Instagram policy
        run: |
          python -m py_compile publisher/pre_content_analysis.py publisher/enforce_content_analysis.py publisher/build_cycle_queue.py publisher/apply_photo_only.py publisher/render_photos_only.py publisher/run_publication_renderer.py
          python - <<'PY'
          import json
          p=json.load(open('publisher/instagram_distribution_policy.json',encoding='utf-8'))
          assert p.get('version')
          required={
            'carousel_completion','positive_action_probability','skip_probability',
            'profile_time_after_post','direct_share_probability','predicted_time_on_post',
            'first_post_skip_probability','first_post_over_10_seconds',
            'audio_activation_probability','session_continuation_after_first_post'
          }
          assert required <= set((p.get('significant_predictions') or {}).keys())
          reels=p.get('reels_creative_essentials') or {}
          assert reels.get('format') == '9:16 vertical full-screen'
          assert '35%' in str(reels.get('safe_area') or '')
          print('INSTAGRAM POLICY VALIDATED')
          PY

      - name: Analyze BEFORE content creation
        run: python publisher/pre_content_analysis.py

      - name: Clear old generated media
        shell: bash
        run: |
          rm -rf publisher/media/generated
          mkdir -p publisher/media/generated

      - name: Build exactly 10 static publications
        run: python publisher/build_cycle_queue.py

      - name: Apply approved 5 F1 + 5 RMP policy
        run: python publisher/apply_photo_only.py

      - name: Enforce audience objective message Insights and Instagram policy
        run: python publisher/enforce_content_analysis.py

      - name: Render 10 JPG publications
        run: python publisher/run_publication_renderer.py

      - name: Reconcile 14-day queue
        run: python publisher/build_cycle_queue.py --reconcile-only

      - name: Verify publication policy
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit

          q=json.load(open('publisher/queue.json',encoding='utf-8'))
          key=q.get('current_cycle')
          jobs=[j for j in q.get('jobs',[]) if j.get('cycle_key')==key]
          assert len(jobs)==10, len(jobs)
          f1=[j for j in jobs if j.get('client_id')=='f1-immobiliare']
          rmp=[j for j in jobs if j.get('client_id')=='real-media-pro']
          assert len(f1)==5, len(f1)
          assert len(rmp)==5, len(rmp)
          assert all(j.get('format')=='photo' for j in jobs)
          assert all(j.get('no_video') is True for j in jobs)
          assert all(j.get('no_audio') is True for j in jobs)
          assert all(j.get('people_footer_required') is True for j in jobs)
          assert all(str(j.get('caption') or '').strip() for j in jobs)

          # Mandatory analysis-before-creation policy.
          assert all(j.get('analysis_required') is True for j in jobs)
          assert all(str(j.get('target_public') or '').strip() for j in jobs)
          assert all(str(j.get('target_public') or '').strip().lower() != 'tutti' for j in jobs)
          assert all(str(j.get('post_objective') or '').strip() for j in jobs)
          assert all(str(j.get('main_message') or '').strip() for j in jobs)
          assert all(j.get('manual_approval_required') is True for j in jobs)

          # Full Instagram Feed/Reels policy must be attached to every job.
          required_predictions={
              'positive_action_probability','skip_probability','profile_time_after_post',
              'direct_share_probability','predicted_time_on_post','first_post_skip_probability',
              'session_continuation_after_first_post'
          }
          for j in jobs:
              assert j.get('instagram_policy_required') is True
              assert j.get('instagram_policy_version')
              targets=j.get('instagram_prediction_targets') or {}
              assert required_predictions <= set(targets.keys()), (j.get('id'), targets.keys())
              constraints=j.get('instagram_creative_constraints') or {}
              assert constraints.get('first_visible_unit_must_work_without_context') is True
              assert constraints.get('immediate_target_relevance') is True
              assert constraints.get('skip_risk_must_be_reviewed') is True
              assert constraints.get('visual_subject_immediately_recognizable') is True
              assert constraints.get('visual_text_short') is True
              assert constraints.get('photo_overlay_text_not_overloaded') is True
              assert constraints.get('meaningful_positive_action_not_engagement_bait') is True
              assert constraints.get('share_value_should_be_natural_not_forced') is True
              assert constraints.get('profile_transition_must_match_brand_positioning') is True
              assert constraints.get('deliver_value_after_hook') is True
              assert j.get('instagram_reels_policy')
              assert (j.get('instagram_reels_constraints') or {}).get('applicable') is False

          for j in jobs:
              if j.get('insights_status') != 'AVAILABLE':
                  assert j.get('publication_time_verified') is False
                  assert j.get('recommended_publish_day') is None
                  assert j.get('recommended_publish_window') is None

          allowed_territorial={
              '#ValleDiSusa','#Avigliana','#Susa','#Condove','#Almese','#Bussoleno',
              '#SantAmbrogioDiTorino','#VillarDora','#Caprie','#BorgoneSusa','#SanGiorio',
              '#VillarFocchiardo','#Oulx','#Bardonecchia','#SauzeDOulx','#CesanaTorinese',
              '#Chiomonte','#Vaie','#ChiusaDiSanMichele'
          }
          for j in f1:
              tags=list(j.get('hashtags') or [])
              assert tags, j.get('id')
              assert set(tags) <= allowed_territorial, (j.get('id'), tags)
              assert j.get('local_visual_required') is True
              assert j.get('reject_generic_foreign_property_visuals') is True

          for j in rmp:
              assert list(j.get('hashtags') or []) == [], j.get('id')
              assert '#' not in str(j.get('caption') or ''), j.get('id')
              assert j.get('shopify_theme_store_only') is True
              assert j.get('copy_shopify_images') is False
              assert j.get('generated_original_mockup') is True
              assert urlsplit(str(j.get('theme_source_url') or '')).netloc.lower() == 'themes.shopify.com'
              assert j.get('visual_source') == 'shopify-theme-store-description-only'

          for j in jobs:
              rel=str(j.get('media') or '')
              assert rel.lower().endswith(('.jpg','.jpeg','.png')), rel
              p=Path(rel)
              assert p.exists() and p.stat().st_size>20000, rel
          assert not list(Path('publisher/media/generated').rglob('*.mp4'))
          assert not list(Path('publisher/media/generated').rglob('*.mp3'))
          print('VERIFIED: pre-analysis + Instagram Feed/Reels directives + 10 STATIC PUBLICATIONS. 5 F1 + 5 RMP.')
          PY

      - name: Upload publication package
        uses: actions/upload-artifact@v4
        with:
          name: social-publications-${{ github.run_id }}
          path: publisher/media/generated
          if-no-files-found: error
          retention-days: 7

      - name: Persist queue image memory and analysis
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for FILE in publisher/queue.json publisher/image_history.json publisher/content_analysis.json; do
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=main" --jq '.sha' 2>/dev/null || true)
            python - "$FILE" "$SHA" <<'PY'
          import base64, json, sys
          file, sha = sys.argv[1], sys.argv[2]
          payload={'message':f'Persist publication state: {file}','content':base64.b64encode(open(file,'rb').read()).decode(),'branch':'main'}
          if sha: payload['sha']=sha
          json.dump(payload,open('/tmp/payload.json','w'))
          PY
            gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}" --method PUT --input /tmp/payload.json >/dev/null
          done

      - name: Replace latest release with ready-to-publish JPGs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf /tmp/social-release
          mkdir -p /tmp/social-release
          find publisher/media/generated -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print0 | while IFS= read -r -d '' file; do
            rel="${file#publisher/media/generated/}"
            safe="${rel//\//__}"
            cp "$file" "/tmp/social-release/$safe"
          done
          for client in f1-immobiliare real-media-pro; do
            if [ -d "publisher/media/generated/$client" ]; then
              (cd "publisher/media/generated/$client" && zip -qr "/tmp/social-release/${client}__5_PUBBLICAZIONI.zip" . -i '*.jpg' '*.jpeg' '*.png')
            fi
          done
          cp publisher/queue.json /tmp/social-release/queue.json
          cp publisher/content_analysis.json /tmp/social-release/content_analysis.json
          cp publisher/instagram_distribution_policy.json /tmp/social-release/instagram_distribution_policy.json
          gh release delete social-preview-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create social-preview-latest /tmp/social-release/* \
            --title "10 PUBBLICAZIONI PRONTE - 5 F1 + 5 REAL MEDIA PRO" \
            --notes "10 grafiche statiche pronte con analisi pre-creazione e policy completa Instagram Feed/Reels. Il sistema considera rischio di salto, tempo sul post, condivisioni Direct, visite profilo, azioni positive e regole specifiche di formato; non inventa Insights o orari. Le regole Reels 9:16/audio/safe area restano registrate anche se il workflow corrente produce foto statiche. Run ${GITHUB_RUN_ID}."

      - name: Notify publication results
        uses: actions/github-script@v8
        with:
          script: |
            const title='[PUBBLICAZIONI] - 5 F1 + 5 RMP';
            const body=[
              '@josephsocialmedia2-spec pacchetto completato.',
              '',
              '**10 PUBBLICAZIONI PRONTE:** 5 F1 Immobiliare + 5 Real Media Pro.',
              '**ANALISI PRE-CREAZIONE:** target, obiettivo, messaggio, comparabili e dati disponibili.',
              '**INSTAGRAM:** applicate le previsioni Feed su skip, tempo, azioni positive, Direct share, visite profilo e continuità di sessione.',
              '**REELS:** policy completa 9:16, audio, area sicura, hook, sottotitoli, armonia e CTA registrata per i formati video futuri.',
              '**INSIGHTS:** se assenti, il sistema non inventa metriche o orari.',
              '',
              'Controllo + caption: https://josephsocialmedia2-spec.github.io/open-social-scheduler/monday-control.html',
              'Download rapido: https://github.com/josephsocialmedia2-spec/open-social-scheduler/releases/tag/social-preview-latest',
              'Run: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            ].join('\n');
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'all',per_page:100});
            let issue=issues.find(i=>i.title===title);
            if(!issue) issue=(await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body,assignees:['josephsocialmedia2-spec']})).data;
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,body});
