name: Open Social Engine Daily - Prepare Only

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional local date YYYY-MM-DD for controlled test/backfill'
        required: false
        type: string
  schedule:
    - cron: '10 4 * * *'
  push:
    paths:
      - '.github/workflows/social-engine-daily.yml'
      - 'publisher/build_daily_queue.py'
      - 'publisher/render_reels.py'
      - 'publisher/clients/**'
      - 'publisher/content_bank/**'

permissions:
  contents: write
  issues: write

concurrency:
  group: open-social-engine-daily
  cancel-in-progress: false

jobs:
  build-render-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOCIAL_DATE: ${{ inputs.date }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r publisher/requirements.txt

      - name: Validate Python and tenant isolation
        run: |
          python -m py_compile publisher/*.py
          python -m unittest discover -s publisher/tests -v

      - name: Build daily queue
        shell: bash
        run: |
          if [ -n "${SOCIAL_DATE:-}" ]; then
            python publisher/build_daily_queue.py --date "$SOCIAL_DATE"
          else
            python publisher/build_daily_queue.py
          fi

      - name: Render 9x16 reels
        run: python publisher/render_reels.py

      - name: Reconcile queue after rendering
        shell: bash
        run: |
          if [ -n "${SOCIAL_DATE:-}" ]; then
            python publisher/build_daily_queue.py --date "$SOCIAL_DATE"
          else
            python publisher/build_daily_queue.py
          fi

      - name: Persist prepared queue
        shell: bash
        run: |
          if git diff --quiet -- publisher/queue.json; then
            echo 'Queue unchanged.'
          else
            git config user.name 'open-social-engine'
            git config user.email 'open-social-engine@users.noreply.github.com'
            git add publisher/queue.json
            git commit -m 'Prepare multi-client social queue'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Ask for publishing confirmation
        uses: actions/github-script@v7
        with:
          script: |
            const day = process.env.SOCIAL_DATE || new Date().toISOString().slice(0,10);
            const workflowUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/social-publisher.yml`;
            const body = [
              `La coda social del **${day}** è stata preparata da GitHub Actions.`,
              '',
              '**Nessuna pubblicazione è stata inviata automaticamente.**',
              '',
              `Per confermare: apri [Open Social Publisher](${workflowUrl}) e premi **Run workflow**.`,
              '',
              'La pressione di **Run workflow** è la conferma operativa alla pubblicazione della coda pronta.'
            ].join('\n');
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title: `[SOCIAL-PUBLISH] ${day} - conferma richiesta`, body});
