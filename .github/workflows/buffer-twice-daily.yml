name: F1 Buffer Auto Publisher - 2 Daily x 3 Social

on:
  schedule:
    # One UTC run per slot. This becomes 09:00/17:00 CET or 10:00/18:00 CEST,
    # always before the fixed Europe/Rome targets 10:30 and 18:30.
    - cron: '0 8,16 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'auto, morning or evening'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening
      date:
        description: 'Optional Europe/Rome date YYYY-MM-DD'
        required: false
        type: string
      dry_run:
        description: 'Validate Buffer/Cloudinary and render without scheduling posts'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: open-social-state
  cancel-in-progress: false

jobs:
  publish-buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install media dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Validate Buffer publisher
        run: |
          python -m py_compile \
            publisher/buffer_twice_daily.py \
            publisher/meta_twice_daily.py \
            publisher/render_reels.py

      - name: Schedule due slot on Facebook Instagram LinkedIn
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
            DATE="${{ inputs.date }}"
            DRY="${{ inputs.dry_run }}"
          else
            SLOT="auto"
            DATE=""
            DRY="false"
          fi

          ARGS=(--slot "$SLOT")
          if [ -n "$DATE" ]; then ARGS+=(--date "$DATE"); fi
          if [ "$DRY" = "true" ]; then ARGS+=(--dry-run); fi

          python publisher/buffer_twice_daily.py "${ARGS[@]}"

      - name: Persist idempotency and Buffer publication state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- publisher/queue.json; then
            echo 'No queue state change.'
            exit 0
          fi
          git config user.name 'f1-buffer-auto-publisher'
          git config user.email 'f1-buffer-auto-publisher@users.noreply.github.com'
          git add publisher/queue.json
          git commit -m 'Persist F1 automatic Buffer publication state'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
