name: F1 Weekly Social Preview Index

on:
  workflow_run:
    workflows:
      - Open Social Engine - 10 STATIC PUBLICATIONS - 5 F1 + 5 RMP
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/social-preview-weekly-index.yml'
      - 'monday-control.html'

permissions:
  contents: write
  actions: read

concurrency:
  group: f1-weekly-social-preview-index
  cancel-in-progress: false

jobs:
  build-weekly-preview-index:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Collect only institutional-v2 F1 artifacts from this week
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/f1-week-artifacts /tmp/f1-week-upload
          mkdir -p /tmp/f1-week-artifacts /tmp/f1-week-upload

          WEEK_START=$(python - <<'PY'
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          d=datetime.now(ZoneInfo('Europe/Rome')).date()
          print((d-timedelta(days=d.weekday())).isoformat())
          PY
          )

          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/social-engine-daily.yml/runs?status=success&per_page=100" > /tmp/runs.json
          python - "$WEEK_START" <<'PY' > /tmp/run_ids.txt
          import json,sys
          from datetime import datetime
          start=datetime.fromisoformat(sys.argv[1]+'T00:00:00+00:00')
          data=json.load(open('/tmp/runs.json',encoding='utf-8'))
          for r in data.get('workflow_runs',[]):
              created=datetime.fromisoformat(str(r.get('created_at')).replace('Z','+00:00'))
              # 33942244608 is the first run produced by the institutional-v2 renderer.
              if created >= start and int(r['id']) >= 33942244608:
                  print(r['id'])
          PY

          while IFS= read -r RUN_ID; do
            [ -n "$RUN_ID" ] || continue
            ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name == \"social-publications-${RUN_ID}\") | .id" | head -n1 || true)
            [ -n "$ARTIFACT_ID" ] || continue
            mkdir -p "/tmp/f1-week-artifacts/${RUN_ID}"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o "/tmp/f1-week-${RUN_ID}.zip"
            unzip -q "/tmp/f1-week-${RUN_ID}.zip" -d "/tmp/f1-week-artifacts/${RUN_ID}"
          done < /tmp/run_ids.txt

      - name: Build clean institutional weekly manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,shutil
          from datetime import datetime,timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          ROOT=Path('.')
          ART=Path('/tmp/f1-week-artifacts')
          UPLOAD=Path('/tmp/f1-week-upload')
          q=json.load(open(ROOT/'publisher/queue.json',encoding='utf-8'))
          jobs=[j for j in q.get('jobs',[]) if j.get('client_id')=='f1-immobiliare']
          by_media={str(j.get('media') or ''):j for j in jobs if j.get('media')}
          by_name={Path(str(j.get('media') or '')).name:j for j in jobs if j.get('media')}

          ROME=ZoneInfo('Europe/Rome')
          today=datetime.now(ROME).date()
          monday=today-timedelta(days=today.weekday())
          sunday=monday+timedelta(days=6)
          iso=today.isocalendar()
          week_id=f'{iso.year}-W{iso.week:02d}'
          tag=f'social-preview-week-{week_id}'
          repo=os.environ['GITHUB_REPOSITORY']
          entries={}

          for run_dir in sorted([p for p in ART.iterdir() if p.is_dir()],key=lambda p:int(p.name)):
              run_id=int(run_dir.name)
              for source in run_dir.rglob('*'):
                  if not source.is_file() or source.suffix.lower() not in {'.jpg','.jpeg','.png'}:
                      continue
                  parts=source.parts
                  if 'f1-immobiliare' not in parts:
                      continue
                  idx=parts.index('f1-immobiliare')
                  rel='/'.join(parts[idx:])
                  m=re.search(r'f1-immobiliare/(\d{4}-\d{2}-\d{2})/cycle-(\d{2})/(.+)$',rel)
                  if not m:
                      continue
                  content_date,cycle_hour,basename=m.groups()
                  media='publisher/media/generated/'+rel
                  job=by_media.get(media) or by_name.get(basename) or {}
                  # Critical filter: never expose pre-brand/legacy graphics again.
                  if job.get('visual_compliance') != 'F1_LIGHT_INSTITUTIONAL_V2' or job.get('institutional_render_v2') is not True:
                      continue
                  if not job.get('service_id'):
                      continue
                  asset_name=rel.replace('/','__')
                  shutil.copy2(source,UPLOAD/asset_name)
                  entries[str(job.get('id') or asset_name)]={
                      'id':job.get('id') or asset_name,
                      'content_date':content_date,
                      'scheduled_at':job.get('scheduled_at') or f'{content_date}T{cycle_hour}:00:00+02:00',
                      'cycle_key':job.get('cycle_key') or f'{content_date}T{cycle_hour}:00',
                      'cycle_hour':job.get('cycle_hour',int(cycle_hour)),
                      'service_id':job.get('service_id'),
                      'format':job.get('format') or 'photo',
                      'title':job.get('title') or basename.rsplit('.',1)[0].replace('-',' ').upper(),
                      'caption':job.get('caption') or '',
                      'cta':job.get('cta') or '',
                      'hashtags':job.get('hashtags') or [],
                      'territory':job.get('territory'),
                      'status':job.get('status') or 'preview_ready',
                      'publication_ready':bool(job.get('publication_ready')),
                      'published_platforms':job.get('published_platforms') or [],
                      'asset_name':asset_name,
                      'asset_url':f'https://github.com/{repo}/releases/download/{tag}/{asset_name}',
                      'source_run_id':run_id,
                      'brand_template':'light_f1_institutional',
                      'visual_compliance':'F1_LIGHT_INSTITUTIONAL_V2',
                      'three_boxes':job.get('three_boxes') or []
                  }

          live={}
          live_path=ROOT/'publisher/live-test-2026-09-04-status.json'
          if live_path.exists():
              live=json.load(open(live_path,encoding='utf-8'))
          posts=live.get('posts') or {}
          channels=[]
          for key,label in [('facebook','Facebook'),('instagram','Instagram'),('linkedin','LinkedIn')]:
              row=posts.get(key) or {}
              channels.append({'name':label,'connected':str(row.get('status')).lower()=='sent','account':row.get('account'),'last_sent_at':row.get('sent_at_utc')})
          connected=live.get('result')=='ALL_THREE_SENT' and all(c['connected'] for c in channels)
          hold=(ROOT/'.github/workflows/buffer-twice-daily.yml').read_text(encoding='utf-8')
          automatic='POLICY HOLD / DRY RUN ONLY' not in hold

          manifest={
              'version':'2026-09-05.4',
              'pipeline':'social-preview-latest',
              'brand':'F1 Immobiliare',
              'week_id':week_id,
              'week_start':monday.isoformat(),
              'week_end':sunday.isoformat(),
              'updated_at':datetime.now(ROME).isoformat(timespec='seconds'),
              'release_tag':tag,
              'release_url':f'https://github.com/{repo}/releases/tag/{tag}',
              'legacy_hidden':True,
              'required_visual_compliance':'F1_LIGHT_INSTITUTIONAL_V2',
              'social_connection':{
                  'connected':connected,
                  'data_flow':'CONNECTED' if connected else 'CHECK_REQUIRED',
                  'last_verified_at':live.get('verified_at'),
                  'automatic_publishing':automatic,
                  'sending_status':'AUTOMATIC' if automatic else 'PAUSED_BY_POLICY',
                  'channels':channels
              },
              'entries':sorted(entries.values(),key=lambda x:(x['content_date'],str(x.get('cycle_key') or ''),str(x.get('asset_name') or '')))
          }
          Path('publisher/social-preview-latest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/week-meta.json').write_text(json.dumps({'tag':tag,'title':f'F1 ANTEPRIME {week_id}'}),encoding='utf-8')
          print(f'INSTITUTIONAL FILES={len(entries)} LEGACY=HIDDEN')
          PY

          TAG=$(python -c "import json;print(json.load(open('/tmp/week-meta.json'))['tag'])")
          TITLE=$(python -c "import json;print(json.load(open('/tmp/week-meta.json'))['title'])")
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TITLE" --notes "Solo anteprime F1 conformi al renderer istituzionale v2. Legacy escluse."
          shopt -s nullglob
          FILES=(/tmp/f1-week-upload/*)
          if [ ${#FILES[@]} -gt 0 ]; then gh release upload "$TAG" "${FILES[@]}" --clobber; fi

      - name: Persist weekly JSON manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'f1-social-preview-index'
          git config user.email 'f1-social-preview-index@users.noreply.github.com'
          git add publisher/social-preview-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update clean F1 institutional weekly preview manifest'
          git pull --rebase origin main
          git push origin HEAD:main
