name: Graphic Caption Autopilot CI

on:
  pull_request:
    paths:
      - 'publisher/f1_intelligence_worker.py'
      - 'publisher/intelligence_requirements.txt'
      - 'publisher/test_graphic_caption_intelligence.py'
      - 'f1-content-hub/client-workspace.js'
      - 'f1-content-hub/client-workspace.css'
      - 'f1-content-hub/index.html'
      - '.github/workflows/f1-social-intelligence.yml'
      - '.github/workflows/graphic-caption-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphic-caption:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install lightweight test dependency
        run: pip install requests==2.32.5
      - name: Compile Intelligence worker
        run: python -m py_compile publisher/f1_intelligence_worker.py
      - name: Run graphic caption tests
        run: python -m unittest publisher.test_graphic_caption_intelligence -v
      - name: Check workspace JavaScript syntax
        run: node --check f1-content-hub/client-workspace.js
