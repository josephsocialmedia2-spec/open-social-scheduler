<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Open Social Scheduler con sincronizzazione automatica verso F1 Agenda Operativa.">
  <title>Open Social Scheduler · Sincronizzazione F1</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f8f9fa; }
    .shell { width: 100%; height: 100%; display: grid; grid-template-rows: 42px 1fr; }
    .syncbar { display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #202124; color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.24); z-index: 10; }
    .brand { font-weight: 800; white-space: nowrap; }
    .status { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 13px; color: #e8eaed; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #fbbc04; flex: 0 0 auto; }
    .status-dot.ok { background: #34a853; }
    .status-dot.error { background: #ea4335; }
    .status-text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .spacer { flex: 1; }
    button, a { border: 0; border-radius: 6px; padding: 7px 11px; font: inherit; font-size: 12px; font-weight: 700; text-decoration: none; cursor: pointer; }
    button { background: #fff; color: #202124; }
    button:hover, a:hover { filter: brightness(.96); }
    a { background: #3c4043; color: #fff; border: 1px solid #5f6368; }
    .scheduler { width: 100%; height: 100%; border: 0; background: #fff; }
    .agenda-bridge { position: fixed; width: 1px; height: 1px; left: -9999px; top: -9999px; border: 0; }
    @media (max-width: 720px) {
      .brand { display: none; }
      .syncbar { padding: 0 8px; }
      a { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="syncbar">
      <div class="brand">F1 · Programma contenuti</div>
      <div class="status" title="Stato sincronizzazione">
        <span id="syncDot" class="status-dot"></span>
        <span id="syncStatus" class="status-text">Collegamento all’agenda…</span>
      </div>
      <div class="spacer"></div>
      <button id="syncNow" type="button">Sincronizza ora</button>
      <a id="openAgenda" target="_blank" rel="noopener">Apri agenda</a>
    </div>
    <iframe class="scheduler" src="./index.html" title="Open Social Scheduler"></iframe>
  </div>

  <iframe id="agendaBridge" class="agenda-bridge" title="Collegamento privato F1 Agenda"></iframe>

  <script>
    (() => {
      'use strict';

      const AGENDA_URL = 'https://script.google.com/macros/s/AKfycby3POsMjFwzuWrPqOmopwNL3OaIdwwsE5rBFLX65FzPQ-RVJNGsh8rqsJfCcqpVtQR9IQ/exec';
      const STORAGE_KEY = 'openSocialScheduler.v1';
      const bridge = document.getElementById('agendaBridge');
      const status = document.getElementById('syncStatus');
      const dot = document.getElementById('syncDot');
      const syncButton = document.getElementById('syncNow');
      const openAgenda = document.getElementById('openAgenda');

      let agendaReady = false;
      let agendaOrigin = '';
      let lastSentUpdatedAt = '';
      let lastObservedRaw = '';
      let pending = false;
      let pingTimer = null;

      openAgenda.href = AGENDA_URL;
      bridge.src = AGENDA_URL;

      function setStatus(text, mode = 'waiting') {
        status.textContent = text;
        dot.className = `status-dot${mode === 'ok' ? ' ok' : mode === 'error' ? ' error' : ''}`;
      }

      function readState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY) || '';
          if (!raw) return null;
          const state = JSON.parse(raw);
          if (!state || !Array.isArray(state.clients) || !Array.isArray(state.posts)) return null;
          return state;
        } catch (error) {
          console.error(error);
          return null;
        }
      }

      function pingAgenda() {
        if (!bridge.contentWindow) return;
        bridge.contentWindow.postMessage({ type: 'OSS_SYNC_PING' }, '*');
      }

      function requestSync(force = false) {
        const state = readState();
        if (!state) {
          setStatus('Nessun archivio contenuti presente', 'error');
          return;
        }
        if (!agendaReady) {
          setStatus('Apri l’agenda e completa l’accesso Google', 'waiting');
          pingAgenda();
          return;
        }
        const updatedAt = String(state.updatedAt || '');
        if (!force && updatedAt && updatedAt === lastSentUpdatedAt) return;
        if (pending) return;

        pending = true;
        setStatus(`Invio di ${state.posts.length} contenuti…`, 'waiting');
        bridge.contentWindow.postMessage({
          type: 'OSS_SYNC_PUSH',
          source: 'open-social-scheduler',
          state
        }, agendaOrigin || '*');
      }

      window.addEventListener('message', event => {
        if (!/^https:\/\/script\.google(?:usercontent)?\.com$/.test(event.origin)) return;
        const message = event.data || {};
        if (message.type === 'F1_AGENDA_SYNC_READY') {
          agendaReady = true;
          agendaOrigin = event.origin;
          clearInterval(pingTimer);
          setStatus('Agenda collegata · sincronizzazione automatica attiva', 'ok');
          requestSync(true);
          return;
        }
        if (message.type === 'F1_AGENDA_SYNC_RESULT') {
          pending = false;
          if (message.ok) {
            const state = readState();
            lastSentUpdatedAt = String(state?.updatedAt || '');
            const count = Number(message.result?.contents || 0);
            const time = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
            setStatus(`${count} contenuti sincronizzati alle ${time}`, 'ok');
          } else {
            setStatus(message.error || 'Errore di sincronizzazione', 'error');
          }
        }
      });

      bridge.addEventListener('load', () => {
        setStatus('Verifica accesso all’agenda…', 'waiting');
        setTimeout(pingAgenda, 800);
      });

      syncButton.addEventListener('click', () => requestSync(true));

      pingTimer = setInterval(pingAgenda, 2500);
      setInterval(() => {
        const raw = localStorage.getItem(STORAGE_KEY) || '';
        if (raw !== lastObservedRaw) {
          lastObservedRaw = raw;
          setTimeout(() => requestSync(false), 500);
        }
      }, 1500);

      window.addEventListener('storage', event => {
        if (event.key === STORAGE_KEY) requestSync(false);
      });
    })();
  </script>
</body>
</html>
