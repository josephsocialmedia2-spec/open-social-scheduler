name: F1 Bootstrap Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'F1_AUTO_REINSTALL_TEST.ps1'
      - 'INSTALLA_RISCARICA_E_PROVA_F1.bat'
      - 'INSTALLA_F1_GRAFICHE_23.bat'
      - 'AVVIA_F1_CREATIVE_WINDOWS.bat'
      - 'publisher/f1_graphics_automation/**'
      - '.github/workflows/f1-bootstrap-validation.yml'
  pull_request:
    paths:
      - 'F1_AUTO_REINSTALL_TEST.ps1'
      - 'INSTALLA_RISCARICA_E_PROVA_F1.bat'
      - 'INSTALLA_F1_GRAFICHE_23.bat'
      - 'AVVIA_F1_CREATIVE_WINDOWS.bat'
      - 'publisher/f1_graphics_automation/**'
      - '.github/workflows/f1-bootstrap-validation.yml'

permissions:
  contents: read

jobs:
  validate-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - name: Parse PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            'F1_AUTO_REINSTALL_TEST.ps1',
            'publisher/f1_graphics_automation/START_INBOX.ps1',
            'publisher/f1_graphics_automation/INSTALLA_AUTOMAZIONE_23.ps1',
            'publisher/f1_graphics_automation/RUN_NOTTURNO_23.ps1',
            'publisher/f1_graphics_automation/RUN_F1_DAILY_CREATIVE_TEST.ps1',
            'publisher/f1_graphics_automation/RUN_F1_NEWS_SLOT.ps1',
            'publisher/f1_graphics_automation/RUN_F1_NEWS_POLLER.ps1',
            'publisher/f1_graphics_automation/ENSURE_F1_NEWS_POLLER.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }
              exit 1
            }
            Write-Host "POWERSHELL_SYNTAX_OK $file"
          }

      - name: Validate manual-only bootstrap contract
        shell: pwsh
        run: |
          $installer = Get-Content 'publisher/f1_graphics_automation/INSTALLA_AUTOMAZIONE_23.ps1' -Raw
          foreach ($task in @('F1_Grafiche_23','F1_News_ValleSusa','F1_News_GitHub_Poller')) {
            if (-not $installer.Contains($task)) { throw "Legacy task cleanup missing: $task" }
          }
          if (-not $installer.Contains('Unregister-ScheduledTask')) { throw 'Legacy task removal missing.' }
          if (-not $installer.Contains("TaskName 'F1_Inbox_Logon'")) { throw 'F1_Inbox_Logon registration missing.' }
          if (-not $installer.Contains('manual-publish-only')) { throw 'Manual publish-only health contract missing.' }
          if ($installer.Contains('New-ScheduledTaskTrigger -Daily -At 23:00')) { throw '23:00 graphic generator task still installable.' }
          if ($installer.Contains('chatgpt_query_runner\requirements.txt')) { throw 'AI browser dependencies still installed.' }

          $start = Get-Content 'publisher/f1_graphics_automation/START_INBOX.ps1' -Raw
          if (-not $start.Contains('manual-publish-only')) { throw 'Manual inbox mode check missing.' }
          foreach ($forbidden in @('ENSURE_F1_NEWS_POLLER','ENSURE_F1_GITHUB_RUNNER','free_browser_router','chatgpt_query_runner.worker')) {
            if ($start.Contains($forbidden)) { throw "START_INBOX forbidden runtime: $forbidden" }
          }

          foreach ($file in @(
            'publisher/f1_graphics_automation/RUN_NOTTURNO_23.ps1',
            'publisher/f1_graphics_automation/RUN_F1_DAILY_CREATIVE_TEST.ps1',
            'publisher/f1_graphics_automation/RUN_F1_NEWS_SLOT.ps1',
            'publisher/f1_graphics_automation/RUN_F1_NEWS_POLLER.ps1'
          )) {
            $text = Get-Content $file -Raw
            if (-not $text.Contains('MANUAL PUBLISH ONLY')) { throw "$file is not retired to manual-only mode." }
            foreach ($forbidden in @('chatgpt_query_runner.worker','free_browser_router','F1_CREATIVE_BACKEND')) {
              if ($text.Contains($forbidden)) { throw "$file can still invoke generation: $forbidden" }
            }
          }

          $reinstall = Get-Content 'F1_AUTO_REINSTALL_TEST.ps1' -Raw
          if ($reinstall.Contains('Google.Chrome')) { throw 'Manual installer still installs Chrome for generation.' }
          if ($reinstall.Contains('chatgpt_query_runner\requirements.txt')) { throw 'Manual installer still installs AI browser dependencies.' }
          if (-not $reinstall.Contains('manual-publish-only')) { throw 'Manual-only verification missing in reinstall script.' }

          Write-Host 'F1_MANUAL_BOOTSTRAP_CONTRACT_OK'
