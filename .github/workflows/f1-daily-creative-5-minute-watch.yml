name: F1 Daily Creative 5 Minute Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'publisher/chatgpt_query_runner/F1_DAILY_CREATIVE_WATCH_START'

permissions:
  contents: write
  actions: read

concurrency:
  group: f1-daily-creative-five-minute-watch
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install monitor dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Check F1 daily creative
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python publisher/chatgpt_query_runner/f1_daily_creative_status_monitor.py

      - name: Persist status only when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "F1 Daily Creative Watch"
          git config user.email "f1-daily-watch@users.noreply.github.com"
          git add publisher/chatgpt_query_runner/f1_daily_creative_live_status.json
          if git diff --cached --quiet; then
            echo "NO_CHANGE"
            exit 0
          fi
          git commit -m "Update F1 daily creative live status"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Current status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('publisher/chatgpt_query_runner/f1_daily_creative_live_status.json')
          if not p.exists():
              raise SystemExit(0)
          d=json.loads(p.read_text(encoding='utf-8'))
          print('FINAL_STATUS=', d.get('final_status'))
          print('GRAPHIC_URL=', d.get('graphic_url') or 'NOT_READY')
          print('POST_URLS=', d.get('remote_post_urls') or [])
          print('PC_WORKFLOW=', (d.get('pc_workflow') or {}).get('html_url') or '')
          PY
