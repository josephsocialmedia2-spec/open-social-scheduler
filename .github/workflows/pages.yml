name: Sync Open Social Scheduler Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'index.html'
      - 'content-center.html'
      - 'monday-control.html'
      - 'meta-setup.html'
      - 'groups.html'
      - 'ugc-reel-lab.html'
      - 'growth/groups.json'
      - 'ai-call-copilot-demo/**'
      - 'roleplay-immobiliare/**'
      - 'clienti/la-sacra/**'
      - 'f1-academy/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-sync"
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Stage public files
        shell: bash
        run: |
          rm -rf /tmp/open-social-pages
          mkdir -p /tmp/open-social-pages/growth
          for file in index.html content-center.html monday-control.html meta-setup.html groups.html ugc-reel-lab.html; do
            if [ -f "$file" ]; then cp "$file" /tmp/open-social-pages/; fi
          done
          if [ -f growth/groups.json ]; then cp growth/groups.json /tmp/open-social-pages/growth/groups.json; fi
          if [ -d ai-call-copilot-demo ]; then cp -R ai-call-copilot-demo /tmp/open-social-pages/ai-call-copilot-demo; fi
          if [ -d roleplay-immobiliare ]; then cp -R roleplay-immobiliare /tmp/open-social-pages/roleplay-immobiliare; fi
          if [ -d clienti/la-sacra ]; then
            mkdir -p /tmp/open-social-pages/clienti
            cp -R clienti/la-sacra /tmp/open-social-pages/clienti/la-sacra
          fi
          if [ -d f1-academy ]; then cp -R f1-academy /tmp/open-social-pages/f1-academy; fi

      - name: Sync to gh-pages
        shell: bash
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git switch -C gh-pages origin/gh-pages
          for file in index.html content-center.html monday-control.html meta-setup.html groups.html ugc-reel-lab.html; do
            if [ -f "/tmp/open-social-pages/$file" ]; then cp "/tmp/open-social-pages/$file" "$file"; fi
          done
          mkdir -p growth
          if [ -f /tmp/open-social-pages/growth/groups.json ]; then cp /tmp/open-social-pages/growth/groups.json growth/groups.json; fi
          if [ -d /tmp/open-social-pages/ai-call-copilot-demo ]; then
            rm -rf ai-call-copilot-demo
            cp -R /tmp/open-social-pages/ai-call-copilot-demo ./ai-call-copilot-demo
          fi
          if [ -d /tmp/open-social-pages/roleplay-immobiliare ]; then
            rm -rf roleplay-immobiliare
            cp -R /tmp/open-social-pages/roleplay-immobiliare ./roleplay-immobiliare
          fi
          if [ -d /tmp/open-social-pages/clienti/la-sacra ]; then
            mkdir -p clienti
            rm -rf clienti/la-sacra
            cp -R /tmp/open-social-pages/clienti/la-sacra ./clienti/la-sacra
          fi
          if [ -d /tmp/open-social-pages/f1-academy ]; then
            rm -rf f1-academy
            cp -R /tmp/open-social-pages/f1-academy ./f1-academy
          fi
          touch .nojekyll
          git config user.name 'open-social-pages'
          git config user.email 'open-social-pages@users.noreply.github.com'
          git add index.html content-center.html monday-control.html meta-setup.html groups.html ugc-reel-lab.html growth/groups.json ai-call-copilot-demo roleplay-immobiliare clienti/la-sacra f1-academy .nojekyll
          if git diff --cached --quiet; then
            echo 'Public pages already synchronized.'
            exit 0
          fi
          git commit -m 'Sync public Open Social Scheduler controls'
          git push origin HEAD:gh-pages
