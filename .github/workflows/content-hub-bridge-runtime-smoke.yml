name: Content Hub Bridge Runtime Smoke

on:
  push:
    branches: [main]
    paths:
      - '.content-hub-bridge-smoke-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://nqnmlsmeiynxbdojeyjt.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LASACRA_BUFFER_API_KEY: ${{ secrets.LASACRA_BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r publisher/requirements.txt
      - name: Run bridge without publishing
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(python publisher/supabase_queue_bridge.py --ingest-only)"
          echo "$OUT"
          if echo "$OUT" | grep -q 'BRIDGE_DISABLED'; then
            echo 'SUPABASE_SERVICE_ROLE_KEY is missing.'
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('publisher/queue.json').read_text(encoding='utf-8'))
          hub=[j for j in q.get('jobs',[]) if j.get('source')=='SUPABASE_CONTENT_HUB']
          assert hub, 'No Content Hub jobs were produced from Supabase calendar'
          assert len({j['id'] for j in hub}) == len(hub), 'Duplicate Content Hub queue IDs'
          print(f'RUNTIME_BRIDGE_OK hub_jobs={len(hub)} blocked={sum(j.get("status")=="blocked" for j in hub)}')
          PY
      - name: Verify La Sacra Buffer queue routing without publishing
        shell: bash
        run: |
          set -euo pipefail
          python publisher/buffer_queue_publish.py --verify-client immobiliare-la-sacra
          python - <<'PY'
          import base64, json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          media = Path('publisher/media/smoke/lasacra-buffer-smoke.png')
          media.parent.mkdir(parents=True, exist_ok=True)
          media.write_bytes(base64.b64decode(
              'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='
          ))
          qpath = Path('publisher/queue.json')
          q = json.loads(qpath.read_text(encoding='utf-8'))
          q.setdefault('jobs', [])
          q['jobs'] = [j for j in q['jobs'] if j.get('id') != 'lasacra-buffer-smoke']
          q['jobs'].append({
              'id': 'lasacra-buffer-smoke',
              'enabled': True,
              'status': 'ready',
              'client_id': 'immobiliare-la-sacra',
              'client_name': 'Immobiliare La Sacra',
              'caption': 'Buffer routing smoke test - dry run only',
              'format': 'post',
              'media': ['publisher/media/smoke/lasacra-buffer-smoke.png'],
              'scheduled_at': (datetime.now(timezone.utc) + timedelta(hours=1)).isoformat(),
              'platforms': ['facebook'],
              'published_platforms': [],
              'source': 'SMOKE_TEST',
              'provider': 'buffer',
              'provider_channel_id': '6ab2b713ea19ca0bdeb8103d',
          })
          qpath.write_text(json.dumps(q, ensure_ascii=False, indent=2) + '\\n', encoding='utf-8')
          PY
          python publisher/buffer_queue_publish.py --job-id lasacra-buffer-smoke --dry-run --strict

      - name: Verify website source runtime
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(python publisher/supabase_website_sync.py)"
          echo "$OUT"
          if echo "$OUT" | grep -q 'WEBSITE_SYNC_DISABLED'; then
            exit 1
          fi
