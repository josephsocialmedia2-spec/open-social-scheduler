name: F1 Social Cloud Browser CI

on:
  push:
    branches: [main]
    paths:
      - 'publisher/cloud_publisher/**'
      - 'scripts/f1_browser_session.py'
      - 'scripts/install_f1_social_browser_runner.sh'
      - 'scripts/start_f1_browser_desktop.sh'
      - 'scripts/install_f1_social_windows_runner.ps1'
      - 'scripts/f1_windows_prepare_clients.py'
      - '.github/workflows/f1-social-cloud-publisher.yml'
      - '.github/workflows/f1-social-cloud-browser-ci.yml'
      - 'supabase/migrations/*cloud_browser*'
      - 'supabase/migrations/*local_windows*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.4
      - run: python -m unittest discover -s publisher/cloud_publisher/tests -v
      - run: python -m py_compile publisher/cloud_publisher/*.py publisher/cloud_publisher/browser/*.py scripts/f1_browser_session.py scripts/f1_windows_prepare_clients.py
      - run: bash -n scripts/install_f1_social_browser_runner.sh scripts/start_f1_browser_desktop.sh

  windows-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.4
      - name: Compile Windows browser scripts
        shell: powershell
        run: |
          $files = @()
          $files += Get-ChildItem 'publisher/cloud_publisher' -Filter '*.py' -File | ForEach-Object { $_.FullName }
          $files += Get-ChildItem 'publisher/cloud_publisher/browser' -Filter '*.py' -File | ForEach-Object { $_.FullName }
          $files += (Resolve-Path 'scripts/f1_browser_session.py').Path
          $files += (Resolve-Path 'scripts/f1_windows_prepare_clients.py').Path
          python -m py_compile $files
      - name: Verify package imports and script entrypoint
        shell: powershell
        run: |
          pip install -r publisher/cloud_publisher/requirements.txt
          python -c "import requests, playwright, publisher, publisher.cloud_publisher; print('IMPORTS_OK')"
          python scripts/f1_windows_prepare_clients.py --help
          if ($LASTEXITCODE -ne 0) { throw 'Windows prepare-clients entrypoint failed.' }

      - name: Parse Windows installer PowerShell
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install_f1_social_windows_runner.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
