name: F1 Final Assets - Autonomous Publish

on:
  push:
    branches:
      - main
    paths:
      - 'publisher/final_content_queue.json'
      - 'publisher/final_assets/manual_inbox/**'
      - 'publisher/final_asset_publisher.py'
      - 'publisher/buffer_twice_daily.py'
      - 'publisher/territory_router.py'
      - '.github/workflows/final-assets-autopublish.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f1-final-assets-autopublish
  cancel-in-progress: false

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      F1_PUBLISH_MAX_ATTEMPTS: '5'

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install publisher dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Publish new autonomous communications and verify Buffer delivery
        shell: bash
        run: |
          set -euxo pipefail
          python publisher/final_asset_publisher.py \
            --communications-only \
            --drain \
            --verify \
            --max-jobs 25

      - name: Persist autonomous publication state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'f1-autonomous-publisher'
          git config user.email 'f1-autonomous-publisher@users.noreply.github.com'
          git add publisher/final_content_queue.json
          if git diff --cached --quiet; then
            echo 'No durable publication state changes.'
            exit 0
          fi
          git commit -m 'Persist autonomous F1 publication state'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final status
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('publisher/final_content_queue.json').read_text(encoding='utf-8'))
          jobs=[j for j in q.get('jobs',[]) if str(j.get('communication_id') or '').startswith('COMM-')]
          counts={}
          for job in jobs:
              counts[job.get('status','UNKNOWN')]=counts.get(job.get('status','UNKNOWN'),0)+1
          print(json.dumps({'autonomous_communications': len(jobs), 'statuses': counts}, ensure_ascii=False))
          PY
