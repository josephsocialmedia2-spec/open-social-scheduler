name: Open Social Engine Daily - Prepare Only

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional local date YYYY-MM-DD for controlled test/backfill'
        required: false
        type: string
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: open-social-engine-daily
  cancel-in-progress: false

jobs:
  build-render-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOCIAL_DATE: ${{ inputs.date }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r publisher/requirements.txt

      - name: Validate Python and tenant isolation
        run: |
          python -m py_compile publisher/*.py
          python -m unittest discover -s publisher/tests -v

      - name: Build daily queue
        shell: bash
        run: |
          if [ -n "${SOCIAL_DATE:-}" ]; then
            python publisher/build_daily_queue.py --date "$SOCIAL_DATE"
          else
            python publisher/build_daily_queue.py
          fi

      - name: Render 9x16 reels
        run: python publisher/render_reels.py

      - name: Reconcile queue after rendering
        shell: bash
        run: |
          if [ -n "${SOCIAL_DATE:-}" ]; then
            python publisher/build_daily_queue.py --date "$SOCIAL_DATE"
          else
            python publisher/build_daily_queue.py
          fi

      - name: Persist prepared queue
        shell: bash
        run: |
          if git diff --quiet -- publisher/queue.json; then
            echo 'Queue unchanged.'
          else
            git config user.name 'open-social-engine'
            git config user.email 'open-social-engine@users.noreply.github.com'
            git add publisher/queue.json
            git commit -m 'Prepare multi-client social queue'
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Create approval issue
        uses: actions/github-script@v7
        env:
          TARGET_DAY: ${{ inputs.date }}
        with:
          script: |
            const fs = require('fs');
            const q = JSON.parse(fs.readFileSync('publisher/queue.json', 'utf8'));
            const day = process.env.TARGET_DAY || new Intl.DateTimeFormat('en-CA', {timeZone: 'Europe/Rome'}).format(new Date());
            const jobs = (q.jobs || []).filter(j => String(j.scheduled_at || '').slice(0,10) === day && !['published','disabled'].includes(j.status));
            const lines = [
              `Contenuti preparati automaticamente per **${day}**.`,
              '',
              '**Nessun contenuto viene pubblicato senza un tuo comando.**',
              '',
              'Per controllare le credenziali senza pubblicare, copia il comando `/check ...`.',
              'Per confermare la pubblicazione, copia il comando `/publish ...`.',
              ''
            ];
            for (const j of jobs) {
              const time = String(j.scheduled_at || '').slice(11,16);
              lines.push(`### ${j.client_name} · ${time} · ${j.category}`);
              lines.push(`**${j.title || ''}**`);
              lines.push('');
              lines.push(`Stato: \`${j.status}\``);
              lines.push(`- Verifica: \`/check ${j.id}\``);
              lines.push(`- CONFERMA: \`/publish ${j.id}\``);
              lines.push('');
            }
            if (!jobs.length) lines.push('_Nessun job da approvare per questa data._');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[SOCIAL-PUBLISH] ${day} - conferma richiesta`,
              body: lines.join('\n')
            });
