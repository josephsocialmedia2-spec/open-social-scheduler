name: F1 Project Deploy Validation

on:
  push:
    paths:
      - '.project-deploy-trigger'
      - 'publisher/**'
      - '.github/workflows/project-deploy.yml'
  pull_request:
    paths:
      - 'publisher/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r publisher/requirements.txt
          pip install -r publisher/manual_asset_inbox/requirements.txt

      - name: Compile production pipeline
        run: |
          python -m py_compile publisher/final_asset_publisher.py
          python -m py_compile publisher/persist_final_queue_github.py
          python -m py_compile publisher/buffer_twice_daily.py
          python -m py_compile publisher/chatgpt_query_runner/core.py
          python -m py_compile publisher/chatgpt_query_runner/worker.py
          python -m py_compile publisher/manual_asset_inbox/server.py
          python -m py_compile publisher/build_cycle_queue.py
          python -m py_compile publisher/apply_photo_only.py
          python -m py_compile publisher/render_photos_only.py
          python -m py_compile publisher/run_publication_renderer.py
          python -m py_compile publisher/test_f1_manual_publish_only.py

      - name: Test legacy state compatibility
        run: python -m unittest discover -s publisher/chatgpt_query_runner/tests -v

      - name: Validate manual-publish-only contract
        run: python publisher/test_f1_manual_publish_only.py

      - name: Validate production queue and publisher
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('publisher/final_content_queue.json').read_text(encoding='utf-8'))
          assert data['pipeline']=='f1-final-assets'
          assert data['asset_policy']=='immutable-final-layout'
          assert data['brand']=='F1 Immobiliare'
          platforms=set(data['platforms'])
          assert {'facebook','instagram'}.issubset(platforms)
          assert platforms.issubset({'facebook','instagram','linkedin'})

          cfg=json.loads(Path('publisher/clients/f1-immobiliare.json').read_text(encoding='utf-8'))
          assert cfg['graphics_source']=='manual_only'
          assert cfg['ai_image_generation'] is False
          assert cfg['automatic_brand_layer'] is False
          assert cfg['automatic_rendering'] is False
          assert cfg['manual_asset_required'] is True
          assert cfg['publish_only'] is True

          server=Path('publisher/manual_asset_inbox/server.py').read_text(encoding='utf-8')
          assert '/api/ingest' in server
          assert '/api/queue-status' in server
          assert '/api/generated' not in server
          assert '/api/communications' not in server
          assert 'chatgpt_generated' not in server

          worker=Path('publisher/chatgpt_query_runner/worker.py').read_text(encoding='utf-8')
          assert 'f1_generation_disabled()' in worker
          assert 'F1 MANUAL PUBLISH ONLY: image generation worker is disabled' in worker

          final_publisher=Path('publisher/final_asset_publisher.py').read_text(encoding='utf-8')
          assert '--manual-only' in final_publisher
          assert 'is_manual_f1_job' in final_publisher
          assert 'refresh_publication_status' in final_publisher
          assert 'PUBLISHED_VERIFIED' in final_publisher

          workflow=Path('.github/workflows/f1-final-assets-publisher.yml').read_text(encoding='utf-8').lower()
          assert '--manual-only' in workflow
          for forbidden in ('generate_next_villar_asset.py','chatgpt_query_runner','openai_api_key','leonardo','firefly'):
              assert forbidden not in workflow, forbidden

          buffer_base=Path('publisher/buffer_twice_daily.py').read_text(encoding='utf-8')
          assert "job.get('ai_assisted') is False" in buffer_base
          assert 'get_buffer_post' in buffer_base

          persistence=Path('publisher/persist_final_queue_github.py').read_text(encoding='utf-8')
          assert 'merge_queue' in persistence and 'MAX_ATTEMPTS = 5' in persistence
          print('F1_MANUAL_DEPLOY_CONTRACT_OK')
          PY

      - name: Deployment summary
        run: |
          echo 'F1 deployment validation completed successfully.'
          echo 'Graphics source: operator-created manual assets only.'
          echo 'Flow: manual asset -> SHA validation -> approval/schedule -> publisher -> Buffer -> provider verification.'
          echo 'AI graphic generation: disabled.'
