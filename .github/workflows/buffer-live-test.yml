name: F1 Buffer LIVE Test Publish

on:
  push:
    branches:
      - main
    paths:
      - '.buffer-live-test-trigger'

permissions:
  contents: write

concurrency:
  group: open-social-state
  cancel-in-progress: false

jobs:
  live-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Publish F1 test carousel NOW on Facebook Instagram LinkedIn
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys

          raw = os.environ.get('CLOUDINARY_URL', '').strip()
          if raw.startswith('CLOUDINARY_URL='):
              raw = raw.split('=', 1)[1].strip()
          os.environ['CLOUDINARY_URL'] = raw.strip('"\'')

          sys.path.insert(0, 'publisher')
          import buffer_twice_daily as b

          sys.argv = [
              'buffer_twice_daily.py',
              '--slot', 'morning',
              '--date', '2026-09-04',
          ]
          raise SystemExit(b.main())
          PY

      - name: Persist publication state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- publisher/queue.json; then
            echo 'No queue state change.'
            exit 0
          fi
          git config user.name 'f1-buffer-live-test'
          git config user.email 'f1-buffer-live-test@users.noreply.github.com'
          git add publisher/queue.json
          git commit -m 'Persist F1 live Buffer test publication state'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
