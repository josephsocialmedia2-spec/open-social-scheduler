name: Open Social Engine - PHOTO ONLY - 4 Every 4 Hours

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional local date YYYY-MM-DD for controlled test/backfill'
        required: false
        type: string
  schedule:
    - cron: '0 * * * *'
  push:
    paths:
      - '.github/workflows/social-engine-daily.yml'
      - 'publisher/build_cycle_queue.py'
      - 'publisher/apply_photo_only.py'
      - 'publisher/render_photos_only.py'
      - 'publisher/direct_api_entry.py'
      - 'publisher/requirements.txt'
      - 'publisher/manual_images/**'
      - 'publisher/clients/**'

permissions:
  contents: write
  issues: write

concurrency:
  group: open-social-engine-photo-only-4h
  cancel-in-progress: true

jobs:
  rome-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      cycle_hour: ${{ steps.check.outputs.cycle_hour }}
    steps:
      - id: check
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Europe/Rome'))
          event = os.environ.get('GITHUB_EVENT_NAME', '')
          hours = (0, 4, 8, 12, 16, 20)
          run = event != 'schedule' or now.hour in hours
          hour = now.hour if now.hour in hours else max(h for h in hours if h <= now.hour)
          print(f"run={'true' if run else 'false'}")
          print(f"cycle_hour={hour}")
          PY

  build-photos:
    needs: rome-gate
    if: needs.rome-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOCIAL_DATE: ${{ inputs.date }}
      SOCIAL_CYCLE_HOUR: ${{ needs.rome-gate.outputs.cycle_hour }}
      SOCIAL_RESET_LEGACY: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install photo dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core zip
          python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Validate automatic photo pipeline
        run: |
          python -m py_compile publisher/build_cycle_queue.py publisher/apply_photo_only.py publisher/render_photos_only.py publisher/direct_api_entry.py publisher/direct_api_publish.py

      - name: Clear previous generated media
        shell: bash
        run: |
          rm -rf publisher/media/generated
          mkdir -p publisher/media/generated

      - name: Build exactly 4 folder-driven photo posts
        run: python publisher/build_cycle_queue.py

      - name: Assign F1 and RMP main/recruiting folders
        run: python publisher/apply_photo_only.py

      - name: Prepare only user-uploaded photos
        run: python publisher/render_photos_only.py

      - name: Preserve automatic publication states
        run: python publisher/build_cycle_queue.py --reconcile-only

      - name: Verify four-folder automatic publication gate
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.load(open('publisher/queue.json',encoding='utf-8'))
          key=q.get('current_cycle')
          jobs=[j for j in q.get('jobs',[]) if j.get('cycle_key')==key]
          assert len(jobs)==4, len(jobs)
          assert sum(j.get('client_id')=='f1-immobiliare' for j in jobs)==2
          assert sum(j.get('client_id')=='real-media-pro' for j in jobs)==2
          assert all(j.get('format')=='photo' for j in jobs)
          assert all(j.get('no_video') is True for j in jobs)
          assert all(str(j.get('caption') or '').strip() for j in jobs)
          assert all(str(j.get('manual_folder') or '').strip() for j in jobs)
          allowed={'ready','awaiting_manual_image'}
          assert all(j.get('status') in allowed for j in jobs), [(j.get('id'),j.get('status')) for j in jobs]
          expected={
            ('f1-immobiliare',1):'publisher/manual_images/f1-immobiliare',
            ('f1-immobiliare',2):'publisher/manual_images/f1-immobiliare/RIC LAVORO F1',
            ('real-media-pro',1):'publisher/manual_images/real-media-pro',
            ('real-media-pro',2):'publisher/manual_images/real-media-pro/RIC LAVORO RMP',
          }
          for j in jobs:
              assert j['manual_folder']==expected[(j['client_id'],int(j['cycle_position']))]
              rel=str(j.get('media') or '')
              assert rel.lower().endswith(('.jpg','.jpeg','.png')), rel
              p=Path(rel)
              if j.get('status')=='ready':
                  assert j.get('visual_source')=='manual-upload', j.get('id')
                  assert j.get('auto_publish_ready') is True
                  assert p.exists() and p.stat().st_size>20000, rel
                  platforms={x.get('platform') for x in j.get('platforms',[]) if isinstance(x,dict)}
                  assert platforms=={'facebook','instagram','linkedin','pinterest'}, platforms
              else:
                  assert j.get('auto_publish_ready') is False
                  assert not p.exists(), rel
          assert not list(Path('publisher/media/generated').rglob('*.mp4'))
          assert not list(Path('publisher/media/generated').rglob('*.mp3'))
          ready=sum(j.get('status')=='ready' for j in jobs)
          waiting=4-ready
          print(f'VERIFIED: 4 folder posts; {ready} ready for auto publication; {waiting} waiting for uploaded images.')
          PY

      - name: Upload available manual-photo package
        uses: actions/upload-artifact@v4
        with:
          name: social-photo-cycle-${{ github.run_id }}
          path: publisher/media/generated
          if-no-files-found: warn
          retention-days: 7

      - name: Persist queue and image memory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for FILE in publisher/queue.json publisher/image_history.json; do
            [ -f "$FILE" ] || continue
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=main" --jq '.sha' 2>/dev/null || true)
            python - "$FILE" "$SHA" <<'PY'
          import base64, json, sys
          file, sha = sys.argv[1], sys.argv[2]
          payload={'message':f'Persist folder-photo state: {file}','content':base64.b64encode(open(file,'rb').read()).decode(),'branch':'main'}
          if sha: payload['sha']=sha
          json.dump(payload,open('/tmp/payload.json','w'))
          PY
            gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}" --method PUT --input /tmp/payload.json >/dev/null
          done

      - name: Replace latest release with available photos
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf /tmp/social-release
          mkdir -p /tmp/social-release
          find publisher/media/generated -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print0 | while IFS= read -r -d '' file; do
            rel="${file#publisher/media/generated/}"
            safe="${rel//\//__}"
            cp "$file" "/tmp/social-release/$safe"
          done
          for client in f1-immobiliare real-media-pro; do
            if find "publisher/media/generated/$client" -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print -quit 2>/dev/null | grep -q .; then
              (cd "publisher/media/generated/$client" && zip -qr "/tmp/social-release/${client}__FOTO_CICLO_CORRENTE.zip" . -i '*.jpg' '*.jpeg' '*.png')
            fi
          done
          cp publisher/queue.json /tmp/social-release/queue.json
          gh release delete social-preview-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create social-preview-latest /tmp/social-release/* \
            --title "4 FOTO DA CARTELLE + PUBBLICAZIONE AUTOMATICA - ciclo ${{ needs.rome-gate.outputs.cycle_hour }}:00" \
            --notes "Ciclo: F1 principale + RIC LAVORO F1 + RMP principale + RIC LAVORO RMP. Solo le immagini caricate dall'utente diventano READY e vengono inviate al publisher automatico. Facebook, Instagram, LinkedIn e Pinterest quando le relative credenziali sono disponibili. Nessun Reel, MP4 o audio. Run ${GITHUB_RUN_ID}."

      - name: Notify folder-photo results
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const q=JSON.parse(fs.readFileSync('publisher/queue.json','utf8'));
            const jobs=(q.jobs||[]).filter(j=>j.cycle_key===q.current_cycle);
            const ready=jobs.filter(j=>j.status==='ready').length;
            const waiting=jobs.filter(j=>j.status==='awaiting_manual_image').length;
            const title='[CONTENUTI 4H] - risultati';
            const body=[
              '@josephsocialmedia2-spec ciclo cartelle completato.',
              '',
              '**4 POST FOTO:** F1 principale + RIC LAVORO F1 + RMP principale + RIC LAVORO RMP.',
              `**Pronti per pubblicazione automatica:** ${ready}.`,
              `**In attesa di immagine caricata:** ${waiting}.`,
              '**Destinazioni foto automatiche:** Facebook · Instagram · LinkedIn · Pinterest (se collegati).',
              '**TikTok/YouTube:** esclusi dal ciclo foto attuale.',
              '',
              'Controllo: https://josephsocialmedia2-spec.github.io/open-social-scheduler/monday-control.html',
              'Run: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            ].join('\n');
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'all',per_page:100});
            let issue=issues.find(i=>i.title===title);
            if(!issue) issue=(await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body,assignees:['josephsocialmedia2-spec']})).data;
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,body});
