name: F1 Hourly Graphics

on:
  schedule:
    - cron: '17 * * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f1-hourly-graphics
  cancel-in-progress: false

jobs:
  generate-one-graphic:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r publisher/f1_graphics_hourly/requirements.txt

      - name: Verify Excel exists
        run: |
          test -f publisher/f1_graphics_hourly/queries.xlsx || {
            echo "ERRORE: manca publisher/f1_graphics_hourly/queries.xlsx"
            exit 1
          }

      - name: Generate one F1 graphic and caption
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL || 'gpt-5.6-terra' }}
          F1_CAPTION_REFERENCES: ${{ vars.F1_CAPTION_REFERENCES }}
        run: python publisher/f1_graphics_hourly/worker.py

      - name: Commit generated assets and state
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi

          git config user.name "F1 Graphics Bot"
          git config user.email "actions@users.noreply.github.com"
          git add publisher/final_assets publisher/f1_graphics_hourly/state.json
          git commit -m "Add hourly F1 graphic"
          git push
