name: F1 Manual Assets Publisher

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the next manual F1 asset without creating Buffer posts'
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/f1-final-assets-publisher.yml'
      - 'publisher/final_asset_publisher.py'
      - 'publisher/persist_final_queue_github.py'
      - 'publisher/territory_router.py'
      - 'publisher/territory_channels.json'
      - 'publisher/buffer_twice_daily.py'
      - 'publisher/final_content_queue.json'
      - 'publisher/final_assets/manual_inbox/**'

permissions:
  contents: write

concurrency:
  group: f1-manual-assets-publisher
  cancel-in-progress: false

jobs:
  publish-manual-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      F1_PUBLISH_MAX_ATTEMPTS: '3'

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Snapshot queue before publishing
        shell: bash
        run: cp publisher/final_content_queue.json /tmp/f1-final-content-queue-before.json

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install publisher dependencies
        run: python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Validate manual-only publisher
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile \
            publisher/final_asset_publisher.py \
            publisher/territory_router.py \
            publisher/buffer_twice_daily.py
          python -m json.tool publisher/final_content_queue.json >/dev/null
          python -m json.tool publisher/clients/f1-immobiliare.json >/dev/null
          python - <<'PY'
          import json
          cfg=json.load(open('publisher/clients/f1-immobiliare.json',encoding='utf-8'))
          assert cfg.get('graphics_source') == 'manual_only'
          assert cfg.get('ai_image_generation') is False
          assert cfg.get('automatic_brand_layer') is False
          assert cfg.get('automatic_rendering') is False
          assert cfg.get('publish_only') is True
          print('F1_MANUAL_PUBLISH_ONLY_CONFIG_OK')
          PY

      - name: Publish and verify manual F1 assets only
        shell: bash
        run: |
          set -euo pipefail
          DRY='${{ inputs.dry_run }}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$DRY" = "true" ]; then
            python publisher/final_asset_publisher.py --manual-only --dry-run
          else
            python publisher/final_asset_publisher.py --manual-only --drain --verify --max-jobs 25
          fi

      - name: Persist final asset queue state atomically
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python publisher/persist_final_queue_github.py \
            --before /tmp/f1-final-content-queue-before.json \
            --after publisher/final_content_queue.json

      - name: Status
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          q=json.load(open('publisher/final_content_queue.json',encoding='utf-8'))
          rows=[j for j in q.get('jobs',[]) if j.get('graphics_source')=='manual_only' and j.get('source')=='manual-upload']
          counts={}
          for job in rows:
              counts[job.get('status','UNKNOWN')]=counts.get(job.get('status','UNKNOWN'),0)+1
          print('F1 manual assets:', len(rows), counts)
          print('Generation: DISABLED. Publisher input: manual assets only.')
          PY
