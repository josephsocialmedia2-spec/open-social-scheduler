name: F1 Hourly Graphics

on:
  schedule:
    - cron: '17 * * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f1-hourly-graphics
  cancel-in-progress: false

jobs:
  generate-one-graphic:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: powershell
        run: pip install -r publisher/f1_graphics_hourly/requirements.txt

      - name: Verify Excel exists
        shell: powershell
        run: |
          if (-not (Test-Path 'publisher/f1_graphics_hourly/queries.xlsx')) {
            throw 'ERRORE: manca publisher/f1_graphics_hourly/queries.xlsx'
          }

      - name: Generate one F1 graphic and caption
        shell: powershell
        env:
          F1_CAPTION_REFERENCES: ${{ vars.F1_CAPTION_REFERENCES }}
        run: python publisher/f1_graphics_hourly/worker.py

      - name: Commit generated assets and state
        shell: powershell
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'Nessuna modifica da salvare.'
            exit 0
          }
          git config user.name 'F1 Graphics Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add publisher/final_assets publisher/f1_graphics_hourly/state.json
          git commit -m 'Add hourly F1 graphic'
          git push
