name: F1 Buffer Publisher - LIVE FEED

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'auto, morning or evening'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening
      dry_run:
        description: 'Validate without creating Buffer posts'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/workflows/buffer-twice-daily.yml'
      - 'publisher/buffer_feed_production.py'
      - 'publisher/f1-feed-latest.json'
  schedule:
    - cron: '0 8,16 * * *'

permissions:
  contents: write

concurrency:
  group: f1-buffer-live-feed
  cancel-in-progress: false

jobs:
  publish-approved-f1-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Validate approved F1 feed
        shell: bash
        run: |
          set -euxo pipefail
          python -m json.tool publisher/f1-feed-latest.json >/dev/null
          python -m py_compile publisher/buffer_twice_daily.py publisher/buffer_feed_production.py
          python - <<'PY'
          import json
          m=json.load(open('publisher/f1-feed-latest.json',encoding='utf-8'))
          assert m.get('pipeline') == 'f1-instagram-production-feed'
          assert m.get('brand') == 'F1 Immobiliare'
          assert m.get('count') == 28
          assert m.get('reels') == 14
          assert m.get('carousels') == 14
          entries=m.get('entries') or []
          assert len(entries) == 28
          assert all(e.get('quality_gate_passed') is True for e in entries)
          print('F1 LIVE FEED VALIDATED: 28/28')
          PY

      - name: Publish or schedule next approved feed item
        shell: bash
        run: |
          set -euo pipefail
          SLOT='${{ inputs.slot }}'
          DRY='${{ inputs.dry_run }}'
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            SLOT='evening'
            DRY='false'
          fi
          SLOT="${SLOT:-auto}"
          ARGS=(--slot "$SLOT")
          if [ "$DRY" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python publisher/buffer_feed_production.py "${ARGS[@]}"

      - name: Persist Buffer production state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'f1-buffer-production'
          git config user.email 'f1-buffer-production@users.noreply.github.com'
          git add publisher/queue.json
          if git diff --cached --quiet; then
            echo 'No Buffer state changes to persist.'
            exit 0
          fi
          git commit -m 'Persist F1 live feed publication state'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Production status
        if: always()
        run: |
          echo 'F1 production source: publisher/f1-feed-latest.json'
          echo 'Publishing cadence: 10:30 and 18:30 Europe/Rome'
          echo 'Targets: Facebook + Instagram + LinkedIn through Buffer'
          echo 'Formats: Reel + Carousel'
