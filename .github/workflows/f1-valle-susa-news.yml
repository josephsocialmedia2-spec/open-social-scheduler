name: F1 Valle di Susa News Contract Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'publisher/news/**'
      - 'publisher/chatgpt_query_runner/**'
      - 'publisher/manual_asset_inbox/server.py'
      - 'publisher/f1_graphics_automation/RUN_F1_NEWS_SLOT.ps1'
      - 'publisher/f1_graphics_automation/INSTALLA_AUTOMAZIONE_23.ps1'
      - '.github/workflows/f1-valle-susa-news.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check requests pillow

      - name: Validate Python and JSON
        run: |
          python -m py_compile publisher/news/f1_valle_susa_news.py
          python -m py_compile publisher/chatgpt_query_runner/core.py
          python -m py_compile publisher/chatgpt_query_runner/worker.py
          python -m py_compile publisher/manual_asset_inbox/server.py
          python -m json.tool publisher/news/f1_valle_susa_sources.json >/dev/null

      - name: Assert static-card publisher is disabled
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('publisher/news/f1_valle_susa_news.py').read_text(encoding='utf-8')
          forbidden = ['def render_news_card(', 'ImageDraw.Draw(', 'final_assets/news_valle_susa']
          found = [x for x in forbidden if x in p]
          if found:
              raise SystemExit('Static F1 news creative path still present: ' + ', '.join(found))
          required = ['build_visual_prompt', 'f1_news_current.local.json', 'COMM-NEWS-']
          missing = [x for x in required if x not in p]
          if missing:
              raise SystemExit('Missing GPT-browser news handoff markers: ' + ', '.join(missing))
          print('STATIC_CARD_DISABLED_AND_GPT_HANDOFF_PRESENT')
          PY

      - name: Build a news query payload only
        run: |
          python publisher/news/f1_valle_susa_news.py --slot immediate --write-query-file /tmp/f1-news-query.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/f1-news-query.json',encoding='utf-8'))
          row=(q.get('queries') or [{}])[0]
          required=['id','prompt','caption','source_name','source_url','news_id','headline']
          missing=[k for k in required if not str(row.get(k) or '').strip()]
          if missing:
              raise SystemExit('Incomplete F1 news GPT payload: ' + ', '.join(missing))
          if not str(row['id']).startswith('COMM-NEWS-'):
              raise SystemExit('News communication id is not deterministic COMM-NEWS-*')
          print('NEWS_GPT_PAYLOAD_OK')
          PY

      - name: Confirm local Windows scheduler is authoritative
        run: |
          grep -q "F1_News_ValleSusa" publisher/f1_graphics_automation/INSTALLA_AUTOMAZIONE_23.ps1
          grep -q "11:30" publisher/f1_graphics_automation/INSTALLA_AUTOMAZIONE_23.ps1
          grep -q "19:30" publisher/f1_graphics_automation/INSTALLA_AUTOMAZIONE_23.ps1
          grep -q "RUN_F1_NEWS_SLOT.ps1" publisher/f1_graphics_automation/INSTALLA_AUTOMAZIONE_23.ps1
          echo LOCAL_WINDOWS_GPT_SCHEDULER_CONTRACT_OK
