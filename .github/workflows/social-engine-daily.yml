name: Open Social Engine Daily - Prepare Only

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional local date YYYY-MM-DD for controlled test/backfill'
        required: false
        type: string
  schedule:
    - cron: '10 4 * * *'
  push:
    paths:
      - '.github/workflows/social-engine-daily.yml'
      - 'publisher/build_daily_queue.py'
      - 'publisher/render_reels.py'
      - 'publisher/requirements.txt'
      - 'publisher/clients/**'
      - 'publisher/content_bank/**'
      - 'publisher/approvals/**'
      - 'publisher/tests/**'

permissions:
  contents: write
  issues: write

concurrency:
  group: open-social-engine-daily
  cancel-in-progress: true

jobs:
  build-render-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOCIAL_DATE: ${{ inputs.date }}
      SOCIAL_START_OFFSET_DAYS: ${{ github.event_name == 'schedule' && '0' || '1' }}
      PIPER_DATA_DIR: ${{ github.workspace }}/.cache/piper
      SOCIAL_PHOTO_CACHE: ${{ github.workspace }}/.cache/f1-photos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r publisher/requirements.txt

      - name: Cache Italian voice and F1 photos
        uses: actions/cache@v4
        with:
          path: |
            .cache/piper
            .cache/f1-photos
          key: f1-social-assets-v2

      - name: Prepare Italian voice
        run: |
          mkdir -p "$PIPER_DATA_DIR" "$SOCIAL_PHOTO_CACHE"
          if [ ! -f "$PIPER_DATA_DIR/it_IT-paola-medium.onnx" ]; then
            python -m piper.download_voices it_IT-paola-medium --data-dir "$PIPER_DATA_DIR"
          fi

      - name: Validate Python and tenant isolation
        run: |
          python -m py_compile publisher/*.py
          python -m unittest discover -s publisher/tests -v

      - name: Build seven-day queue
        shell: bash
        run: |
          if [ -n "${SOCIAL_DATE:-}" ]; then
            python publisher/build_daily_queue.py --date "$SOCIAL_DATE"
          else
            python publisher/build_daily_queue.py
          fi

      - name: Render premium reels and carousels
        run: python publisher/render_reels.py

      - name: Reconcile approval and media state
        shell: bash
        run: |
          if [ -n "${SOCIAL_DATE:-}" ]; then
            python publisher/build_daily_queue.py --date "$SOCIAL_DATE"
          else
            python publisher/build_daily_queue.py
          fi

      - name: Upload preview package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-preview-${{ github.run_id }}
          path: publisher/media/generated
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist prepared queue
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- publisher/queue.json; then
            echo 'Queue unchanged.'
          else
            git config user.name 'open-social-engine'
            git config user.email 'open-social-engine@users.noreply.github.com'
            git add publisher/queue.json
            git commit -m 'Prepare approval-gated social queue'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Resolve Rome week
        id: week
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Europe/Rome'))
          iso = now.date().isocalendar()
          print(f"key={iso.year}-W{iso.week:02d}")
          print(f"monday={'true' if now.weekday() == 0 else 'false'}")
          print(f"date={now.date().isoformat()}")
          PY

      - name: Request one weekly confirmation
        if: steps.week.outputs.monday == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const key = '${{ steps.week.outputs.key }}';
            const title = `[SOCIAL-WEEK] ${key} - conferma richiesta`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            if (existing.some(i => i.title === title)) {
              core.info(`Approval issue already exists: ${title}`);
              return;
            }
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const editorialChat = 'https://chatgpt.com/c/6a814ec3-80cc-83eb-b9b6-a56f02c348e8';
            const body = [
              `GitHub ha preparato il pacchetto social F1 per **${key}**.`,
              '',
              '**Posizionamento fisso:** NON A SENSAZIONE. CON I DATI.',
              '**Sequenza giornaliera:** 08:00 DATI → 12:30 ERRORE → 17:30 PROVA → 20:30 DECISIONE.',
              '',
              '**Nessun contenuto viene pubblicato prima della tua conferma.**',
              '',
              `1. Chat editoriale F1: ${editorialChat}`,
              `2. Controlla i contenuti: ${repoUrl}/actions/workflows/social-engine-daily.yml`,
              `3. Se va bene, rispondi a questa issue scrivendo esattamente: **CONFERMO**`,
              '',
              'Dopo CONFERMO, gli slot approvati vengono pubblicati automaticamente alle loro scadenze tramite le API ufficiali configurate.',
              '',
              'Per bloccare i contenuti non ancora pubblicati della settimana puoi scrivere **REVOCA**.'
            ].join('\n');
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
