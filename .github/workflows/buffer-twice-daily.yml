name: F1 Buffer Publisher - POLICY HOLD / DRY RUN ONLY

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'morning or evening preview'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening
      date:
        description: 'Optional Europe/Rome date YYYY-MM-DD'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: f1-policy-hold-preview
  cancel-in-progress: true

jobs:
  preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install media dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Validate binding F1 institutional policy
        shell: bash
        run: |
          set -euxo pipefail
          python -m json.tool publisher/f1_content_policy.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('publisher/f1_content_policy.json',encoding='utf-8'))
          assert p.get('brand') == 'F1 Immobiliare'
          assert p.get('status') == 'binding'
          assert p.get('visual_identity',{}).get('template_family') == 'light_f1_institutional'
          assert p.get('publication_guard',{}).get('block_if_visual_template_is_not_light_f1') is True
          print('F1 INSTITUTIONAL POLICY VALIDATED')
          PY

      - name: Validate publisher code
        run: |
          python -m py_compile \
            publisher/buffer_twice_daily.py \
            publisher/meta_twice_daily.py \
            publisher/render_reels.py \
            publisher/apply_photo_only.py

      - name: Dry-run only - never publish while policy hold is active
        shell: bash
        run: |
          set -euo pipefail
          SLOT='${{ inputs.slot }}'
          DATE='${{ inputs.date }}'
          ARGS=(--slot "$SLOT" --dry-run)
          if [ -n "$DATE" ]; then
            ARGS+=(--date "$DATE")
          fi
          python publisher/buffer_twice_daily.py "${ARGS[@]}"

      - name: Policy hold notice
        if: always()
        run: |
          echo 'AUTOMATIC SOCIAL PUBLISHING IS DISABLED.'
          echo 'Reason: the previous dark/fallback renderer does not comply with the binding F1 institutional white-green-black brand system.'
          echo 'This workflow can only perform a dry run until the production renderer is rebuilt and validated against publisher/f1_content_policy.json.'
