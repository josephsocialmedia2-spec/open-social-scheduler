name: OSS v2 Backend CI

on:
  push:
    branches:
      - oss-v2-control-center
    paths:
      - 'backend/**'
      - '.github/workflows/backend-v2-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Database smoke test
        env:
          DATABASE_URL: sqlite:///./oss_v2_ci.db
        run: |
          python - <<'PY'
          from backend.app.db import init_db, engine
          from backend.app.models import Client, ContentItem, PostStatus
          from sqlmodel import Session, select

          init_db()
          with Session(engine) as s:
              c = Client(slug='ci-client', name='CI Client')
              s.add(c); s.commit(); s.refresh(c)
              p = ContentItem(client_id=c.id, title='Smoke', status=PostStatus.scheduled)
              s.add(p); s.commit()
              assert s.exec(select(Client).where(Client.slug == 'ci-client')).first() is not None
              assert s.exec(select(ContentItem)).first().status == PostStatus.scheduled
          print('OSS V2 DATABASE SMOKE OK')
          PY
