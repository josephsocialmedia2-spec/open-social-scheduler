name: Facebook Group Approval

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: facebook-group-approval
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      startsWith(github.event.issue.title, '[FB-GROUPS]') &&
      startsWith(github.event.comment.body, '/') &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approval command
        env:
          APPROVAL_COMMAND: ${{ github.event.comment.body }}
          APPROVAL_BATCH_ID: ${{ github.event.issue.title }}
        run: |
          export APPROVAL_BATCH_ID="${APPROVAL_BATCH_ID#*Batch }"
          python growth/apply_approval.py
      - name: Persist status
        shell: bash
        run: |
          if git diff --quiet -- growth/groups.json; then
            echo 'No status changes.'
            exit 0
          fi
          git config user.name 'visibility-engine'
          git config user.email 'visibility-engine@users.noreply.github.com'
          git add growth/groups.json
          git commit -m "Apply Facebook group approval"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Confirm command
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Comando registrato dal Visibility Engine. La dashboard verrà aggiornata da GitHub Pages.'});
