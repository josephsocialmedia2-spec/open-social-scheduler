name: F1 Buffer Auto Publisher - 2 Daily x 3 Social

on:
  schedule:
    # One UTC run per slot. This becomes 09:00/17:00 CET or 10:00/18:00 CEST,
    # always before the fixed Europe/Rome targets 10:30 and 18:30.
    - cron: '0 8,16 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'auto, morning or evening'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening
      date:
        description: 'Optional Europe/Rome date YYYY-MM-DD'
        required: false
        type: string
      dry_run:
        description: 'Validate Buffer/Cloudinary and render without scheduling posts'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: open-social-state
  cancel-in-progress: false

jobs:
  publish-buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install media dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Validate Buffer publisher
        run: |
          python -m py_compile \
            publisher/buffer_twice_daily.py \
            publisher/meta_twice_daily.py \
            publisher/render_reels.py

      - name: Schedule due slot on Facebook Instagram LinkedIn
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
            DATE="${{ inputs.date }}"
            DRY="${{ inputs.dry_run }}"
          else
            SLOT="auto"
            DATE=""
            DRY="false"
          fi
          export SLOT DATE DRY

          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          from PIL import Image, ImageDraw, ImageFont

          sys.path.insert(0, 'publisher')
          import buffer_twice_daily as b

          # Cloudinary dashboard can copy either cloudinary://... or
          # CLOUDINARY_URL=cloudinary://... . Accept both permanently.
          raw = os.environ.get('CLOUDINARY_URL', '').strip()
          if raw.startswith('CLOUDINARY_URL='):
              raw = raw.split('=', 1)[1].strip()
          os.environ['CLOUDINARY_URL'] = raw.strip('"\'')

          # Buffer's Instagram API represents a multi-image feed carousel as
          # type=post plus multiple image assets. `type=carousel` is rejected.
          original_metadata = b.gql_metadata
          def fixed_metadata(service, job):
              if service == 'instagram' and str(job.get('format')) != 'reel':
                  return '{ instagram: { type: post, shouldShareToFeed: true } }'
              return original_metadata(service, job)
          b.gql_metadata = fixed_metadata

          # Keep the richer primary renderer, but never let a temporary 403/429
          # from an external photo source stop the daily slot. A local branded
          # fallback is generated without any external media dependency.
          original_render = b.content.render_job
          def local_fallback(job):
              root = b.ROOT
              rel_dir = Path('publisher/media/generated/buffer-fallback') / str(job['id'])
              out_dir = root / rel_dir
              out_dir.mkdir(parents=True, exist_ok=True)

              bold_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
              regular_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
              green = '#92C205'
              white = '#F7F7F4'
              muted = '#C7CDC8'
              panel = '#0D1711'
              bg = '#070907'

              def fit(draw, text, max_width, start, minimum):
                  size = start
                  while size >= minimum:
                      font = ImageFont.truetype(bold_path, size)
                      box = draw.multiline_textbbox((0, 0), text, font=font, spacing=14, align='center')
                      if box[2] - box[0] <= max_width:
                          return font
                      size -= 4
                  return ImageFont.truetype(bold_path, minimum)

              def make_frame(path, headline, subline, width, height):
                  img = Image.new('RGB', (width, height), bg)
                  draw = ImageDraw.Draw(img)
                  margin = max(44, int(width * 0.05))
                  draw.rounded_rectangle(
                      (margin, margin, width - margin, height - margin),
                      radius=34, fill=panel, outline=green, width=5,
                  )
                  draw.rectangle((margin, margin, width - margin, margin + 20), fill=green)
                  brand = ImageFont.truetype(bold_path, max(32, int(width * 0.04)))
                  small = ImageFont.truetype(regular_path, max(24, int(width * 0.027)))
                  draw.text((width // 2, int(height * 0.13)), 'F1 IMMOBILIARE', font=brand, fill=white, anchor='mm')
                  draw.text((width // 2, int(height * 0.18)), 'NON A SENSAZIONE. CON I DATI.', font=small, fill=green, anchor='mm')
                  title_font = fit(draw, headline, width - 2 * margin - 80, max(62, int(width * 0.082)), 46)
                  draw.multiline_text(
                      (width // 2, int(height * 0.45)), headline,
                      font=title_font, fill=white, spacing=16, align='center', anchor='mm',
                  )
                  sub_font = ImageFont.truetype(regular_path, max(30, int(width * 0.038)))
                  draw.multiline_text(
                      (width // 2, int(height * 0.68)), subline,
                      font=sub_font, fill=muted, spacing=12, align='center', anchor='mm',
                  )
                  cta = str(job.get('cta') or 'F1 IMMOBILIARE · 371 370 8294')
                  cta_font = ImageFont.truetype(bold_path, max(27, int(width * 0.034)))
                  draw.text((width // 2, int(height * 0.86)), cta, font=cta_font, fill=green, anchor='mm')
                  img.save(path, quality=94, optimize=True)

              raw_slides = list(job.get('slides') or [])
              clean_slides = [str(x).replace('|', '\n') for x in raw_slides if str(x).strip()]
              title = str(job.get('title') or 'F1 IMMOBILIARE').upper()
              caption_hint = str(job.get('caption') or '').split('\n', 1)[0][:180]

              if str(job.get('format')) == 'reel':
                  frame = out_dir / 'reel-frame.jpg'
                  headline = clean_slides[0] if clean_slides else title
                  make_frame(frame, headline, caption_hint, 1080, 1920)
                  video = out_dir / 'reel-fallback.mp4'
                  subprocess.run(
                      [
                          'ffmpeg', '-y', '-loglevel', 'error', '-loop', '1',
                          '-i', str(frame), '-t', '12', '-r', '30',
                          '-c:v', 'libx264', '-pix_fmt', 'yuv420p',
                          '-vf', 'scale=1080:1920', '-movflags', '+faststart', str(video),
                      ],
                      check=True,
                  )
                  job['media'] = [str(video.relative_to(root))]
                  job['video_made_with_ai'] = False
              else:
                  slide_texts = clean_slides[:4] or [title]
                  paths = []
                  for index, headline in enumerate(slide_texts, 1):
                      path = out_dir / f'slide-{index:02d}.jpg'
                      make_frame(path, headline, caption_hint, 1080, 1350)
                      paths.append(str(path.relative_to(root)))
                  job['media'] = paths

              job['render_fallback'] = 'local_no_external_media'

          def hardened_render(job, client):
              try:
                  return original_render(job, client)
              except Exception as exc:
                  print(f'PRIMARY_RENDER_FAILED: {type(exc).__name__}: {exc}')
                  print('USING_LOCAL_RENDER_FALLBACK')
                  local_fallback(job)
                  return None
          b.content.render_job = hardened_render

          argv = ['buffer_twice_daily.py', '--slot', os.environ.get('SLOT', 'auto')]
          raw_date = os.environ.get('DATE', '').strip()
          if raw_date:
              argv += ['--date', raw_date]
          if os.environ.get('DRY', 'false').lower() == 'true':
              argv.append('--dry-run')
          sys.argv = argv
          raise SystemExit(b.main())
          PY

      - name: Persist idempotency and Buffer publication state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- publisher/queue.json; then
            echo 'No queue state change.'
            exit 0
          fi
          git config user.name 'f1-buffer-auto-publisher'
          git config user.email 'f1-buffer-auto-publisher@users.noreply.github.com'
          git add publisher/queue.json
          git commit -m 'Persist F1 automatic Buffer publication state'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
