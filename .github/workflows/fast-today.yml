name: Emergency Fast Today - 1 F1 + 1 RMP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fast-today.yml'
      - 'publisher/fast_today.py'
      - 'publisher/fast_render.py'

permissions:
  contents: write
  issues: write

concurrency:
  group: emergency-fast-today
  cancel-in-progress: true

jobs:
  build-two-now:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOCIAL_DATE: '2026-08-18'
      PIPER_DATA_DIR: ${{ github.workspace }}/.cache/piper
      SOCIAL_PHOTO_CACHE: ${{ github.workspace }}/.cache/social-photos

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install renderer
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core zip
          python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Build today's deluxe candidates
        run: python publisher/build_daily_queue.py --date "$SOCIAL_DATE"

      - name: Apply premium captions voiceover and visuals
        run: python publisher/enrich_queue.py

      - name: Keep only one Reel per brand now
        run: python publisher/fast_today.py

      - name: Render the two priority Reels with resilient image loading
        run: python publisher/fast_render.py

      - name: Verify exactly two final MP4 files exist
        shell: bash
        run: |
          set -euxo pipefail
          COUNT=$(find publisher/media/generated -type f -name '*.mp4' | wc -l)
          test "$COUNT" -eq 2
          find publisher/media/generated -type f -name '*.mp4' -print

      - name: Persist fast queue to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/publisher/queue.json?ref=main" --jq '.sha')
          python - "$SHA" <<'PY'
          import base64, json, sys
          sha=sys.argv[1]
          content=base64.b64encode(open('publisher/queue.json','rb').read()).decode('ascii')
          payload={'message':'Publish emergency 1+1 Deluxe queue','content':content,'sha':sha,'branch':'main'}
          open('/tmp/q.json','w',encoding='utf-8').write(json.dumps(payload))
          PY
          gh api "repos/${GITHUB_REPOSITORY}/contents/publisher/queue.json" --method PUT --input /tmp/q.json >/dev/null

      - name: Replace latest release with the two new Reels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf /tmp/fast-release
          mkdir -p /tmp/fast-release
          while IFS= read -r -d '' file; do
            rel="${file#publisher/media/generated/}"
            safe="${rel//\//__}"
            cp "$file" "/tmp/fast-release/$safe"
          done < <(find publisher/media/generated -type f -name '*.mp4' -print0)
          cp publisher/queue.json /tmp/fast-release/queue.json
          gh release delete social-preview-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create social-preview-latest /tmp/fast-release/* \
            --title "PRONTI ORA - F1 Immobiliare + Real Media Pro" \
            --notes "Pacchetto urgente del 18/08/2026: 1 Reel Deluxe F1 Immobiliare + 1 Reel Deluxe Real Media Pro. Gli altri contenuti della giornata seguono nel flusso ordinario."

      - name: Notify completion
        uses: actions/github-script@v8
        with:
          script: |
            const title='[FAST TODAY] 1 F1 + 1 RMP pronti';
            const body=[
              '@josephsocialmedia2-spec i due contenuti prioritari sono pronti.',
              '',
              'Download: https://github.com/josephsocialmedia2-spec/open-social-scheduler/releases/tag/social-preview-latest',
              'Controllo: https://josephsocialmedia2-spec.github.io/open-social-scheduler/monday-control.html',
              'Run: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            ].join('\n');
            await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body,assignees:['josephsocialmedia2-spec']});
