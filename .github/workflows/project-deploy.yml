name: F1 Project Deploy Validation

on:
  push:
    paths:
      - '.project-deploy-trigger'
      - 'publisher/**'
      - '.github/workflows/project-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r publisher/requirements.txt

      - name: Compile production pipeline
        run: |
          python -m py_compile publisher/final_asset_publisher.py
          python -m py_compile publisher/persist_final_queue_github.py
          python -m py_compile publisher/buffer_twice_daily.py
          python -m py_compile publisher/chatgpt_query_runner/core.py
          python -m py_compile publisher/chatgpt_query_runner/ui_driver.py
          python -m py_compile publisher/chatgpt_query_runner/worker.py
          python -m py_compile publisher/manual_asset_inbox/server.py

      - name: Test F1 graphics state machine
        run: python -m unittest discover -s publisher/chatgpt_query_runner/tests -v

      - name: Validate exact image prompts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from publisher.chatgpt_query_runner.core import build_prompt

          payload = json.loads(Path('publisher/github_graphics/queries.json').read_text(encoding='utf-8'))
          rows = payload.get('queries') or []
          assert len(rows) >= 4, 'Expected at least 4 F1 queries'
          for row in rows:
              q = ' '.join(str(row['query']).split())
              expected = f"Genera un'immagine ultrarealistica, usa i modelli che abbiamo caricato per cerchiamo {q}."
              actual = build_prompt(row['query'])
              assert actual == expected, (row.get('id'), actual, expected)
              assert actual != q
          print('Exact uploaded-model F1 image prompt contract OK')
          PY

      - name: Validate production queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('publisher/final_content_queue.json').read_text(encoding='utf-8'))
          assert data['pipeline'] == 'f1-final-assets'
          assert data['asset_policy'] == 'immutable-final-layout'
          assert data['brand'] == 'F1 Immobiliare'
          platforms=set(data['platforms'])
          assert {'facebook','instagram'}.issubset(platforms)
          assert platforms.issubset({'facebook','instagram','linkedin'})
          print('Queue schema OK')
          PY

      - name: Validate F1 collection and launchers
        run: |
          python - <<'PY'
          from pathlib import Path
          server = Path('publisher/manual_asset_inbox/server.py').read_text(encoding='utf-8')
          worker = Path('publisher/chatgpt_query_runner/worker.py').read_text(encoding='utf-8')
          driver = Path('publisher/chatgpt_query_runner/ui_driver.py').read_text(encoding='utf-8')
          runner_requirements = Path('publisher/chatgpt_query_runner/requirements.txt').read_text(encoding='utf-8')
          installer = Path('publisher/f1_graphics_automation/INSTALLA_AUTOMAZIONE_23.ps1').read_text(encoding='utf-8')
          assert '8877' in server
          assert '/api/generated' in server
          assert '/api/communications' in server
          assert 'chatgpt_generated' in server
          assert 'COMMUNICATIONS_FILE' in server
          assert '_communication_hash' in server and '_recent_duplicate' in server
          assert '"communication_hash": digest' in server
          assert 'IMMAGINE_SALVATA' in worker and 'advance_after_completed' in worker
          assert 'auto_ingest_completed_run' in worker
          assert '--communication-id' in worker
          assert 'Selenium' not in worker
          assert '_validate_image_file' in driver
          assert 'Image.open(path)' in driver
          assert 'Pillow==11.3.0' in runner_requirements
          assert "New-ScheduledTaskTrigger -Daily -At 23:00" in installer
          assert "F1 AUTOPUBLISHER.lnk" in installer
          for path in [
              'publisher/f1_graphics_automation/AVVIA_F1_GRAFICHE_ORA.bat',
              'publisher/f1_graphics_automation/PROVA_ORA.bat',
              'publisher/f1_graphics_automation/PROVA_4_QUERY.bat',
              'publisher/f1_graphics_automation/APRI_RACCOLTA_GRAFICHE.bat',
              'publisher/manual_asset_inbox/index.html',
              'publisher/manual_asset_inbox/morning_notice.html',
              '.github/workflows/f1-final-assets-publisher.yml',
          ]:
              assert Path(path).exists(), path
          final_publisher = Path('publisher/final_asset_publisher.py').read_text(encoding='utf-8')
          buffer_base = Path('publisher/buffer_twice_daily.py').read_text(encoding='utf-8')
          assert 'communications-only' in final_publisher
          assert 'exclude-communications' in final_publisher
          assert 'refresh_publication_status' in final_publisher
          assert 'mark_job' in final_publisher
          assert '"attempt_count"' in final_publisher
          assert '"last_step"' in final_publisher
          assert '"last_error"' in final_publisher
          assert '"PUBLISHED"' in final_publisher
          assert 'get_buffer_post' in buffer_base
          assert 'post_type = "reel" if is_reel else "post"' in buffer_base
          persistence = Path('publisher/persist_final_queue_github.py').read_text(encoding='utf-8')
          assert 'merge_queue' in persistence and 'MAX_ATTEMPTS = 5' in persistence
          workflow = Path('.github/workflows/f1-final-assets-publisher.yml').read_text(encoding='utf-8')
          prepare = Path('publisher/prepare_villar_plan.py').read_text(encoding='utf-8')
          generator = Path('publisher/generate_next_villar_asset.py').read_text(encoding='utf-8')
          assert '--communications-only' in workflow and '--verify' in workflow
          assert 'extras=' in prepare and 'preserved external jobs' in prepare
          assert "startswith('VD-')" in generator
          print('F1 autonomous publication contract OK')
          PY

      - name: Deployment summary
        run: |
          echo 'F1 deployment validation completed successfully.'
          echo 'Prompt contract: uploaded F1 models + search query.'
          echo 'Graphics flow: client communication -> normal Chrome -> verified prompt -> verified image -> autonomous ingest -> GitHub -> Buffer -> provider verification -> PUBLISHED.'
