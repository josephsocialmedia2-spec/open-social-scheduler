name: Open Social Engine - 6 Every 4 Hours

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional local date YYYY-MM-DD for controlled test/backfill'
        required: false
        type: string
  schedule:
    - cron: '0 * * * *'
  push:
    paths:
      - '.github/workflows/social-engine-daily.yml'
      - 'publisher/build_cycle_queue.py'
      - 'publisher/enrich_cycle.py'
      - 'publisher/apply_f1_priority_reels.py'
      - 'publisher/apply_rmp_priority_reels.py'
      - 'publisher/research_signals.py'
      - 'publisher/enrich_queue.py'
      - 'publisher/render_reels.py'
      - 'publisher/render_fresh_visuals.py'
      - 'publisher/render_shopify_reels.py'
      - 'publisher/requirements.txt'
      - 'publisher/query_history.json'
      - 'publisher/image_history.json'
      - 'publisher/clients/**'
      - 'publisher/content_bank/**'
      - 'publisher/approvals/**'
      - 'publisher/assets/**'
      - 'publisher/tests/**'

permissions:
  contents: write
  issues: write

concurrency:
  group: open-social-engine-4h
  cancel-in-progress: true

jobs:
  rome-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      cycle_hour: ${{ steps.check.outputs.cycle_hour }}
      rome_time: ${{ steps.check.outputs.rome_time }}
    steps:
      - id: check
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Europe/Rome'))
          event = os.environ.get('GITHUB_EVENT_NAME', '')
          cycle_hours = (0, 4, 8, 12, 16, 20)
          if event == 'schedule':
              run = now.hour in cycle_hours
              hour = now.hour if run else max(h for h in cycle_hours if h <= now.hour)
          else:
              run = True
              hour = max(h for h in cycle_hours if h <= now.hour)
          print(f"run={'true' if run else 'false'}")
          print(f"cycle_hour={hour}")
          print(f"rome_time={now.isoformat()}")
          PY

  build-render-prepare:
    needs: rome-gate
    if: needs.rome-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SOCIAL_DATE: ${{ inputs.date }}
      SOCIAL_CYCLE_HOUR: ${{ needs.rome-gate.outputs.cycle_hour }}
      SOCIAL_RESET_LEGACY: '1'
      PIPER_DATA_DIR: ${{ github.workspace }}/.cache/piper
      SOCIAL_PHOTO_CACHE: ${{ github.workspace }}/.cache/social-photos

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install Deluxe production dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core zip
          python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Cache voice and discovered media
        uses: actions/cache@v5
        with:
          path: |
            .cache/piper
            .cache/social-photos
          key: social-assets-v12-f1-rmp-2sec-shopify-original

      - name: Prepare Italian female fallback voice
        shell: bash
        run: |
          mkdir -p "$PIPER_DATA_DIR" "$SOCIAL_PHOTO_CACHE"
          if [ ! -f "$PIPER_DATA_DIR/it_IT-paola-medium.onnx" ]; then
            python -m piper.download_voices it_IT-paola-medium --data-dir "$PIPER_DATA_DIR"
          fi

      - name: Validate Python
        run: |
          python -m py_compile publisher/*.py
          python -m unittest discover -s publisher/tests -v

      - name: Collect fresh research queries
        run: python publisher/research_signals.py

      - name: Build exactly 6 contents for this 4-hour cycle
        run: python publisher/build_cycle_queue.py

      - name: Enrich only this cycle
        run: python publisher/enrich_cycle.py

      - name: Lock F1 to homes and recruiting Reels
        run: python publisher/apply_f1_priority_reels.py

      - name: Lock Real Media Pro to original Shopify-inspired Reels
        run: python publisher/apply_rmp_priority_reels.py

      - name: Render licensed fresh source photography
        run: python publisher/render_fresh_visuals.py

      - name: Compose original Shopify-inspired RMP Reel graphics
        run: python publisher/render_shopify_reels.py

      - name: Reconcile generated media state without rebuilding content
        run: python publisher/build_cycle_queue.py --reconcile-only

      - name: Verify publication-ready cycle
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.load(open('publisher/queue.json',encoding='utf-8'))
          key=q.get('current_cycle')
          jobs=[j for j in q.get('jobs',[]) if j.get('cycle_key')==key]
          assert len(jobs)==6, len(jobs)
          assert sum(j.get('format')=='reel' for j in jobs)==4
          assert sum(j.get('format')=='carousel' for j in jobs)==2
          assert all(len(j.get('visual_asset_urls') or [])==10 for j in jobs)

          f1=sorted([j for j in jobs if j.get('client_id')=='f1-immobiliare' and j.get('format')=='reel'],key=lambda j:int(j.get('cycle_position',0)))
          assert len(f1)==2
          assert f1[0].get('content_pillar')=='valuation-homes'
          assert f1[0].get('search_query_override')=='case in Valle di Susa'
          assert f1[1].get('content_pillar')=='real-estate-recruiting'
          assert all(float(j.get('image_change_seconds') or 0)==2 for j in f1)
          assert all(float(j.get('reel_duration_seconds') or 0)==20 for j in f1)
          assert all(str(j.get('caption') or '').strip() for j in f1)

          rmp=sorted([j for j in jobs if j.get('client_id')=='real-media-pro' and j.get('format')=='reel'],key=lambda j:int(j.get('cycle_position',0)))
          assert len(rmp)==2
          assert all(j.get('visual_mode')=='shopify-theme-inspired-original' for j in rmp)
          assert all(float(j.get('image_change_seconds') or 0)==2 for j in rmp)
          assert all(float(j.get('reel_duration_seconds') or 0)==20 for j in rmp)
          assert all(j.get('publication_ready') is True for j in rmp)
          assert all(str(j.get('caption') or '').strip() for j in rmp)
          assert all('themes.shopify.com' in str(j.get('design_reference_url') or '') for j in rmp)

          for j in jobs:
              media=j.get('media')
              paths=media if isinstance(media,list) else [media]
              for rel in paths:
                  p=Path(rel)
                  assert p.exists() and p.stat().st_size>0, rel
          print('VERIFIED: ready to download + captions. F1 and RMP reels = 10 images x 2 seconds / 20 seconds.')
          PY

      - name: Upload current-cycle package
        uses: actions/upload-artifact@v4
        with:
          name: social-deluxe-cycle-${{ github.run_id }}
          path: publisher/media/generated
          if-no-files-found: error
          retention-days: 7

      - name: Persist queue, query history and visual memory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for FILE in publisher/queue.json publisher/query_history.json publisher/research/latest.json publisher/image_history.json; do
            [ -f "$FILE" ] || continue
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=main" --jq '.sha' 2>/dev/null || true)
            python - "$FILE" "$SHA" <<'PY'
          import base64, json, sys
          file, sha = sys.argv[1], sys.argv[2]
          content = base64.b64encode(open(file,'rb').read()).decode('ascii')
          payload = {'message': f'Persist 4-hour Deluxe state: {file}', 'content': content, 'branch': 'main'}
          if sha:
              payload['sha'] = sha
          json.dump(payload, open('/tmp/payload.json','w',encoding='utf-8'))
          PY
            gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}" --method PUT --input /tmp/payload.json >/dev/null
          done

      - name: Replace latest release with this cycle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf /tmp/social-release
          mkdir -p /tmp/social-release
          while IFS= read -r -d '' file; do
            rel="${file#publisher/media/generated/}"
            safe="${rel//\//__}"
            cp "$file" "/tmp/social-release/$safe"
          done < <(find publisher/media/generated -type f -print0)
          for client in f1-immobiliare real-media-pro; do
            if [ -d "publisher/media/generated/$client" ]; then
              (cd "publisher/media/generated/$client" && zip -qr "/tmp/social-release/${client}__CICLO_CORRENTE.zip" .)
            fi
          done
          cp publisher/queue.json /tmp/social-release/queue.json
          cp publisher/image_history.json /tmp/social-release/image_history.json
          gh release delete social-preview-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create social-preview-latest /tmp/social-release/* \
            --title "REEL PRONTI + CAPTION - ciclo ${{ needs.rome-gate.outputs.cycle_hour }}:00" \
            --notes "File pronti da scaricare e pubblicare. F1: CASE IN VALLE DI SUSA + RICERCA PERSONALE. RMP: 2 Reel con grafiche originali ispirate al linguaggio visivo del Shopify Theme Store, senza copiare i temi. Tutti i Reel: 10 immagini, cambio ogni 2 secondi, durata 20 secondi. Le caption sono nella coda e nel Monday Control. Run ${GITHUB_RUN_ID}."

      - name: Notify final results only
        uses: actions/github-script@v8
        with:
          script: |
            const title='[CONTENUTI 4H] - risultati';
            const body=[
              '@josephsocialmedia2-spec ciclo completato.',
              '',
              '**REEL PRONTI DA SCARICARE + CAPTION PRONTE DA COPIARE.**',
              '**F1 Reel 1:** CASE IN VALLE DI SUSA / valutazione immobiliare.',
              '**F1 Reel 2:** RICERCA PERSONALE immobiliare.',
              '**Real Media Pro:** 2 Reel originali ispirati al linguaggio visuale Shopify Theme Store.',
              '**Regola Reel:** 10 immagini · cambio ogni 2 secondi · durata 20 secondi.',
              '',
              'Download: https://github.com/josephsocialmedia2-spec/open-social-scheduler/releases/tag/social-preview-latest',
              'Controllo + caption: https://josephsocialmedia2-spec.github.io/open-social-scheduler/monday-control.html',
              'Run: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            ].join('\n');
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'all',per_page:100});
            let issue=issues.find(i=>i.title===title);
            if(!issue){
              issue=(await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body,assignees:['josephsocialmedia2-spec']})).data;
            }else{
              if(issue.state!=='open') await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,state:'open'});
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,body});
            }
