name: F1 Daily Creative PC Immediate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'publisher/chatgpt_query_runner/F1_DAILY_CREATIVE_START'

permissions:
  contents: read

concurrency:
  group: f1-daily-creative-pc-immediate
  cancel-in-progress: true

jobs:
  execute-visible-browser:
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Windows interactive desktop
        shell: powershell
        run: |
          if ($env:OS -ne 'Windows_NT') {
            throw 'The connected self-hosted runner is not Windows.'
          }
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"
          Write-Host "USERNAME=$env:USERNAME"
          Write-Host "SESSIONNAME=$env:SESSIONNAME"
          if ($env:SESSIONNAME -eq 'Services') {
            throw 'Visible ChatGPT browser automation requires an interactive Windows desktop session.'
          }

      - name: Ensure Python dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check -r publisher\chatgpt_query_runner\requirements.txt
          python -m pip install --disable-pip-version-check -r publisher\manual_asset_inbox\requirements.txt
          python -m pip install --disable-pip-version-check -r publisher\requirements.txt

      - name: Open ChatGPT, generate exactly one graphic, download, brand and publish
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "publisher\f1_graphics_automation\RUN_F1_DAILY_CREATIVE_TEST.ps1"
