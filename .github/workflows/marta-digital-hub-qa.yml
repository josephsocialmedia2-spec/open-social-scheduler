name: Marta Digital Hub QA

on:
  pull_request:
    paths:
      - 'marta-digital-hub/**'
      - '.github/workflows/marta-digital-hub-qa.yml'
  push:
    branches:
      - 'qa-upload-storage-hardening'
      - 'qa-content-approval-hardening'
      - 'qa-calendar-leads-hardening'
      - 'qa-entry-security-backup'
    paths:
      - 'marta-digital-hub/**'
      - '.github/workflows/marta-digital-hub-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        shell: bash
        run: |
          node --check marta-digital-hub/core.js
          node --check marta-digital-hub/upload.js
          node --check marta-digital-hub/content.js
          node --check marta-digital-hub/content-hardening.js
          node --check marta-digital-hub/calendar-leads-hardening.js
          node --check marta-digital-hub/backup.js
          node --check marta-digital-hub/backup-crypto.mjs
          node --check marta-digital-hub/events.js

      - name: Upload and storage edge cases
        run: node marta-digital-hub/tests/upload-storage-qa.mjs

      - name: Content and approval edge cases
        run: node marta-digital-hub/tests/content-approval-qa.mjs

      - name: Calendar, Autopilot and Lead edge cases
        run: node marta-digital-hub/tests/calendar-leads-qa.mjs

      - name: Entry, security and encrypted backup
        run: node marta-digital-hub/tests/entry-backup-qa.mjs

      - name: Public frontend safety checks
        shell: bash
        run: |
          grep -q './upload.js?v=15' marta-digital-hub/app.html
          ! grep -n -E 'service_role|sb_secret_' marta-digital-hub/*.js marta-digital-hub/*.mjs marta-digital-hub/*.html
          grep -q 'marta-content-originals' marta-digital-hub/upload.js
          grep -q 'MARTA_MAX_VIDEO_BYTES' marta-digital-hub/upload.js
          grep -q 'content-hardening.js?v=13' marta-digital-hub/events.js
          grep -q 'calendar-leads-hardening.js?v=14' marta-digital-hub/events.js
          grep -q './events.js?v=15' marta-digital-hub/app.html
          grep -q 'backup.js?v=15' marta-digital-hub/events.js
          ! grep -n 'marta_claim_owner' marta-digital-hub/*.js marta-digital-hub/*.mjs marta-digital-hub/*.html
