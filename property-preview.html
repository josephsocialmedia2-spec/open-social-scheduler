<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>F1 · Anteprima grafica immobile</title>
  <style>
    :root{color-scheme:dark;--bg:#070907;--card:#101610;--green:#92C205;--text:#F7F7F4;--muted:#C7CDC8}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    main{max-width:1180px;margin:0 auto;padding:28px 20px 60px}.top{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
    h1{margin:0;font-size:clamp(26px,4vw,44px)} p{color:var(--muted);margin:8px 0 0}.badge{border:1px solid var(--green);color:var(--green);padding:10px 14px;border-radius:12px;font-weight:700}
    .panel{background:var(--card);border:1px solid #263126;border-radius:18px;padding:18px}.preview{display:block;width:min(100%,540px);height:auto;margin:auto;border-radius:12px;box-shadow:0 18px 55px rgba(0,0,0,.45)}
    .links{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.links a{color:#070907;background:var(--green);padding:11px 15px;border-radius:10px;text-decoration:none;font-weight:700}.links a.secondary{background:transparent;color:var(--text);border:1px solid #394539}
  </style>
</head>
<body>
<main>
  <div class="top"><div><h1>Anteprima grafica F1</h1><p>Render prodotto dal nuovo codice Python a partire dal JSON immobile.</p></div><div class="badge">1080 × 1350 · Python/Pillow</div></div>
  <section class="panel">
    <img id="preview" class="preview" src="property-preview/latest.jpg" alt="Anteprima grafica F1 Immobiliare">
    <div class="links"><a href="property-preview/latest.jpg" target="_blank">Apri JPG</a><a class="secondary" href="https://github.com/josephsocialmedia2-spec/open-social-scheduler/blob/main/publisher/render_property_preview.py" target="_blank">Vedi codice Python</a><a class="secondary" href="property-preview/meta.json" target="_blank">Vedi JSON usato</a></div>
  </section>
</main>
<script>document.getElementById('preview').src='property-preview/latest.jpg?v='+Date.now();</script>
</body>
</html>
