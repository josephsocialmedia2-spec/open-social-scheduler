<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Immobiliare · Feed contenuti</title>
<style>
:root{--bg:#fafafa;--ink:#0d0d0d;--muted:#737373;--line:#dbdbdb;--green:#4e9e15;--panel:#fff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button{font:inherit}.wrap{width:min(975px,100%);margin:auto;background:var(--bg);min-height:100vh}.profile{display:grid;grid-template-columns:180px 1fr;gap:36px;align-items:center;padding:34px 28px 28px}.avatar{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:#0b0d0b;border:6px solid #fff;box-shadow:0 0 0 2px var(--green);color:#fff;font-size:34px;font-weight:950;letter-spacing:.03em}.avatar span{color:#8bd400}.name{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.name h1{margin:0;font-size:25px;font-weight:500}.badge{font-size:12px;font-weight:800;padding:5px 8px;border-radius:8px;background:#efefef}.stats{display:flex;gap:34px;margin:20px 0 14px;font-size:15px}.stats b{font-weight:800}.bio{font-size:14px;line-height:1.45}.bio strong{display:block}.tabs{border-top:1px solid var(--line);display:flex;justify-content:center;gap:52px;height:52px}.tab{appearance:none;border:0;border-top:1px solid transparent;background:transparent;margin-top:-1px;padding:0 4px;font-size:12px;font-weight:750;letter-spacing:.08em;color:var(--muted);cursor:pointer}.tab.active{color:var(--ink);border-top-color:var(--ink)}.status{padding:10px 16px;color:var(--muted);font-size:12px;text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 4px 40px}.tile{position:relative;aspect-ratio:1/1;background:#eaeaea;overflow:hidden;cursor:pointer;border:0;padding:0}.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.38));pointer-events:none}.type{position:absolute;right:10px;top:9px;z-index:2;color:#fff;font-size:21px;text-shadow:0 1px 3px #000}.tile-title{position:absolute;left:10px;right:10px;bottom:9px;z-index:2;color:#fff;font-size:12px;line-height:1.15;font-weight:850;text-transform:uppercase;text-align:left;text-shadow:0 1px 4px #000;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.empty{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.post{width:min(1050px,100%);height:min(88vh,820px);background:#fff;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);border-radius:6px;overflow:hidden}.media{background:#000;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}.media video{width:100%;height:100%;object-fit:contain;background:#000}.carousel{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}.carousel img{max-width:100%;max-height:100%;object-fit:contain}.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.88);font-size:26px;cursor:pointer}.nav.prev{left:12px}.nav.next{right:12px}.counter{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;border-radius:999px;padding:5px 9px;font-size:11px}.side{display:flex;flex-direction:column;min-height:0}.posthead{padding:15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.mini{width:36px;height:36px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px;border:2px solid var(--green)}.posthead strong{font-size:14px}.caption{padding:16px;overflow:auto;white-space:pre-wrap;font-size:13px;line-height:1.55;flex:1}.caption h2{font-size:16px;margin:0 0 12px}.meta{border-top:1px solid var(--line);padding:12px 16px;font-size:11px;color:var(--muted)}.close{position:fixed;right:18px;top:12px;color:#fff;background:transparent;border:0;font-size:36px;cursor:pointer;z-index:60}.cta{margin-top:14px;padding:10px 11px;background:#eef6e9;border-left:4px solid var(--green);font-weight:700}.loading{opacity:.55}
@media(max-width:720px){.profile{grid-template-columns:88px 1fr;gap:18px;padding:22px 16px}.avatar{width:82px;height:82px;font-size:23px}.name h1{font-size:20px}.stats{gap:17px;font-size:13px;margin:12px 0}.bio{font-size:12px}.grid{gap:2px;padding:0 0 30px}.tile-title{font-size:9px;left:6px;right:6px;bottom:6px}.type{font-size:17px;right:6px;top:5px}.post{height:92vh;grid-template-columns:1fr;grid-template-rows:58% 42%;border-radius:0}.modal{padding:0}.side{min-height:0}.close{right:8px;top:2px}.tabs{gap:30px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="profile">
    <div class="avatar">F<span>1</span></div>
    <div>
      <div class="name"><h1>f1immobiliare</h1><span class="badge">ANTEPRIMA</span></div>
      <div class="stats"><span><b id="postCount">—</b> post</span><span><b id="reelCount">—</b> reel</span><span><b id="carCount">—</b> caroselli</span></div>
      <div class="bio"><strong>F1 Immobiliare</strong>Valle di Susa · contenuti generati dal Renderer V2<br>Anteprima feed reale prima della pubblicazione</div>
    </div>
  </section>
  <nav class="tabs">
    <button class="tab active" data-filter="all">▦ TUTTI</button>
    <button class="tab" data-filter="reel">▶ REEL</button>
    <button class="tab" data-filter="carousel">▣ CAROSELLI</button>
  </nav>
  <div id="status" class="status">Caricamento contenuti…</div>
  <main id="grid" class="grid"><div class="empty">Caricamento feed F1…</div></main>
</div>

<div id="modal" class="modal" aria-hidden="true">
  <button class="close" onclick="closePost()">×</button>
  <article class="post">
    <div id="modalMedia" class="media"></div>
    <div class="side">
      <div class="posthead"><div class="mini">F1</div><div><strong>f1immobiliare</strong><div id="modalType" style="font-size:11px;color:#777"></div></div></div>
      <div id="modalCaption" class="caption"></div>
      <div id="modalMeta" class="meta"></div>
    </div>
  </article>
</div>

<script>
const OWNER='josephsocialmedia2-spec',REPO='open-social-scheduler';
const RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/publisher/f1-feed-latest.json`;
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/publisher/f1-feed-latest.json?ref=main`;
const SAME=new URL('./publisher/f1-feed-latest.json',location.href).href;
let manifest=null, entries=[], filter='all', current=null, slideIndex=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const bust=u=>u+(u.includes('?')?'&':'?')+'t='+Date.now();
async function getJson(url,opts={}){const r=await fetch(bust(url),{cache:'no-store',...opts});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function loadManifest(){const errors=[];for(const [name,fn] of [['Pages',()=>getJson(SAME)],['Raw GitHub',()=>getJson(RAW)],['GitHub API',()=>getJson(API,{headers:{Accept:'application/vnd.github.raw+json'}})]]){try{const x=await fn();if(x?.pipeline!=='f1-instagram-feed-preview')throw new Error('manifest non valido');return{x,source:name};}catch(e){errors.push(name+': '+e.message)}}throw new Error(errors.join(' · '));}
function tile(e){const icon=e.format==='reel'?'▶':'▣';return `<button class="tile" data-id="${esc(e.id)}" onclick="openPost('${esc(e.id)}')"><img loading="lazy" src="${esc(e.thumbnail_url)}" alt="${esc(e.title)}"><span class="type">${icon}</span><span class="tile-title">${esc(e.title)}</span></button>`}
function render(){const rows=filter==='all'?entries:entries.filter(x=>x.format===filter);document.getElementById('grid').innerHTML=rows.length?rows.map(tile).join(''):'<div class="empty">Nessun contenuto in questo filtro.</div>';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));}
function openPost(id){current=entries.find(x=>x.id===id);if(!current)return;slideIndex=0;const m=document.getElementById('modal');m.classList.add('open');m.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.getElementById('modalType').textContent=current.format==='reel'?'Reel · Renderer V2':'Carosello · Renderer V2';document.getElementById('modalCaption').innerHTML=`<h2>${esc(current.title)}</h2>${esc(current.caption)}${current.cta?`<div class="cta">${esc(current.cta)}</div>`:''}`;document.getElementById('modalMeta').textContent=`${current.content_date||''} · motore ${current.engine||'Renderer V2'} · quality gate ${current.quality_gate_passed?'OK':'—'}`;renderModalMedia();}
function renderModalMedia(){const box=document.getElementById('modalMedia');if(current.format==='reel'){box.innerHTML=`<video src="${esc(current.media_url)}" poster="${esc(current.thumbnail_url)}" controls autoplay muted playsinline></video>`;return;}const slides=current.slides||[];const src=slides[slideIndex]||current.thumbnail_url;box.innerHTML=`<div class="carousel"><img src="${esc(src)}" alt="slide ${slideIndex+1}">${slides.length>1?`<button class="nav prev" onclick="moveSlide(-1)">‹</button><button class="nav next" onclick="moveSlide(1)">›</button><div class="counter">${slideIndex+1}/${slides.length}</div>`:''}</div>`;}
function moveSlide(d){if(!current?.slides?.length)return;slideIndex=(slideIndex+d+current.slides.length)%current.slides.length;renderModalMedia();}
function closePost(){const m=document.getElementById('modal');m.classList.remove('open');m.setAttribute('aria-hidden','true');document.body.style.overflow='';const v=m.querySelector('video');if(v)v.pause();current=null;}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closePost()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePost();if(current?.format==='carousel'&&e.key==='ArrowRight')moveSlide(1);if(current?.format==='carousel'&&e.key==='ArrowLeft')moveSlide(-1)});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
(async()=>{const st=document.getElementById('status');try{const r=await loadManifest();manifest=r.x;entries=(manifest.entries||[]).slice().sort((a,b)=>String(b.scheduled_at||'').localeCompare(String(a.scheduled_at||'')));document.getElementById('postCount').textContent=manifest.count??entries.length;document.getElementById('reelCount').textContent=manifest.reels??entries.filter(x=>x.format==='reel').length;document.getElementById('carCount').textContent=manifest.carousels??entries.filter(x=>x.format==='carousel').length;st.textContent=`Aggiornato ${new Date(manifest.generated_at).toLocaleString('it-IT')} · ${manifest.count} contenuti · sorgente ${r.source}`;render();}catch(e){st.textContent='Feed non ancora disponibile: '+e.message;st.style.color='#b42318';document.getElementById('grid').innerHTML='<div class="empty">Sto aspettando la generazione del feed Renderer V2.</div>';}})();
</script>
</body>
</html>
