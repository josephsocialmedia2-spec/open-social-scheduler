<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Apertura Marta Digital Hub</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#14243d,#304c74 55%,#efdbe3);font-family:Inter,system-ui,sans-serif;color:white}.box{padding:28px;text-align:center}.spin{width:42px;height:42px;border:4px solid #ffffff44;border-top-color:white;border-radius:50%;margin:0 auto 16px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{opacity:.8}</style></head><body><div class="box"><div class="spin"></div><h2>Apro Marta Digital Hub…</h2><p>Caricamento della versione aggiornata.</p></div><script>(async()=>{try{let raw=localStorage.getItem('mr_session')||sessionStorage.getItem('mr_session');if(!raw){location.replace('./accesso.html?v=9');return}sessionStorage.setItem('mr_session',raw);let html=await fetch('./index.html?v=9',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Impossibile caricare il pannello');return r.text()});html=html.replace('<section id="login" class="login">','<section id="login" class="login" hidden>');html=html.replace('<script src="./core.js"></script>','<script src="./core.js?v=9"></script>');html=html.replace('<script src="./content.js"></script>','<script src="./content.js?v=9"></script>');html=html.replace('<script src="./events.js"></script>','<script src="./events.js?v=9"></script>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="box"><h2>Errore di caricamento</h2><p>'+String(e.message||e)+'</p><p><a style="color:white" href="./accesso.html?v=9">Torna all\'accesso</a></p></div>'}})();</script></body></html>
