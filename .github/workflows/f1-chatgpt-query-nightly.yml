name: F1 ChatGPT Query Manual Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-recovery:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: powershell
        run: |
          pip install -r publisher/chatgpt_query_runner/requirements.txt
          pip install -r publisher/manual_asset_inbox/requirements.txt

      - name: Run one recovery query
        shell: powershell
        env:
          F1_CHROME_PROFILE: ${{ vars.F1_CHROME_PROFILE }}
        run: python publisher/chatgpt_query_runner/worker.py --batch-size 1
