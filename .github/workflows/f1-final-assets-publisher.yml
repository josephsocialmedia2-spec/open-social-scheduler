name: F1 Final Assets Publisher

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate next READY final asset without creating Buffer posts'
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '0 8,16 * * *'
  push:
    paths:
      - '.github/workflows/f1-final-assets-publisher.yml'
      - 'publisher/final_asset_publisher.py'
      - 'publisher/final_content_queue.json'
      - 'publisher/final_assets/**'

permissions:
  contents: write

concurrency:
  group: f1-final-assets-publisher
  cancel-in-progress: false

jobs:
  publish-final-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r publisher/requirements.txt

      - name: Validate immutable final asset pipeline
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile publisher/final_asset_publisher.py publisher/buffer_twice_daily.py
          python -m json.tool publisher/final_content_queue.json >/dev/null
          python - <<'PY'
          import json
          q=json.load(open('publisher/final_content_queue.json',encoding='utf-8'))
          assert q.get('pipeline')=='f1-final-assets'
          assert q.get('asset_policy')=='immutable-final-layout'
          assert q.get('brand')=='F1 Immobiliare'
          assert q.get('platforms')==['facebook','instagram','linkedin']
          print('IMMUTABLE FINAL ASSET PIPELINE VALIDATED')
          PY

      - name: Publish next READY final asset
        shell: bash
        run: |
          set -euo pipefail
          DRY='${{ inputs.dry_run }}'
          if [ "$DRY" = "true" ]; then
            python publisher/final_asset_publisher.py --dry-run
          else
            python publisher/final_asset_publisher.py
          fi

      - name: Persist final asset queue state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'f1-final-assets-publisher'
          git config user.email 'f1-final-assets-publisher@users.noreply.github.com'
          git add publisher/final_content_queue.json
          if git diff --cached --quiet; then
            echo 'No final queue state changes to persist.'
            exit 0
          fi
          git commit -m 'Persist F1 final asset publication state'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Status
        if: always()
        run: |
          echo 'Source: publisher/final_assets + publisher/final_content_queue.json'
          echo 'Policy: immutable final layouts; no rendering/crop/resize/overlays'
          echo 'Targets: Facebook + Instagram + LinkedIn through Buffer'
          echo 'Scheduled checks: 10:00 and 18:00 Europe/Rome equivalent GitHub cron; Buffer uses each job scheduled_at'
