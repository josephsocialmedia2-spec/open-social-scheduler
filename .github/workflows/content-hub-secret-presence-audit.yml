name: Content Hub Secret Presence Audit

on:
  push:
    branches: [main]
    paths:
      - '.content-hub-secret-audit-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      F1_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.F1_FACEBOOK_PAGE_ACCESS_TOKEN }}
      F1_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.F1_INSTAGRAM_ACCESS_TOKEN }}
      F1_INSTAGRAM_USER_ID: ${{ secrets.F1_INSTAGRAM_USER_ID }}
      F1_LINKEDIN_ACCESS_TOKEN: ${{ secrets.F1_LINKEDIN_ACCESS_TOKEN }}
      F1_LINKEDIN_AUTHOR_URN: ${{ secrets.F1_LINKEDIN_AUTHOR_URN }}
      RMP_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.RMP_FACEBOOK_PAGE_ACCESS_TOKEN }}
      RMP_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.RMP_INSTAGRAM_ACCESS_TOKEN }}
      RMP_INSTAGRAM_USER_ID: ${{ secrets.RMP_INSTAGRAM_USER_ID }}
      RMP_LINKEDIN_ACCESS_TOKEN: ${{ secrets.RMP_LINKEDIN_ACCESS_TOKEN }}
      RMP_LINKEDIN_AUTHOR_URN: ${{ secrets.RMP_LINKEDIN_AUTHOR_URN }}
      RMP_TIKTOK_ACCESS_TOKEN: ${{ secrets.RMP_TIKTOK_ACCESS_TOKEN }}
      RMP_YOUTUBE_CLIENT_ID: ${{ secrets.RMP_YOUTUBE_CLIENT_ID }}
      RMP_YOUTUBE_CLIENT_SECRET: ${{ secrets.RMP_YOUTUBE_CLIENT_SECRET }}
      RMP_YOUTUBE_REFRESH_TOKEN: ${{ secrets.RMP_YOUTUBE_REFRESH_TOKEN }}
      RMP_PINTEREST_ACCESS_TOKEN: ${{ secrets.RMP_PINTEREST_ACCESS_TOKEN }}
      RMP_PINTEREST_BOARD_ID: ${{ secrets.RMP_PINTEREST_BOARD_ID }}
      LASACRA_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.LASACRA_FACEBOOK_PAGE_ACCESS_TOKEN }}
      LASACRA_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.LASACRA_INSTAGRAM_ACCESS_TOKEN }}
      LASACRA_INSTAGRAM_USER_ID: ${{ secrets.LASACRA_INSTAGRAM_USER_ID }}
      ANTICACAPPELLA_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.ANTICACAPPELLA_FACEBOOK_PAGE_ACCESS_TOKEN }}
      ANTICACAPPELLA_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.ANTICACAPPELLA_INSTAGRAM_ACCESS_TOKEN }}
      ANTICACAPPELLA_INSTAGRAM_USER_ID: ${{ secrets.ANTICACAPPELLA_INSTAGRAM_USER_ID }}
      MARTA_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.MARTA_FACEBOOK_PAGE_ACCESS_TOKEN }}
      MARTA_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.MARTA_INSTAGRAM_ACCESS_TOKEN }}
      MARTA_INSTAGRAM_USER_ID: ${{ secrets.MARTA_INSTAGRAM_USER_ID }}
      CARTOLIBRERIA10ELODE_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.CARTOLIBRERIA10ELODE_FACEBOOK_PAGE_ACCESS_TOKEN }}
      CARTOLIBRERIA10ELODE_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.CARTOLIBRERIA10ELODE_INSTAGRAM_ACCESS_TOKEN }}
      CARTOLIBRERIA10ELODE_INSTAGRAM_USER_ID: ${{ secrets.CARTOLIBRERIA10ELODE_INSTAGRAM_USER_ID }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Cloudinary SDK
        run: pip install cloudinary==1.46.2
      - name: Cloudinary usage guard probe
        shell: bash
        run: |
          python - <<'PY'
          import os
          if not os.getenv('CLOUDINARY_URL','').strip():
              print('CLOUDINARY_USAGE=SKIPPED secret_missing')
              raise SystemExit(0)
          import cloudinary
          import cloudinary.api
          cloudinary.config(secure=True)
          usage=cloudinary.api.usage() or {}
          credits=usage.get('credits') or {}
          storage=usage.get('storage') or {}
          print('CLOUDINARY_PLAN='+str(usage.get('plan') or 'unknown'))
          print('CLOUDINARY_CREDITS_USED_PERCENT='+str(credits.get('used_percent','unknown')))
          print('CLOUDINARY_STORAGE_USED_PERCENT='+str(storage.get('used_percent','unknown')))
          PY
      - name: Report presence only
        shell: bash
        run: |
          python - <<'PY'
          import os
          names=[
            'SUPABASE_SERVICE_ROLE_KEY','CLOUDINARY_URL','CLOUDINARY_CLOUD_NAME','CLOUDINARY_API_KEY','CLOUDINARY_API_SECRET',
            'F1_FACEBOOK_PAGE_ACCESS_TOKEN','F1_INSTAGRAM_ACCESS_TOKEN','F1_INSTAGRAM_USER_ID','F1_LINKEDIN_ACCESS_TOKEN','F1_LINKEDIN_AUTHOR_URN',
            'RMP_FACEBOOK_PAGE_ACCESS_TOKEN','RMP_INSTAGRAM_ACCESS_TOKEN','RMP_INSTAGRAM_USER_ID','RMP_LINKEDIN_ACCESS_TOKEN','RMP_LINKEDIN_AUTHOR_URN','RMP_TIKTOK_ACCESS_TOKEN','RMP_YOUTUBE_CLIENT_ID','RMP_YOUTUBE_CLIENT_SECRET','RMP_YOUTUBE_REFRESH_TOKEN','RMP_PINTEREST_ACCESS_TOKEN','RMP_PINTEREST_BOARD_ID',
            'LASACRA_FACEBOOK_PAGE_ACCESS_TOKEN','LASACRA_INSTAGRAM_ACCESS_TOKEN','LASACRA_INSTAGRAM_USER_ID',
            'ANTICACAPPELLA_FACEBOOK_PAGE_ACCESS_TOKEN','ANTICACAPPELLA_INSTAGRAM_ACCESS_TOKEN','ANTICACAPPELLA_INSTAGRAM_USER_ID',
            'MARTA_FACEBOOK_PAGE_ACCESS_TOKEN','MARTA_INSTAGRAM_ACCESS_TOKEN','MARTA_INSTAGRAM_USER_ID',
            'CARTOLIBRERIA10ELODE_FACEBOOK_PAGE_ACCESS_TOKEN','CARTOLIBRERIA10ELODE_INSTAGRAM_ACCESS_TOKEN','CARTOLIBRERIA10ELODE_INSTAGRAM_USER_ID',
          ]
          for name in names:
              print(f'{name}=' + ('PRESENTE' if os.getenv(name,'').strip() else 'MANCANTE'))
          PY
