<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Attiva Marta Digital Hub</title><style>body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(145deg,#14243d,#304c74 55%,#efdbe3);min-height:100vh;display:grid;place-items:center;padding:20px;color:#172033}.card{width:min(440px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 25px 70px #0004;box-sizing:border-box}.mark{width:56px;height:56px;border-radius:18px;background:#efd9e1;display:grid;place-items:center;font:700 22px Georgia;color:#432c36}h1{margin:14px 0 6px}p{line-height:1.5;color:#69748a}label{display:grid;gap:6px;margin:12px 0;font-weight:650}input{width:100%;box-sizing:border-box;padding:.8rem;border:1px solid #dfe4ec;border-radius:10px;font:inherit}button{width:100%;margin-top:10px;border:0;border-radius:11px;background:#27456f;color:white;padding:.8rem;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.58;cursor:wait}.ghost{background:#fff;color:#27456f;border:1px solid #dfe4ec}.msg{min-height:24px;margin-top:14px;font-size:14px;color:#5f6c82}.bad{color:#a13848}.ok{color:#237158}.sep{border-top:1px solid #e5e9f0;margin:22px 0}.small{font-size:12px}</style></head><body><main class="card"><div class="mark">MR</div><h1>Marta Ruffino Digital Hub</h1><p>Attivazione sicura del tuo accesso personale.</p><section id="auth"><label>Email<input id="email" type="email" autocomplete="username" required maxlength="254"></label><label>Password (almeno 8 caratteri)<input id="password" type="password" minlength="8" maxlength="256" autocomplete="current-password" required></label><button id="create" type="button">Crea accesso Marta</button><button id="login" type="button" class="ghost">Ho già creato l'accesso · Accedi</button><div id="authmsg" class="msg" aria-live="polite">Pagina pronta. Inserisci email e password.</div></section><section id="claim" hidden><div class="sep"></div><h2>Attiva il Digital Hub</h2><p>Inserisci il codice proprietario monouso ricevuto in questa chat.</p><label>Codice<input id="code" autocomplete="one-time-code" required></label><button id="activate" type="button">Attiva ora</button><div id="claimmsg" class="msg" aria-live="polite"></div></section><p class="small">Modalità FREE-ONLY €0 · nessuna password viene salvata in questa pagina.</p></main><script>
const U='https://nqnmlsmeiynxbdojeyjt.supabase.co',K='sb_publishable_Clz5qPTkTtvwV0rqWTcfMQ_sCDSRgnu',TIMEOUT_MS=15000;let S=null,busy=false;
const g=id=>document.getElementById(id),msg=(id,t,b=false)=>{g(id).textContent=t;g(id).className='msg '+(b?'bad':'ok')};
function setBusy(on){busy=!!on;['create','login','activate'].forEach(id=>{const el=g(id);if(el)el.disabled=busy})}
function friendlyError(err){if(err?.name==='AbortError')return 'La richiesta sta impiegando troppo tempo. Controlla la connessione e riprova.';const raw=String(err?.message||err||'Operazione non riuscita');if(/failed to fetch|networkerror|load failed|network request failed/i.test(raw))return 'Connessione non disponibile. I dati inseriti sono rimasti nella pagina: controlla la rete e riprova.';if(/invalid login credentials/i.test(raw))return 'Email o password non corrette.';if(/email not confirmed/i.test(raw))return 'Email non ancora confermata.';if(/rate limit|too many/i.test(raw))return 'Troppi tentativi. Riprova più tardi.';return raw}
async function request(url,opt={}){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),TIMEOUT_MS);try{return await fetch(url,{...opt,signal:ctl.signal})}finally{clearTimeout(timer)}}
async function post(path,body,token=''){let r;try{r=await request(U+path,{method:'POST',headers:{apikey:K,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)})}catch(e){throw Error(friendlyError(e))}let tx=await r.text(),d;try{d=tx?JSON.parse(tx):{}}catch{d={message:tx}}if(!r.ok)throw Error(friendlyError(d.msg||d.message||d.error_description||d.error||('Errore '+r.status)));return d}
function persistSession(d){if(!d?.access_token||!d?.refresh_token||!d?.user?.id)throw Error('Sessione di accesso non valida.');S=d;const raw=JSON.stringify(S);localStorage.setItem('mr_session',raw);sessionStorage.setItem('mr_session',raw)}
async function save(d){if(!d?.access_token){throw Error('Accesso creato. Se Supabase ti ha inviato una mail, confermala e poi premi “Accedi”.')}persistSession(d);let r;try{r=await request(U+'/rest/v1/marta_profiles?id=eq.'+encodeURIComponent(S.user.id)+'&select=id',{headers:{apikey:K,Authorization:'Bearer '+S.access_token}})}catch(e){throw Error(friendlyError(e))}let a=await r.json().catch(()=>[]);if(!r.ok)throw Error('Accesso riuscito, ma non riesco a verificare il profilo. Riprova tra poco.');if(Array.isArray(a)&&a.length){location.replace('./app.html?v=12');return true}g('claim').hidden=false;msg('authmsg','Accesso riconosciuto. Ora inserisci il codice di attivazione.');return false}
function credentials(){const email=g('email'),password=g('password'),e=email.value.trim().toLowerCase(),p=password.value;if(!email.checkValidity()){msg('authmsg','Inserisci un indirizzo email valido.',true);email.focus();return null}if(p.length<8){msg('authmsg','La password deve avere almeno 8 caratteri.',true);password.focus();return null}return{email:e,password:p}}
g('create').onclick=async()=>{if(busy)return;const c=credentials();if(!c)return;setBusy(true);msg('authmsg','Sto creando il tuo accesso…');try{let d=await post('/auth/v1/signup?redirect_to='+encodeURIComponent(location.origin+location.pathname),{email:c.email,password:c.password,data:{display_name:'Marta Ruffino'}});await save(d)}catch(x){const t=friendlyError(x);msg('authmsg',t,!t.startsWith('Accesso creato.'))}finally{setBusy(false)}};
g('login').onclick=async()=>{if(busy)return;const c=credentials();if(!c)return;setBusy(true);msg('authmsg','Accesso in corso…');try{let d=await post('/auth/v1/token?grant_type=password',{email:c.email,password:c.password});await save(d)}catch(x){msg('authmsg',friendlyError(x),true)}finally{setBusy(false)}};
g('activate').onclick=async()=>{if(busy)return;if(!S){msg('claimmsg','Prima accedi con email e password.',true);return}let c=g('code').value.trim();if(!c){msg('claimmsg','Inserisci il codice.',true);return}setBusy(true);msg('claimmsg','Attivazione in corso…');try{await post('/rest/v1/rpc/marta_claim_owner',{p_code:c},S.access_token);msg('claimmsg','Attivazione completata. Apro il Digital Hub…');setTimeout(()=>location.replace('./app.html?v=12'),500)}catch(x){msg('claimmsg',friendlyError(x),true)}finally{setBusy(false)}};
window.addEventListener('error',()=>msg('authmsg','Errore tecnico della pagina. Ricarica una volta; se resta, comunicamelo.',true),true);
</script></body></html>
